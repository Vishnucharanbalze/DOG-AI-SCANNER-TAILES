<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>AI Dog Scanner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --cobalt: #2340c9;
  --navy: #141d52;
  --sky: #eef2fc;
  --white: #ffffff;
  --ribbon-blue: #2340c9;
  --ribbon-red: #cf2439;
  --ribbon-yellow: #f6bb12;
  --butter: #ffcf33;
  --muted: #4c5687;
  --line: #cdd6f2;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100%; background: var(--cobalt); color: var(--navy); font: 400 1.0625rem/1.55 var(--body); }
[hidden] { display: none !important; }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--butter); outline-offset: 3px; }
.result :focus-visible { outline-color: var(--cobalt); }

.service-notice { background: var(--butter); color: var(--navy); padding: .75rem 1.25rem; font-weight: 700; text-align: center; }

.home { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr); gap: clamp(1.5rem, 5vw, 5rem); align-items: end; padding-block: clamp(1.25rem, 5vw, 4.5rem); padding-left: max(clamp(16px, 5vw, 4.5rem), env(safe-area-inset-left, 0px)); padding-right: max(clamp(16px, 5vw, 4.5rem), env(safe-area-inset-right, 0px)); color: var(--white); }
.pitch { align-self: center; }
h1 { font: 800 clamp(3.75rem, 9.4vw, 10rem)/.86 var(--display); letter-spacing: -.035em; margin: 0 0 1.75rem; color: var(--white); }
.subtitle { font: 500 clamp(1.3rem, 2.4vw, 2rem)/1.2 var(--display); margin: 0 0 1rem; max-width: 24em; }
.fineprint { margin: 0; max-width: 34em; color: #dbe2ff; font-size: 1rem; }

.scanner { display: flex; flex-direction: column; align-items: stretch; width: 100%; max-width: 30rem; justify-self: end; }
.kennel { position: relative; aspect-ratio: 4 / 5; width: 100%; background: var(--white); border-radius: 50% 50% 0 0 / 40% 40% 0 0; overflow: hidden; color: var(--cobalt); display: grid; place-items: center; cursor: pointer; transition: transform .15s ease; }
.kennel.dragging { transform: scale(1.02); box-shadow: 0 0 0 6px var(--butter); }
.kennel img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.kennel-empty { display: flex; flex-direction: column; align-items: center; gap: .6rem; padding: 2rem; text-align: center; margin-top: 3rem; }
.drop-line { font: 800 1.75rem/1.1 var(--display); color: var(--navy); }
.drop-hint { color: var(--muted); font-size: .95rem; }

.sweep { position: absolute; left: 0; right: 0; height: 22%; top: -22%; background: linear-gradient(to bottom, rgba(255,207,51,0), rgba(255,207,51,.75)); border-bottom: 4px solid var(--butter); animation: sweep 1.5s ease-in-out infinite alternate; }
@keyframes sweep { to { top: 100%; } }
@media (prefers-reduced-motion: reduce) { .sweep { animation: none; top: 39%; } .kennel { transition: none; } }

.button { display: inline-flex; justify-content: center; align-items: center; min-height: 3.1rem; padding: .6rem 1.5rem; border: 2px solid transparent; border-radius: 4px; font: 800 1.15rem/1 var(--display); }
.button.primary { background: var(--butter); color: var(--navy); }
.button.primary:disabled { background: #6f83e0; color: #dfe5ff; cursor: not-allowed; }
.button.ghost { background: var(--cobalt); color: var(--white); }
.button.outline { background: transparent; color: var(--navy); border-color: var(--navy); }
.actions { display: flex; flex-direction: column; gap: .6rem; margin-top: 0; }
.actions .button { width: 100%; }
.linkish { background: none; border: 0; color: var(--white); text-decoration: underline; padding: .4rem; }
.scan-status { min-height: 1.6em; margin: .7rem 0 .3rem; text-align: center; font-weight: 700; }
.error { background: var(--white); color: var(--navy); border-left: 8px solid var(--ribbon-red); padding: .8rem 1rem; margin-bottom: .75rem; }

.result { background: var(--sky); display: grid; grid-template-columns: minmax(15rem, 22rem) minmax(0, 46rem); gap: clamp(1.5rem, 5vw, 4.5rem); padding-block: clamp(1.25rem, 4vw, 3.5rem); padding-left: max(16px, 4vw, env(safe-area-inset-left, 0px)); padding-right: max(16px, 4vw, env(safe-area-inset-right, 0px)); justify-content: center; align-items: start; }
.result-photo { position: sticky; top: 2rem; }
.kennel.small { cursor: default; background: var(--line); }
.result-buttons { display: flex; flex-direction: column; gap: .6rem; margin-top: 1rem; }
.result-buttons .button.primary { background: var(--cobalt); color: var(--white); }

.verdict-label { font: 500 1.25rem/1.2 var(--display); color: var(--muted); margin: 0; }
.verdict h2 { font: 800 clamp(2.75rem, 7.5vw, 5.25rem)/.95 var(--display); letter-spacing: -.025em; margin: .15rem 0 .75rem; color: var(--cobalt); overflow-wrap: anywhere; }
.verdict.uncertain h2 { color: var(--navy); }
.callout { background: var(--white); border-left: 8px solid var(--ribbon-yellow); padding: .75rem 1rem; margin: .75rem 0; }
.callout p { margin: 0; }
.callout p + p { margin-top: .4rem; }

section.block { margin-top: 2.75rem; }
section.block > h3 { font: 800 1.7rem/1.1 var(--display); margin: 0 0 1rem; }
.ribbon-row { margin-bottom: 1rem; }
.ribbon-head { display: flex; justify-content: space-between; gap: 1rem; font-weight: 700; }
.ribbon-track { height: 1.5rem; }
.ribbon { height: 100%; min-width: 2.2rem; clip-path: polygon(0 0, 100% 0, calc(100% - .75rem) 50%, 100% 100%, 0 100%); }
.ribbon.r0 { background: var(--ribbon-blue); } .ribbon.r1 { background: var(--ribbon-red); } .ribbon.r2 { background: var(--ribbon-yellow); }
.note { color: var(--muted); font-size: .95rem; margin: .5rem 0 0; max-width: 62ch; }

dl.facts { margin: 0; }
.fact { display: grid; grid-template-columns: 11rem minmax(0, 1fr); gap: .25rem 1rem; padding: .8rem 0; border-top: 1px solid var(--line); }
.fact dt { font-weight: 700; }
.fact dd { margin: 0; }
.fact .value { font-weight: 700; }
.fact .value.plain { font-weight: 400; }
.fact small { display: block; color: var(--muted); font-size: .92rem; line-height: 1.4; margin-top: .15rem; }
.source { display: block; color: var(--muted); font-size: .85rem; margin-top: .25rem; font-style: italic; }
.source.official { color: var(--cobalt); font-style: normal; font-weight: 700; }
a { color: var(--cobalt); font-weight: 700; }
.akc-link { display: inline-block; margin-top: 1rem; }
.disclaimer { border-top: 2px solid var(--navy); margin-top: 3rem; padding-top: 1rem; color: var(--muted); font-size: .95rem; max-width: 66ch; }

@media (max-width: 820px) {
  h1 { font-size: clamp(3.75rem, 17vw, 8rem); }
  .home { grid-template-columns: 1fr; align-items: start; min-height: 0; }
  .scanner { justify-self: center; }
  .result { grid-template-columns: 1fr; }
  .result-photo { position: static; }
  .result-photo .kennel.small { max-width: 16rem; margin: 0 auto; }
  .fact { grid-template-columns: 1fr; }
}
.diet-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr)); gap: .9rem 1rem; align-items: end; margin-top: 1rem; }
.diet-form label { display: flex; flex-direction: column; gap: .3rem; font-weight: 700; font-size: .95rem; min-width: 0; }
.diet-form label.check { flex-direction: row; align-items: center; gap: .5rem; min-height: 2.9rem; }
.diet-form input[type=number], .diet-form select { font: inherit; font-weight: 400; color: var(--navy); background: var(--white); border: 2px solid var(--line); border-radius: 4px; padding: .55rem .6rem; width: 100%; min-height: 2.9rem; }
.diet-form input[type=checkbox] { width: 1.25rem; height: 1.25rem; accent-color: var(--cobalt); }
.diet-go { grid-column: 1 / -1; }
.diet-form .diet-go.primary { background: var(--cobalt); color: var(--white); }
.diet-error { background: var(--white); border-left: 8px solid var(--ribbon-red); padding: .7rem 1rem; margin: 1rem 0 0; }
#diet-out h4 { font: 800 1.2rem/1.2 var(--display); margin: 1.5rem 0 .6rem; }
.meal-table { border-collapse: collapse; width: 100%; background: var(--white); margin-top: 1rem; font-variant-numeric: tabular-nums; }
.meal-table caption { text-align: left; font-weight: 700; padding-bottom: .4rem; }
.meal-table th, .meal-table td { text-align: left; padding: .55rem .75rem; border-bottom: 1px solid var(--line); }
.tips { margin: 0; padding-left: 1.2rem; display: grid; gap: .3rem; }
.avoid { margin: 0; }
</style>


<main id="home" class="home">
  <section class="pitch">
    <h1>AI DOG SCANNER</h1>
    <p class="subtitle">Discover Your Dog's Breed, Coat and Characteristics.</p>
    <p class="fineprint">Knows 128 AKC-recognized breeds. Results are AI estimates from one photo, not an official AKC identification.</p>
  </section>

  <section class="scanner" aria-label="Upload a dog photo">
    <div id="dropzone" class="kennel" tabindex="0" role="button" aria-label="Upload Dog Photo. Drop a photo here or press Enter to browse.">
      <img id="preview" alt="Your dog photo" hidden>
      <div id="sweep" class="sweep" hidden></div>
      <div id="empty" class="kennel-empty">
        <svg viewBox="0 0 64 64" width="56" height="56" aria-hidden="true"><g fill="currentColor"><ellipse cx="32" cy="43" rx="14" ry="11"/><ellipse cx="13" cy="30" rx="6" ry="8"/><ellipse cx="51" cy="30" rx="6" ry="8"/><ellipse cx="24" cy="15" rx="6" ry="9"/><ellipse cx="40" cy="15" rx="6" ry="9"/></g></svg>
        <span class="drop-line">Drop a photo here</span>
        <span class="button ghost">Upload Dog Photo</span>
        <span class="drop-hint">JPG, PNG or WebP, up to 10 MB</span>
      </div>
    </div>
    <input id="file" type="file" accept="image/jpeg,image/png,image/webp" hidden>
    <p id="status" class="scan-status" role="status" aria-live="polite"></p>
    <div id="error" class="error" role="alert" hidden></div>
    <div class="actions">
      <button id="scan" class="button primary" disabled>Scan Dog</button>
      <button id="change" class="linkish" hidden>Choose a different photo</button>
    </div>
  </section>
</main>

<main id="result" class="result" hidden>
  <aside class="result-photo">
    <div class="kennel small"><img id="result-img" alt="The scanned dog"></div>
    <div class="result-buttons">
      <button id="again" class="button primary">Scan Another Dog</button>
      <button id="report" class="button outline">Download Report</button>
      <p id="report-status" class="note" role="status"></p>
    </div>
  </aside>
  <div id="result-body" class="result-body"></div>
</main>

<script type="application/json" id="breeds-data">{"Affenpinscher": {"name": "Affenpinscher", "group": "Toy Group", "height": "9 to 11.5 in", "weight": "7 to 10 lb", "weight_note": null, "description": "The Affen’s apish look has been described many ways. They’ve been called “monkey dogs” and “ape terriers.” The French say diablotin moustachu (“mustached little devil”), and Star Wars fans argue whether they look more like Wookies or Ewoks.Standing less than a foot tall, these sturdy terrier-like dogs approach life with great confidence. “This isn’t a breed you train,” a professional dog handler tells us, “He’s like a human. You befriend him.” The dense, harsh coat is described as “neat but shaggy” and comes in several colors; the gait is light and confident. They can be willful and domineering, but mostly Affens are loyal, affectionate, and always entertaining. Affen people say they love being owned by their little monkey dogs. The Affenpinscher: loyal, curious, and famously amusing; this almost-human toy dog is fearless out of all proportion to his size. As with all great comedians, it’s the Affenpinscher’s apparent seriousness of purpose that makes his antics all the more amusing.", "temperament": "Confident, Famously Funny, Fearless", "grooming": "2-3 Times a Week Brushing", "shedding": "Seasonal", "energy": "Regular Exercise", "life_expectancy": "12 to 15 years", "size_category": "Toy", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/affenpinscher/", "official_standard": {"size": "Preferred height at withers 9½ to 11½ inches", "coat": "Dense, rough, harsh hair about 1 inch on shoulders and body; longer on head, neck, chest, and legs; mature males have a mane", "color": "Black, gray, silver, red, black and tan, or belge; small white chest spot not penalized"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Toy_Group.pdf"}, "Afghan Hound": {"name": "Afghan Hound", "group": "Hound Group", "height": "25 to 27 in", "weight": "50 to 60 lb", "weight_note": null, "description": "The Afghan Hound is an ancient breed, his whole appearance one of dignity and aloofness – his eyes gazing into the distance as if in memory of ages past. An intelligent and independent mind, his whole appearance one of dignity and style. To his own he is devoted and loyal with a charming and lively personality. The Afghan Hound is an athlete capable of immense speed and requires a large fenced in yard and exercise daily.Since ancient times, Afghan Hounds have been famous for their elegant beauty. But the thick, silky, flowing coat that is the breed’s crowning glory isn’t just for show — it served as protection from the harsh climate in mountainous regions where Afghans originally earned their keep. Beneath the Afghan’s glamorous exterior is a powerful, agile hound — standing as high as 27 inches at the shoulder — built for a long day’s hunt. Their huge paw-pads acted as shock absorbers on their homeland’s punishing terrain.The Afghan Hound is a special breed for special people. A breed expert writes, “It’s not the breed for all would-be dog owners, but where the dog and owner combination is right, no animal can equal the Afghan Hound as a pet.” The Afghan Hound is an aloof and dignified aristocrat of sublime beauty. Despite his regal appearance, he is known for his profound loyalty, sensitive nature, and absolute love for those he calls his own.", "temperament": "Dignified, Profoundly Loyal, Aristocratic", "grooming": "Daily Brushing", "shedding": "Infrequent", "energy": "Energetic", "life_expectancy": "12 to 15 years", "size_category": "Large", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/afghan-hound/", "official_standard": {"size": "Dogs 27 in ±1, about 60 lb; bitches 25 in ±1, about 50 lb", "coat": "Long silky coat with topknot and feathering on ears and feet; short close hair on mature dogs' saddle; shown natural", "color": "All colors permitted; white markings, especially on the head, undesirable"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Hound_Group.pdf"}, "Airedale Terrier": {"name": "Airedale Terrier", "group": "Terrier Group", "height": "23 in", "weight": "50 to 70 lb", "weight_note": null, "description": "The Airedale Terrier is the largest of all terrier breeds. Males stand about 23 inches at the shoulder, females a little less. The dense, wiry coat is tan with black markings. Long, muscular legs give Airedales a regal lift in their bearing, and the long head—with its sporty beard and mustache, dark eyes, and neatly folded ears—conveys a keen intelligence. Airedales are the very picture of an alert and willing terrier—only bigger. And, like his smaller cousins in the terrier family, he can be bold, determined, and stubborn. Airedales are docile and patient with kids but won’t back down when protecting hearth and home. Thanks to their famous do-it-all attitude, Airedales excel in all kinds of sports and family activities. His size, strength, and unflagging spirit have earned the Airedale Terrier the nickname “The King of Terriers.” The Airedale stands among the world’s most versatile dog breeds and has distinguished himself as hunter, athlete, and companion.", "temperament": "Friendly, Clever, Courageous", "grooming": "2-3 Times a Week Brushing", "shedding": "Occasional", "energy": "Regular Exercise", "life_expectancy": "11 to 14 years", "size_category": "Large", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/airedale-terrier/", "official_standard": {"size": "About 23 inches at shoulder for dogs, bitches slightly less", "coat": "Hard, dense, wiry, lying straight and close; slight crinkle or waves allowed; soft undercoat beneath", "color": "Head and ears tan, ears darker; sides and upper body black or dark grizzle; tan legs, underbody, chest; small chest blaze allowed"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Terrier_Group.pdf"}, "Akita": {"name": "Akita", "group": "Working Group", "height": "24 to 28 in", "weight": "70 to 130 lb", "weight_note": null, "description": "Akitas are burly, heavy-boned spitz-type dogs of imposing stature. Standing 24 to 28 inches at the shoulder, Akitas have a dense coat that comes in several colors, including white. The head is broad and massive, and is balanced in the rear by a full, curled-over tail. The erect ears and dark, shining eyes contribute to an expression of alertness, a hallmark of the breed.Akitas are quiet, fastidious dogs. Wary of strangers and often intolerant of other animals, Akitas will gladly share their silly, affectionate side with family and friends. They thrive on human companionship. The large, independent-thinking Akita is hardwired for protecting those they love. They must be well socialized from birth with people and other dogs. Akitas are muscular, double-coated dogs of ancient Japanese lineage famous for their dignity, courage, and loyalty. In their native land, they are venerated as family protectors and symbols of good health, happiness, and long life.", "temperament": "Courageous, Dignified, Profoundly Loyal", "grooming": "Daily Brushing", "shedding": "Seasonal", "energy": "Energetic", "life_expectancy": "10 to 13 years", "size_category": "Large", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/akita/", "official_standard": {"size": "Males 26 to 28 in at withers; bitches 24 to 26 in; disqualified: dogs under 25 in, bitches under 23 in", "coat": "Double coat: thick, soft undercoat; straight, harsh outer coat standing off body; short on head, legs, ears; about 2 in at withers and rump", "color": "Any color including white, brindle, or pinto; rich, clear colors; merle pattern and liver disqualified"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Working_Group.pdf"}, "Alaskan Malamute": {"name": "Alaskan Malamute", "group": "Working Group", "height": "23 to 25 in", "weight": "75 to 85 lb", "weight_note": null, "description": "The Alaskan Malamute stands 23 to 25 inches at the shoulder and weighs 75 to 85 pounds. Everything about Mals suggests their origin as an arctic sled dog: The heavy bone, deep chest, powerful shoulders, and dense, weatherproof coat all scream, “I work hard for a living!” But their almond-shaped brown eyes have an affectionate sparkle, suggesting Mals enjoy snuggling with their humans when the workday is done. Mals are pack animals. And in your family “pack,” the leader must be you. If a Mal doesn’t respect you, he will wind up owning you instead of the other way around. Firm but loving training should begin in early puppyhood. That said, a well-behaved Mal is a joy to be with—playful, gentle, friendly, and great with kids. An immensely strong, heavy-duty worker of spitz type, the Alaskan Malamute is an affectionate, loyal, and playful but dignified dog recognizable by his well-furred plumed tail carried over the back, erect ears, and substantial bone.", "temperament": "Affectionate, Loyal, Playful", "grooming": "2-3 Times a Week Brushing", "shedding": "Seasonal", "energy": "Energetic", "life_expectancy": "10 to 14 years", "size_category": "Large", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/alaskan-malamute/", "official_standard": {"size": "Desirable freighting size: males 25 in at shoulders, 85 lb; females 23 in, 75 lb; natural size range accepted", "coat": "Thick, coarse guard coat over woolly undercoat; longer around shoulders, neck, back, rump, and plume; shown naturally", "color": "Light gray through black, sable, and red shades; white predominant on underbody, legs, feet, and face; solid white allowed"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Working_Group.pdf"}, "American Staffordshire Terrier": {"name": "American Staffordshire Terrier", "group": "Terrier Group", "height": "17 to 19 in", "weight": "40 to 70 lb", "weight_note": null, "description": "AmStaffs are stocky, muscular bull-type terriers standing 17 to 19 inches at the shoulder. The head is broad, the jaws well defined, the cheekbones pronounced, and the dark, round eyes are set wide apart. AmStaff movement is agile and graceful, with a springy gait that advertises the breed’s innate confidence. The stiff, glossy coat comes in many colors and patterns. AmStaffers describe their dogs as keenly aware of their surroundings, game for anything, and lovable “personality dogs” around the house. AmStaffs like mental and physical challenges. They are highly trainable, as their many forays into showbiz suggest. When acquiring an AmStaff, there’s only one way to go: Do your homework and find a responsible AKC breeder. The American Staffordshire Terrier, known to their fans as AmStaffs, are smart, confident, good-natured companions. Their courage is proverbial. A responsibly bred, well-socialized AmStaff is a loyal, trustworthy friend to the end.", "temperament": "Confident, Smart, Good-Natured", "grooming": "Occasional Bath/Brush", "shedding": "Occasional", "energy": "Regular Exercise", "life_expectancy": "12 to 16 years", "size_category": "Large", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/american-staffordshire-terrier/", "official_standard": {"size": "About 18 to 19 inches at shoulder for males, 17 to 18 for females preferred; height and weight in proportion", "coat": "Short, close, stiff to the touch, and glossy", "color": "Any color, solid, parti, or patched permitted; all white, over 80 percent white, black and tan, and liver not encouraged"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Terrier_Group.pdf"}, "Australian Cattle Dog": {"name": "Australian Cattle Dog", "group": "Herding Group", "height": "17 to 20 in", "weight": "35 to 50 lb", "weight_note": null, "description": "Standing between 17 to 20 inches at the shoulder, the Australian Cattle Dog is a sturdy, hard-muscled herder of strength and agility. The ACD is born with a white coat that turns blue-gray or red. Both coat varieties feature distinctive mottling or specking patterns. ACDs have immense work drive and excel at hunting, chasing, and, of course, moving livestock. Their boundless energy and supple gait make them excellent running partners.ACDs are true-blue loyal, famously smart, ever alert, and wary of strangers. If an ACD isn’t challenged, he easily becomes bored and gets into mischief. It is recommended that ACD owners participate with their dog in some work, sport, or regular exercise to keep him mentally and physically fit. The compact but muscular Australian Cattle Dog, also called Blue Heeler or Queensland Heeler, is related to Australia’s famous wild dog, the Dingo. These resilient herders are intelligent enough to routinely outsmart their owners.", "temperament": "Alert, Curious, Pleasant", "grooming": "Occasional Bath/Brush", "shedding": "Regularly", "energy": "Needs Lots of Activity", "life_expectancy": "12 to 16 years", "size_category": "Medium", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/australian-cattle-dog/", "official_standard": {"size": "Dogs 18-20 inches at withers; bitches 17-19 inches", "coat": "Smooth double coat with short dense undercoat; outer coat close, straight, hard, rain-resisting; longer under body, short on head", "color": "Blue, blue-mottled or blue speckled, with or without black, blue or tan head markings; or red speckle, with or without darker red head markings"}, "official_standard_url": "https://images.akc.org/pdf/judges/Herding_Group_7-16.pdf"}, "Australian Shepherd": {"name": "Australian Shepherd", "group": "Herding Group", "height": "18 to 23 in", "weight": "40 to 65 lb", "weight_note": null, "description": "The Australian Shepherd, the cowboy’s herding dog of choice, is a medium-sized worker with a keen, penetrating gaze in the eye. Aussie coats offer different looks, including merle (a mottled pattern with contrasting shades of blue or red). In all ways, they’re the picture of rugged and agile movers of stock. Aussies exhibit an irresistible impulse to herd, anything: birds, dogs, kids. This strong work drive can make Aussies too much dog for a sedentary pet owner. Aussies are remarkably intelligent, quite capable of hoodwinking an unsuspecting novice owner. In short, this isn’t the pet for everyone. But if you’re looking for a brainy, tireless, and trainable partner for work or sport, your search might end here. The Australian Shepherd, a lean, tough ranch dog, is one of those “only in America” stories: a European breed perfected in California by way of Australia. Fixtures on the rodeo circuit, they are closely associated with the cowboy life.", "temperament": "Smart, Work-Oriented, Exuberant", "grooming": "Weekly Brushing", "shedding": "Seasonal", "energy": "Energetic", "life_expectancy": "12 to 15 years", "size_category": "Medium", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/australian-shepherd/", "official_standard": {"size": "Preferred height males 20-23 inches, females 18-21 inches", "coat": "Medium length and coarseness, straight to wavy, weather resistant; short and smooth on head, ears, forelegs, below hocks; moderate mane and frill", "color": "Blue merle, black, red merle, or red, with or without white markings and/or tan (copper) points; white body splashes disqualify"}, "official_standard_url": "https://images.akc.org/pdf/judges/Herding_Group_7-16.pdf"}, "Australian Terrier": {"name": "Australian Terrier", "group": "Terrier Group", "height": "10 to 11 in", "weight": "15 to 20 lb", "weight_note": null, "description": "Australian Terriers are small but sturdy, self-confident terriers known for a longish torso, distinctive coat furnishings around the neck and forequarters, and a topknot of soft, silky hair that contrasts in texture with an otherwise harsh coat. A long neck lends a dash of elegance to this rough-and-ready terrier, and the dark eyes sparkle with a keen intelligence. Coat colors are blue-and-tan, or solid red or sandy. Aussies move with the free and easy gait of a working dog. They are alert watchdogs and said to be quick studies when training. True terriers, Aussies love digging, and the urge to chase small, furry critters has never left them. Not always a great fit in multi-dog households, Aussies want you all to themselves. The diminutive Australian Terrier is plucky, spirited, and smart—how did they fit so much dog into such a bitty package? Upbeat and lively, the self-assured Aussie approaches life with plenty of the old-time terrier curiosity and grit.", "temperament": "Affectionate, Courageous, Spirited", "grooming": "Weekly Brushing", "shedding": "Infrequent", "energy": "Energetic", "life_expectancy": "11 to 15 years", "size_category": "Small", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/australian-terrier/", "official_standard": {"size": "Height 10 to 11 inches at withers", "coat": "Harsh, straight outer coat about 2½ inches on body; soft undercoat; neck ruff, apron, and soft silky topknot", "color": "Blue and tan, solid sandy, or solid red; rich tan markings; white on chest or feet penalized"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Terrier_Group.pdf"}, "Basenji": {"name": "Basenji", "group": "Hound Group", "height": "16 to 17 in", "weight": "22 to 24 lb", "weight_note": null, "description": "Basenjis are small, graceful hounds standing 16 or 17 inches at the shoulder. They are recognizable by their glistening short coat, tightly curled tail, and wrinkled forehead and expressive almond-shaped eyes that convey a variety of subtle, humanlike emotions.Basenjis are a lovely sight at a standstill but more impressive yet at a fast trot, when they exhibit the long, smooth strides of a mini-racehorse. And yes, it’s true, they don’t bark, but they make their feelings known with an odd sound described as something between a chortle and a yodel. Basenjis are fastidious and will groom themselves like cats. This has been called a “cult breed”—small in numbers, but those lucky enough to own one do so with singular devotion. The Basenji, Africa’s “Barkless Dog,” is a compact, sweet-faced hunter of intelligence and poise. They are unique and beguiling pets, best for owners who can meet their exercise needs and the challenge of training this catlike canine.", "temperament": "Independent, Smart, Poised", "grooming": "Occasional Bath/Brush", "shedding": "Occasional", "energy": "Energetic", "life_expectancy": "13 to 14 years", "size_category": "Small", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/basenji/", "official_standard": {"size": "Dogs 17 in, bitches 16 in; dogs about 24 lb, bitches about 22 lb", "coat": "Short and fine", "color": "Chestnut red, pure black, tricolor, or brindle, each with white feet, chest, and tail tip; white legs, blaze, and collar optional"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Hound_Group.pdf"}, "Basset Hound": {"name": "Basset Hound", "group": "Hound Group", "height": "15 in", "weight": "40 to 65 lb", "weight_note": null, "description": "The Basset Hound stands no higher than 14 inches at the shoulder but, with his remarkably heavy bone, powerful little legs, and massive paws, he possesses big-dog strength and stamina. Bassets are famous for a large, domed head that features extremely long, velvety ears, mournful eyes, and a wrinkled brow, which give the breed the look of a sad clown. Built more for endurance than speed, the Basset moves in a deliberate but effortless manner. The breed’s scenting ability is uncanny; it’s said that among dogs only the Bloodhound’s nose is more accurate. Mild and agreeable at home, the Basset is stubborn on the trail and barks in a loud, ringing voice. Although they may not be wildly demonstrative in their affections, they are steadfastly loyal. Among the most appealing of the AKC breeds, the endearing and instantly recognizable Basset Hound is a perennial favorite of dog lovers all over the world. This low-slung and low-key hound can be sometimes stubborn, but is always charming.", "temperament": "Charming, Patient, Low-Key", "grooming": "2-3 Times a Week Brushing", "shedding": "Occasional", "energy": "Couch Potato", "life_expectancy": "12 to 13 years", "size_category": "Medium", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/basset-hound/", "official_standard": {"size": "Not over 14 in; over 15 in at shoulder blade disqualifies", "coat": "Hard, smooth, short; distinctly long coat disqualifies", "color": "Any recognized hound color; distribution of color and markings unimportant"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Hound_Group.pdf"}, "Beagle": {"name": "Beagle", "group": "Hound Group", "height": "13 to 15 in", "weight": null, "weight_note": "AKC's chart shows a garbled value for this breed. See the AKC page.", "description": "There are two Beagle varieties: those standing under 13 inches at the shoulder, and those between 13 and 15 inches. Both varieties are sturdy, solid, and “big for their inches,” as dog folks say. They come in such pleasing colors as lemon, red and white, and tricolor. The Beagle’s fortune is in his adorable face, with its big brown or hazel eyes set off by long, houndy ears set low on a broad head.A breed described as “merry” by its fanciers, Beagles are loving and lovable, happy, and companionable—all qualities that make them excellent family dogs. No wonder that for years the Beagle has been the most popular hound dog among American pet owners. These are curious, clever, and energetic hounds who require plenty of playtime. Not only is the Beagle an excellent hunting dog and loyal companion, it is also happy-go-lucky, funny, and—thanks to its pleading expression—cute. They were bred to hunt in packs, so they enjoy company and are generally easygoing.", "temperament": "Friendly, Curious, Merry", "grooming": "2-3 Times a Week Brushing", "shedding": "Seasonal", "energy": "Energetic", "life_expectancy": "10 to 15 years", "size_category": "Small", "varieties": "AKC varieties: 13 inches and under, and over 13 up to 15 inches.", "akc_url": "https://www.akc.org/dog-breeds/beagle/", "official_standard": {"size": "Two varieties: up to 13 in and over 13 to 15 in; over 15 in disqualifies", "coat": "Close, hard, hound coat of medium length", "color": "Any allowed hound color; merle and brindle disqualify"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Hound_Group.pdf"}, "Bedlington Terrier": {"name": "Bedlington Terrier", "group": "Terrier Group", "height": "15 to 17.5 in", "weight": "17 to 23 lb", "weight_note": null, "description": "Bedlingtons are lithe, energetic Englishmen. The crisp, curly coat; arched back; tasseled ears; scimitar-shaped tail; and fleecy, pear-shaped head are identifying features of this one-of-a-kind breed. As the curvy contours indicate, there’s sighthound—Whippet, most likely—in their family tree. Bedlingtons move with a light, springy step and when roused to pursuit can run like the wind.Rollicking, charming, and full of fun, Bedlingtons want most to be their family’s center of attention and are known to be protective of loved ones. For an active family looking for a no-shedding, lively, and loyal companion, the search might end here. Graceful terriers in sheep’s clothing, Bedlington Terriers, named for the English mining shire where they were first bred, are genial housemates, alert watchdogs, versatile athletes, and irresistibly cuddly TV-time companions.", "temperament": "Loyal, Charming, Frollicking", "grooming": "2-3 Times a Week Brushing", "shedding": null, "energy": "Energetic", "life_expectancy": "11 to 16 years", "size_category": "Small", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/bedlington-terrier/", "official_standard": {"size": "Preferred height 16½ inches at withers for dogs, 15½ for bitches; weight 17 to 23 pounds, proportionate to height", "coat": "Distinctive mix of hard and soft hair standing out; crisp, not wiry, tends to curl; body trim not over 1 inch", "color": "Blue, sandy, liver, and their tan bi-colors; tan on legs, chest, under tail, inside hindquarters, over each eye"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Terrier_Group.pdf"}, "Belgian Malinois": {"name": "Belgian Malinois", "group": "Herding Group", "height": "22 to 26 in", "weight": "40 to 80 lb", "weight_note": null, "description": "Belgian Malinois are squarely built, proud, and alert herders standing 22 to 26 inches. Strong and well-muscled, but more elegant than bulky, there’s an honest, no-frills look about them, as befit dogs built to work hard for their feed. A breed hallmark is the proud carriage of the head. Coat colors range from a rich fawn to mahogany. The black ears and mask accentuate bright, questioning eyes the color of dark Belgian chocolate.If you have ever seen a Mal perform an obedience routine, you know firsthand what a smart and eager breed this is. Problems set in, though, when this people-oriented dog is underemployed and neglected. Exercise, and plenty of it, preferably side by side with their adored owner, is key to Mal happiness. The smart, confident, and versatile Belgian Malinois is a world-class worker who forges an unbreakable bond with his human partner. To deny a Mal activity and the pleasure of your company is to deprive him of his very reasons for being.", "temperament": "Confident, Smart, Hardworking", "grooming": "Weekly Brushing", "shedding": "Seasonal", "energy": "Energetic", "life_expectancy": "14 to 16 years", "size_category": "Large", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/belgian-malinois/", "official_standard": {"size": "Males 24-26 inches, females 22-24 inches at withers", "coat": "Comparatively short, straight, weather-resistant, with dense undercoat; very short on head, ears, lower legs; longer at neck, tail, back of thighs", "color": "Rich fawn to mahogany with black-tipped hairs; black mask and ears; white toe tips and small breastbone spot allowed; other colors disqualify"}, "official_standard_url": "https://images.akc.org/pdf/judges/Herding_Group_7-16.pdf"}, "Belgian Sheepdog": {"name": "Belgian Sheepdog", "group": "Herding Group", "height": "22 to 26 in", "weight": "45 to 75 lb", "weight_note": null, "description": "The stirring silhouette of a Belgian Sheepdog conveys both elegance and muscular determination. A handsome feature of the breed is the exceedingly proud carriage of the head and neck. A male might stand 26 inches at the shoulder; females are smaller. The dark eyes sparkle with a questioning intelligence, and the black coat is abundant, from the neck’s “collarette” to the “breeches” of the hindquarters. In all ways, Belgian Sheepdogs are bright-eyed and bushy-tailed.In any sport or activity, a Belgian will always give 100 percent. In turn, owners tend to form a special bond with their eager workaholics. As one devotee puts it, Belgians “inspire such intense loyalty because they themselves live and love with such great passion.” The Belgian Sheepdog is a highly trainable herder whose versatility and intelligence is the stuff of canine legend. This is a breed built for hard work, and plenty of it. These sensitive souls crave human companionship and abhor neglect.", "temperament": "Bright, Watchful, Serious-Minded", "grooming": "2-3 Times a Week Brushing", "shedding": "Seasonal", "energy": "Energetic", "life_expectancy": "12 to 14 years", "size_category": "Large", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/belgian-sheepdog/", "official_standard": {"size": "Males 24-26 inches, females 22-24 inches at withers", "coat": "Long, straight, abundant guard hairs of medium harshness, not silky or wiry; extremely dense undercoat; short on head and lower legs; long collarette and tail hair", "color": "Black, with small white patch on forechest, between pads, hind toe tips, chin and muzzle (frost) allowed; other colors disqualify"}, "official_standard_url": "https://images.akc.org/pdf/judges/Herding_Group_7-16.pdf"}, "Bernese Mountain Dog": {"name": "Bernese Mountain Dog", "group": "Working Group", "height": "23 to 27.5 in", "weight": "70 to 115 lb", "weight_note": null, "description": "The Bernese Mountain Dog is a large, sturdy worker who can stand over 27 inches at the shoulder. The thick, silky, and moderately long coat is tricolored: jet black, clear white, and rust. The distinctive markings on the coat and face are breed hallmarks and, combined with the intelligent gleam in the dark eyes, add to the Berner’s aura of majestic nobility. A hardy dog who thrives in cold weather, the Berner’s brain and brawn helped him multitask on the farms and pastures of Switzerland.Berners get along with the entire family and are particularly gentle with children, but they will often become more attached to one lucky human. Berners are imposing but not threatening, and they maintain an aloof dignity with strangers. Big, powerful, and built for hard work, the Bernese Mountain Dog is also strikingly beautiful and blessed with a sweet, affectionate nature. Berners are generally placid but are always up for a romp with the owner, whom they live to please.", "temperament": "Good-Natured, Calm, Strong", "grooming": "2-3 Times a Week Brushing", "shedding": "Frequent", "energy": "Energetic", "life_expectancy": "7 to 10 years", "size_category": "Large", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/bernese-mountain-dog/", "official_standard": {"size": "Dogs 25 to 27½ in at withers; bitches 23 to 26 in", "coat": "Thick, moderately long, slightly wavy or straight coat with bright natural sheen; shown in natural coat", "color": "Tri-colored: jet black ground, rich rust and clear white markings; any ground color other than black disqualified"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Working_Group.pdf"}, "Bichon Frise": {"name": "Bichon Frise", "group": "Non-Sporting Group", "height": "9.5 to 11.5 in", "weight": "12 to 18 lb", "weight_note": null, "description": "A good-size Bichon will stand a shade under a foot tall at the shoulder. The breed’s glory is a white hypoallergenic coat, plush and velvety to the touch, featuring rounded head hair that sets off the large, dark eyes and black leathers of the nose and lips.Bichons are adaptable companions who get on well with other dogs and children. Alert and curious, Bichons make nice little watchdogs—but they are lovers, not fighters, and operate under the assumption that there are no strangers, just friends they haven’t met yet. Their confidence and size make them ideal city dogs. Bichons train nicely and enjoy performing for their loved ones. Finally, there’s the happy-go-lucky Bichon personality that draws smiles and hugs wherever they go. The small but sturdy and resilient Bichon Frise stands among the world’s great “personality dogs.” Since antiquity, these irresistible canine comedians have relied on charm, beauty, and intelligence to weather history’s ups and downs.", "temperament": "Playful, Curious, Peppy", "grooming": "Specialty/Professional", "shedding": "Infrequent", "energy": "Regular Exercise", "life_expectancy": "14 to 15 years", "size_category": "Small", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/bichon-frise/", "official_standard": {"size": "Dogs and bitches 9½ to 11½ inches preferred; never over 12 or under 9 inches", "coat": "Soft, dense undercoat with a coarser, curlier outer coat; plush-like, standing off the body as a powder puff when bathed and brushed", "color": "White, may have buff, cream, or apricot shadings on ears or body; over 10% color on a mature coat is a fault"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Non-Sporting_Group.pdf"}, "Black and Tan Coonhound": {"name": "Black and Tan Coonhound", "group": "Hound Group", "height": "23 to 27 in", "weight": "65 to 110 lb", "weight_note": null, "description": "Black and Tans have an amazingly sensitive nose, long, velvety ears, and a sweet disposition. The coal-black coat features rich tan accents, including the distinctive “pumpkin seeds” above keenly expressive eyes. These are big, strong hounds: A good-size male can stand 27 inches at the shoulder and cover ground with effortless, eager strides.B&Ts are sociable hounds. A lonely B&T will serenade the neighborhood with loud, mournful “music.” B&Ts can keep pace with the most active family, but they also can hog the sofa for hours on end. Hounds will be hounds: A passing squirrel can arouse B&T prey drive in no time flat, so a strong leash and sturdy fence are must-haves. B&Ts might be too much hound for the lifestyle of every owner. Large, athletic hunters who work nights, Black and Tan Coonhounds are friendly, easygoing hounds who love company. They are snoozy by the fireside but tenacious when on the trail of the wily raccoon. This hound is a real American original.", "temperament": "Easy-Going, Bright, Brave", "grooming": "Weekly Brushing", "shedding": "Seasonal", "energy": "Regular Exercise", "life_expectancy": "10 to 12 years", "size_category": "Large", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/black-and-tan-coonhound/", "official_standard": {"size": "Males 25 to 27 in; females 23 to 25 in", "coat": "Short but dense", "color": "Coal black with rich tan over eyes, muzzle sides, chest, legs, and breeching, plus black toe pencil markings; solid white patch over one inch disqualifies"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Hound_Group.pdf"}, "Bloodhound": {"name": "Bloodhound", "group": "Hound Group", "height": "23 to 27 in", "weight": "80 to 110 lb", "weight_note": null, "description": "Bloodhounds are large, substantial dogs standing 23 to 27 inches at the shoulder and weighing up to 110 pounds. Their most famous features are a long, wrinkled face with loose skin; huge, drooping ears; and warm, deep-set eyes that complete an expression of solemn dignity. Coat colors can be black and tan, liver and tan, or red. Powerful legs allow Bloodhounds to scent over miles of punishing terrain.As pack dogs, Bloodhounds enjoy company, including other dogs and kids. They are easygoing, but their nose can sometimes lead them into trouble. A strong leash and long walks in places where they can enjoy sniffing around are recommended. Bloodhounds are droolers, and obedience training these sensitive sleuths can be a challenge. The world famous “Sleuth Hound” does one thing better than any creature on earth: find people who are lost or hiding. An off-duty Bloodhound is among the canine kingdom’s most docile citizens, but he’s relentless and stubborn on scent.", "temperament": "Friendly, Independent, Inquisitive", "grooming": "Weekly Brushing", "shedding": "Seasonal", "energy": "Regular Exercise", "life_expectancy": "10 to 12 years", "size_category": "Large", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/bloodhound/", "official_standard": {"size": "Dogs usually 25 to 27 in, bitches 23 to 25 in; mean weight dogs 90 lb, bitches 80 lb", "coat": null, "color": "Black and tan, liver and tan, or red; small white on chest, feet, and stern tip permissible"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Hound_Group.pdf"}, "Bluetick Coonhound": {"name": "Bluetick Coonhound", "group": "Hound Group", "height": "21 to 27 in", "weight": "45 to 80 lb", "weight_note": null, "description": "Blueticks are speedy and compact nocturnal hunters named for the mottled (or “ticked”) black-and-blue pattern of the glossy coat. A large male can top out at 27 inches and 80 pounds; females are smaller. Blueticks are well-muscled but sleek and racy, never chunky or clumsy. The baying, bawling, and chopping bark of Blueticks might be cacophonous to some, but to coon hunters it’s the music of the night.The droopy-eared charm of Blueticks is irresistible. They crave affection and are deeply devoted to those who provide it. Blueticks have tremendous prey drive. Neglected, underemployed coonhounds with no outlet for their hardwired impulses can develop problem behaviors, like serenading the neighbors with loud, mournful “music.” The sleekly beautiful Bluetick Coonhound is a sweet and affectionate charmer who might enjoy snoozing in the shade, but in pursuit of quarry he is relentless, bold, and single-minded. His off-the-charts prey drive must be channeled.", "temperament": "Smart, Devoted, Tenacious", "grooming": "Weekly Brushing", "shedding": "Seasonal", "energy": "Energetic", "life_expectancy": "11 to 12 years", "size_category": "Large", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/bluetick-coonhound/", "official_standard": {"size": "Males 22 to 27 in; females 21 to 25 in; males 55 to 80 lb, females 45 to 65 lb", "coat": "Medium coarse, close-lying, smooth and glossy; not rough or too short", "color": "Dark blue thickly mottled body with black spots; head and ears mostly black; optional tan; red ticking on feet and lower legs; no other colors"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Hound_Group.pdf"}, "Border Collie": {"name": "Border Collie", "group": "Herding Group", "height": "18 to 22 in", "weight": "30 to 55 lb", "weight_note": null, "description": "Borders are athletic, medium-sized herders standing 18 to 22 inches at the shoulder. The overall look is that of a muscular but nimble worker unspoiled by passing fads. Both the rough coat and the smooth coat come in a variety of colors and patterns.The almond eyes are the focus of an intelligent expression—an intense gaze, the Border’s famous “herding eye”, is a breed hallmark. On the move, Borders are among the canine kingdom’s most agile, balanced, and durable citizens.The intelligence, athleticism, and trainability of Borders have a perfect outlet in agility training. Having a job to perform, like agility—or herding or obedience work—is key to Border happiness. Amiable among friends, they may be reserved with strangers. A remarkably bright workaholic, the Border Collie is an amazing dog—maybe a bit too amazing for owners without the time, energy, or means to keep it occupied. These energetic dogs will settle down for cuddle time when the workday is done.", "temperament": "Affectionate, Smart, Energetic", "grooming": "2-3 Times a Week Brushing", "shedding": "Seasonal", "energy": "Needs Lots of Activity", "life_expectancy": "12 to 15 years", "size_category": "Medium", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/border-collie/", "official_standard": {"size": "Males 19 to 22 inches; females 18 to 21 inches at the withers", "coat": "Rough or smooth variety; double, weather-resistant coat; neither variety preferred", "color": "All colors and combinations equally; ticked white markings allowed; random white patches permissible but not predominant"}, "official_standard_url": "https://images.akc.org/pdf/judges/Herding_Group_7-16.pdf"}, "Border Terrier": {"name": "Border Terrier", "group": "Terrier Group", "height": "12 to 15 in", "weight": "11.5 to 15.5 lb", "weight_note": null, "description": "Border Terriers, standing from 11 to 16 inches at the shoulder, are easy to recognize among other small terriers by their unique head shape—the breed has an “otter head,” as fanciers say. Another distinguishing trait is that they are longer in leg than other small terriers. The wire coat can be grizzle and tan, blue and tan, wheaten, or red.Borders are described as “hard as nails” when working, but at home they’re good-tempered, affectionate, and trainable. Borders love exploring outdoors and make fine childhood playmates. Bred to be country dogs, Borders adapt well to city life—as long as they get plenty of exercise. Borders tend to get along with other dogs, but their hunting instincts can be aroused when cats or squirrels cross their path. Admirers of the upbeat and agile Border Terrier cherish their breed’s reputation as a tough, no-frills working terrier. These plucky, happy, and affectionate dogs are popular pets in town and country. The wiry coat is an easy keeper.", "temperament": "Affectionate, Happy, Plucky", "grooming": "Weekly Brushing", "shedding": "Occasional", "energy": "Regular Exercise", "life_expectancy": "12 to 15 years", "size_category": "Small", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/border-terrier/", "official_standard": {"size": "Dogs 13 to 15½ pounds, bitches 11½ to 14 pounds", "coat": "Short dense undercoat under very wiry, somewhat broken topcoat lying close; no curl or wave; hide thick and loose", "color": "Red, grizzle and tan, blue and tan, or wheaten; small chest white allowed; white on feet penalized; dark muzzle desirable"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Terrier_Group.pdf"}, "Borzoi": {"name": "Borzoi", "group": "Hound Group", "height": "26 to 28 in", "weight": "60 to 105 lb", "weight_note": null, "description": "Borzoi are large, elegant sighthounds. A mature male stands at least 28 inches at the shoulder and weighs 75 to 105 pounds. Females will be smaller. Beneath the luxurious silky coat, Borzoi construction follows the ancient Greyhound template. Once known as the Russian Wolfhound, Borzoi were bred to be swift and tough enough to pursue and pin their ferocious lupine quarry.In their quiet, catlike way they can be stubborn, and training is best accomplished with patience, consistency, and good humor. Affectionate family dogs, Borzoi are nonetheless a bit too dignified to wholeheartedly enjoy a lot of roughhousing. The sight of a cat or squirrel on the run will quickly stir their pursuit instinct, and fenced-in running room is a must. Among the most impressively beautiful of all dogs, the aristocratic Borzoi is cherished for his calm, agreeable temperament. In full stride, he is a princely package of strength, grace, and glamour flying by at 35 to 40 miles per hour.", "temperament": "Affectionate, Loyal, Regally Dignified", "grooming": "Weekly Brushing", "shedding": "Seasonal", "energy": "Energetic", "life_expectancy": "9 to 14 years", "size_category": "Large", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/borzoi/", "official_standard": {"size": "Males at least 28 in, bitches at least 26 in; males 75 to 105 lb, bitches 15 to 20 lb less", "coat": "Long, silky (not woolly), flat, wavy, or rather curly", "color": "Any color or combination of colors"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Hound_Group.pdf"}, "Boston Terrier": {"name": "Boston Terrier", "group": "Non-Sporting Group", "height": "15 to 17 in", "weight": "12 to 25 lb", "weight_note": null, "description": "Boston Terriers are compact, short-tailed, well-balanced little dogs weighing no more than 25 pounds. The stylish “tuxedo” coat can be white and either black, brindle, or seal (black with a red cast when viewed in sun or bright light). The head is square, the muzzle is short, and the large, round eyes can shine with kindness, curiosity, or mischief. Ever alert to their surroundings, Bostons move with a jaunty, rhythmic step.It’s a safe bet that a breed named for a city—the Havanese or Brussels Griffon, for instance—will make an excellent urban pet. Bostons are no exception: they are sturdy but portable, people-oriented, and always up for a brisk walk to the park or outdoor cafe. A bright dog with a natural gift for comedy, the dapper Bostonian is a steady source of smiles. The Boston Terrier is a lively little companion recognized by his tight tuxedo jacket, sporty but compact body, and the friendly glow in his big, round eyes. His impeccable manners have earned him the nickname “The American Gentleman.”", "temperament": "Friendly, Bright, Amusing", "grooming": "Weekly Brushing", "shedding": "Infrequent", "energy": "Regular Exercise", "life_expectancy": "11 to 13 years", "size_category": "Small", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/boston-terrier/", "official_standard": {"size": "Weight classes: under 15 pounds; 15 pounds and under 20 pounds; 20 pounds and not to exceed 25 pounds", "coat": "Short, smooth, bright and fine", "color": "Brindle, seal, or black with required white muzzle band, blaze between eyes, and forechest; solid black, brindle, or seal without white disqualified"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Non-Sporting_Group.pdf"}, "Bouvier des Flandres": {"name": "Bouvier des Flandres", "group": "Herding Group", "height": "23.5 to 27.5 in", "weight": "70 to 110 lb", "weight_note": null, "description": "Standing as high as 27.5 inches, with heavy bone and powerful muscles beneath a weatherproof coat, and an impressive head accented by beard and mustache, Bouviers can do anything that needs doing in a barnyard or pasture except milk the cows. And yet, Bouviers are more than just farm equipment. Their sterling character, huge heart, and keen intelligence endear them to dog lovers the world over.The Bouvier work ethic must be accommodated, and happily the breed’s versatility allows them to do myriad tasks. Bouviers are excellent watchdogs and guardians, and eager participants in dog sports, especially herding trials. These strong-willed dogs do best with owners who can devote ample time and space to a top-of-the-line working dog. They don’t build ’em like this anymore. Burly and barrel-chested, the tousle-coated dog of Flandres is from a time and place where a dog had to work like … well, a dog. These smart and steady all-purpose workers make excellent watchdogs.", "temperament": "Affectionate, Courageous, Strong-Willed", "grooming": "Daily Brushing", "shedding": "Seasonal", "energy": "Energetic", "life_expectancy": "10 to 12 years", "size_category": "Large", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/bouvier-des-flandres/", "official_standard": {"size": "Dogs 24½ to 27½ inches; bitches 23½ to 26½ inches at the withers", "coat": "Tousled, harsh double coat; topcoat trimmed to about 2½ inches; dense fine undercoat", "color": "Fawn to black, including salt and pepper, gray, and brindle; small white chest star allowed; chocolate, white, or parti-color severely penalized"}, "official_standard_url": "https://images.akc.org/pdf/judges/Herding_Group_7-16.pdf"}, "Boxer": {"name": "Boxer", "group": "Working Group", "height": "21.5 to 25 in", "weight": null, "weight_note": "AKC's chart shows 15-80 lb, which looks like a data error. See the AKC page.", "description": "A well-made Boxer in peak condition is an awesome sight. A male can stand as high as 25 inches at the shoulder; females run smaller. Their muscles ripple beneath a short, tight-fitting coat. The dark brown eyes and wrinkled forehead give the face an alert, curious look. The coat can be fawn or brindle, with white markings. Boxers move like the athletes they are named for: smooth and graceful, with a powerful forward thrust.Boxers are upbeat and playful. Their patience and protective nature have earned them a reputation as a great dog with children. They take the jobs of watchdog and family guardian seriously and will meet threats fearlessly. Boxers do best when exposed to a lot of people and other animals in early puppyhood. Loyalty, affection, intelligence, work ethic, and good looks: Boxers are the whole doggy package. Bright and alert, sometimes silly, but always courageous, the Boxer has been among America’s most popular dog breeds for a very long time.", "temperament": "Bright, Fun-Loving, Active", "grooming": "Weekly Brushing", "shedding": "Occasional", "energy": "Energetic", "life_expectancy": "10 to 12 years", "size_category": "Large", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/boxer/", "official_standard": {"size": "Adult males 23 to 25 in; females 21½ to 23½ in at withers", "coat": "Short, shiny, lying smooth and tight to the body", "color": "Fawn or brindle; white markings may not exceed one-third of coat; any other color disqualified"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Working_Group.pdf"}, "Briard": {"name": "Briard", "group": "Herding Group", "height": "22 to 27 in", "weight": "55 to 100 lb", "weight_note": null, "description": "Briards are herders known for a wavy coat of either gray, tawny, or black, and an impressive head topped by a peek-a-boo hairdo parted naturally in the middle. A luxurious beard and eyebrows accentuate an expression described as “frank and questioning.” Standing between 22 and 27 inches at the shoulder, Briards are burly and rugged but move with a nimble-footed gait.They possess traits common to many other herders: trainability, brains, a protective eye toward family (especially kids, whom they regard as their flock), and wariness with outsiders. These are large, tireless dogs—it is said that just two or three Briards can handle 700 head of sheep—and novice owners might be overwhelmed by their work drive and zest for life. The Briard packs so much loyalty, love, and spirit into its ample frame that it's often described as a \"heart wrapped in fur.\" The dashing good looks of these muscular Frenchmen radiate a distinct aura of Gallic romance and elegance.", "temperament": "Confident, Smart, Faithful", "grooming": "Daily Brushing", "shedding": "Infrequent", "energy": "Regular Exercise", "life_expectancy": "12 to 12 years", "size_category": "Large", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/briard/", "official_standard": {"size": "Males 23 to 27 inches; bitches 22 to 25½ inches at the withers", "coat": "Coarse, hard, dry outer coat in long, slightly waving locks; fine, tight undercoat", "color": "Uniform colors except white: black, gray shades, tawny shades; two-color combinations allowed; white hairs scattered, chest spot up to one inch"}, "official_standard_url": "https://images.akc.org/pdf/judges/Herding_Group_7-16.pdf"}, "Brittany": {"name": "Brittany", "group": "Sporting Group", "height": "17.5 to 20.5 in", "weight": "30 to 40 lb", "weight_note": null, "description": "Brittanys are smaller than setters but leggier than spaniels, standing about 20 inches at the shoulder. Their beautiful, boldly patterned coat comes in combinations of white and vivid orange and liver (reddish-brown). They are rugged and strong but smooth, clean, and quick afoot. The face has the “softness” prized by bird-dog lovers; high-set ears convey the breed’s essential eagerness.The zeal and versatility that make Brittanys peerless hunters can be channeled into dog sports. Obedience, agility, flyball, dock diving—you name it, this trainable breed is up for it. The Brittany is a nice fit for those seeking an all-purpose hunting partner, a dog-sport teammate, or a companion in sync with an upbeat, outdoorsy family life. Sportsmen on both sides of the Atlantic cherish the agile, energetic Brittany as a stylish and versatile gundog. Bright and eager at home, and tireless afield, Brittanys require a lot of exercises, preferably with their favorite humans.", "temperament": "Bright, Fun-Loving, Upbeat", "grooming": "2-3 Times a Week Brushing", "shedding": "Seasonal", "energy": "Needs Lots of Activity", "life_expectancy": "12 to 14 years", "size_category": "Medium", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/brittany/", "official_standard": {"size": "Height 17½ to 20½ inches at the shoulders; weight 30 to 40 pounds", "coat": "Dense, flat or wavy, never curly; neither wiry nor silky; leg feathering should be light", "color": "Orange and white or liver and white, clear or roan; some ticking desirable; tri-color allowed but not preferred; black disqualifies"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Sporting_Group.pdf"}, "Brussels Griffon": {"name": "Brussels Griffon", "group": "Toy Group", "height": "7 to 10 in", "weight": "8 to 10 lb", "weight_note": null, "description": "With this breed, you get a big personality in a 5-to-15-pound package. One look into his big, human-like eyes, and you’ll be smitten. Griffs come in four colors—red, black-and-reddish-brown (called belge), black and tan, and black—and in smooth coats (like a Pug) or rough coats (like a Schnauzer). Their black muzzle and whiskers earned them the nickname “bearded dogs” in old folk songs.The Griff’s big black eyes—described as “almost human”—coupled with a fringed beard and mustache covering his short muzzle, gives him the air of a worldly, French-speaking philosopher. The Griff’s body is thickset and sturdy, and he moves with the purposeful trot of a fellow who knows what he wants.Griffs are alert, sociable, and easily trained. Although playful and energetic, their small size and sensitive nature make them a poor choice as roughhousing playmates for kids. They have a low threshold for loneliness and will stick close to their special human, providing years of love and laughter. Tipping the scales at no more than 12 pounds, this human-like toy of complex character has enough personality for 10 ordinary dogs. A sensitive companion for discerning grownups, the Brussels Griffon is smart, devoted, and comically self-important.", "temperament": "Loyal, Alert, Curious", "grooming": "2-3 Times a Week Brushing", "shedding": "Seasonal", "energy": "Regular Exercise", "life_expectancy": "12 to 15 years", "size_category": "Toy", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/brussels-griffon/", "official_standard": {"size": "Weight usually 8 to 10 pounds, not to exceed 12 pounds", "coat": "Rough coat is wiry and dense; smooth coat is short, tight, and glossy; no silky hair on rough coat", "color": "Red, belge, black and tan, or solid black; any white spot or blaze anywhere on coat is disqualified"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Toy_Group.pdf"}, "Bull Terrier": {"name": "Bull Terrier", "group": "Terrier Group", "height": "21 to 22 in", "weight": "50 to 70 lb", "weight_note": null, "description": "Bull Terriers are robust, big-boned terriers who move with a jaunty stride suggesting agility and power. The breed’s hallmark is a long, egg-shaped head with erect and pointed ears, and small, triangular eyes that glisten with good humor. Coats come in two types: white; and any other color (including an attractive brindle striping), either solid or with white markings. A well-made BT is the picture of muscular determination and balance. There are four keys to BT happiness: early socialization with dogs and people; firm but loving training; ample exercise; and lots of quality time with his adored humans. If these requirements are met, there is no more loyal, lovable, and entertaining companion. This is the ultimate “personality breed.” Among the most comical and mischievous citizens of dogdom, the Bull Terrier is playful and endearing, sometimes stubborn, but always devoted. These unique “eggheads” are exuberant, muscular companions who thrive on affection and exercise.", "temperament": "Playful, Charming, Mischievous", "grooming": "Weekly Brushing", "shedding": "Seasonal", "energy": "Energetic", "life_expectancy": "12 to 13 years", "size_category": "Large", "varieties": "AKC varieties: White and Colored.", "akc_url": "https://www.akc.org/dog-breeds/bull-terrier/", "official_standard": {"size": null, "coat": "Short, flat, harsh to the touch with fine gloss; skin fits tightly", "color": "White with head markings permitted; colored variety any color except white or white markings; predominantly white disqualified"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Terrier_Group.pdf"}, "Bulldog": {"name": "Bulldog", "group": "Non-Sporting Group", "height": "14 to 15 in", "weight": "40 to 50 lb", "weight_note": null, "description": "You can’t mistake a Bulldog for any other breed. The loose skin of the head, furrowed brow, pushed-in nose, small ears, undershot jaw with hanging chops on either side, and the distinctive rolling gait all practically scream “I’m a Bulldog!” The coat, seen in a variety of colors and patterns, is short, smooth, and glossy. Bulldogs can weigh up to 50 pounds, but that won’t stop them from curling up in your lap, or at least trying to. But don’t mistake their easygoing ways for laziness—Bulldogs enjoy brisk walks and need regular moderate exercise, along with a careful diet, to stay trim. Summer afternoons are best spent in an air-conditioned room as a Bulldog’s short snout can cause labored breathing in hot and humid weather. Kind but courageous, friendly but dignified, the Bulldog is a thick-set, low-slung, well-muscled bruiser whose “sourmug” face is the universal symbol of courage and tenacity. These docile, loyal companions adapt well to town or country.", "temperament": "Friendly, Courageous, Calm", "grooming": "2-3 Times a Week Brushing", "shedding": "Regularly", "energy": "Regular Exercise", "life_expectancy": "8 to 10 years", "size_category": "Medium", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/bulldog/", "official_standard": {"size": "Mature dogs about 50 pounds; mature bitches about 40 pounds", "coat": "Straight, short, flat, close, fine, smooth, and glossy; no fringe, feather, or curl", "color": "Red, white, fawn, fallow, or combinations; brindle, piebald, ticking, black masks, and black tipping allowed; merle and other colors disqualified"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Non-Sporting_Group.pdf"}, "Bullmastiff": {"name": "Bullmastiff", "group": "Working Group", "height": "24 to 27 in", "weight": "100 to 130 lb", "weight_note": null, "description": "The Bullmastiff isn’t quite as large as his close cousin the Mastiff. Still, standing as high as 27 inches at the shoulder and weighing between 100 and 130 pounds, this is still a whole lot of dog. After the first impression made by the Bullmastiff’s size, it is the large, broad head that conveys the breed’s essence: the dark eyes, high-set V-shaped ears, and broad, deep muzzle all combine to present the intelligence, alertness, and confidence that make the Bullmastiff a world-class protector and family companion. Coats come in fawn, red, or brindle.These are biddable and reliable creatures, but as with any large guarding dog, owners must begin training and socialization early, while the puppy is still small enough to control. Fearless at work, docile at home, the Bullmastiff is a large, muscular guarder who pursued and held poachers in Merry Old England—merry, we suppose, for everyone but poachers. Bullmastiffs are the result of Bulldog and Mastiff crosses.", "temperament": "Affectionate, Loyal, Brave", "grooming": "Occasional Bath/Brush", "shedding": "Seasonal", "energy": "Energetic", "life_expectancy": "7 to 9 years", "size_category": "Giant", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/bullmastiff/", "official_standard": {"size": "Dogs 25 to 27 in, 110 to 130 lb; bitches 24 to 26 in, 100 to 120 lb, at withers", "coat": "Short and dense, giving good weather protection", "color": "Red, fawn, or brindle; small white chest spot allowed; other white markings are a fault"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Working_Group.pdf"}, "Cairn Terrier": {"name": "Cairn Terrier", "group": "Terrier Group", "height": "9.5 to 10 in", "weight": "13 to 14 lb", "weight_note": null, "description": "The Cairn’s unique qualities, called “Cairnishness,” include a short, wide head and a free-moving, short-legged body that exudes strength but not heaviness, topping out at about 10 inches high and about 15 inches long. The double coat is harsh and wiry on top and downy beneath. A Cairn presents as a small, shaggy, alert dog, with head, tail, and ears up, and eyes shining with intelligence.A British breed club promotes Cairns as the “best little pal in the world.” Cairns are small enough for a lap-top snuggle and sturdy enough for a good romp on the lawn. They do best with lots of close family contact. For owners who cherish the terrier qualities of gameness, independent thinking, and true-blue loyalty, no other breed will do. Cairn Terriers are happy, busy little earthdogs originally bred to fearlessly root out foxes and other small, furred prey in the rocky Scottish countryside. Curious and alert, Cairns like having a place where they can explore and dig.", "temperament": "Alert, Cheerful, Busy", "grooming": "Weekly Brushing", "shedding": "Occasional", "energy": "Regular Exercise", "life_expectancy": "13 to 15 years", "size_category": "Small", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/cairn-terrier/", "official_standard": {"size": "Dogs 10 inches and 14 pounds; bitches 9½ inches and 13 pounds", "coat": "Hard, weather-resistant double coat: profuse harsh outer coat over short, soft, furry undercoat", "color": "Any color except white; dark ears, muzzle, and tail tip desirable; white on chest, feet, or body faulted"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Terrier_Group.pdf"}, "Cane Corso": {"name": "Cane Corso", "group": "Working Group", "height": "23.5 to 27.5 in", "weight": "Proportionate to height (AKC publishes no numeric weight)", "weight_note": null, "description": "At nearly 28 inches at the shoulder and often weighing more than 100 pounds, with a large head, alert expression, and muscles rippling beneath their short, stiff coat, Corsi are at a glance intimidating creatures. Their imposing appearance is their first line of defense against intruders. As one writer put it, “An understated air of cool competence, the kind of demeanor you’d expect from a professional bodyguard, is the breed’s trademark.”Corsi are intelligent, loyal, eager to please, versatile, and intensely loyal to their humans, but are also assertive and willful, and can end up owning an unwitting owner. As with any other big guardian dog, responsible breeding and early socialization with people and other dogs is vital. Smart, trainable, and of noble bearing, the assertive and confident Cane Corso is a peerless protector. The Corso’s lineage goes back to ancient Roman times, and the breed’s name roughly translates from the Latin as “bodyguard dog.”", "temperament": "Affectionate, Intelligent, Majestic", "grooming": "Occasional Bath/Brush", "shedding": "Occasional", "energy": "Energetic", "life_expectancy": "9 to 12 years", "size_category": "Large", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/cane-corso/", "official_standard": {"size": "Dogs 25 to 27½ in; bitches 23½ to 26 in; weight proportionate to height", "coat": "Short, stiff, shiny, adherent, dense coat with a light undercoat that thickens in cold weather", "color": "Black, gray, fawn, red, and brindle; black or gray mask on solid fawn or red; tan pattern markings disqualified"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Working_Group.pdf"}, "Cardigan Welsh Corgi": {"name": "Cardigan Welsh Corgi", "group": "Herding Group", "height": "10.5 to 12.5 in", "weight": "25 to 38 lb", "weight_note": null, "description": "Long, low-set dogs with sturdy bone, short legs, and a deep chest, Cardigans are powerful workers of deceptive speed and grace. Cardis can weigh anywhere from 25 to 34 pounds, with females at the lower end of the scale. They come in several coat colors, from red to the popular blue-merle pattern. The quickest way to distinguish Cardis from their cousins, Pembroke Welsh Corgis, is to check out the hindquarters: Cardigans have tails; Pembrokes do not.Cardis are trainable, faithful, and vigilant guardians with a “big dog” bark. Well-socialized Cardis are especially fond of kids and agreeable with other pets. These athletic, rugged herders have a love for the outdoors, and they thrive on mental stimulation and physical activity. The Cardigan Welsh Corgi is a masterpiece of the breeder’s art: Every aspect of its makeup is perfectly suited to moving cattle, and yet it is so congenial and sweet-faced that it would be a cherished companion even if it never did a day’s work.", "temperament": "Affectionate, Loyal, Smart", "grooming": "Weekly Brushing", "shedding": "Seasonal", "energy": "Energetic", "life_expectancy": "12 to 15 years", "size_category": "Medium", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/cardigan-welsh-corgi/", "official_standard": {"size": "10½ to 12½ inches at the withers; dogs 30 to 38 pounds; bitches 25 to 34 pounds", "coat": "Medium length, dense double coat; slightly harsh outer coat; short, soft, thick undercoat", "color": "All shades of red, sable, and brindle; black with or without tan or brindle points; blue merle with or without tan or brindle points; white flashings usual"}, "official_standard_url": "https://images.akc.org/pdf/judges/Herding_Group_7-16.pdf"}, "Cavalier King Charles Spaniel": {"name": "Cavalier King Charles Spaniel", "group": "Toy Group", "height": "12 to 13 in", "weight": "13 to 18 lb", "weight_note": null, "description": "The Cavalier’s all-around beauty, regal grace, and even temper mark him as one of dogdom’s noblemen. A toy spaniel no more than 13 inches high, the Cavalier draws you in with his face: The sweet, gentle, melting expression emanating from large, round eyes is a breed hallmark. Another is the silky, richly-colored coat that can be one of four distinct varieties.Cavaliers may be aristocrats, but they gladly descend from their royal high horse for a backyard frolic or a squirrel chase. They get along nicely with children and other dogs. Adaptable Cavaliers do equally well with active owners and homebodies—they can be upbeat athletes or shameless couch potatoes, depending on an owner’s lifestyle. The Cavalier King Charles Spaniel wears his connection to British history in his breed’s name. Cavaliers are the best of two worlds, combining the gentle attentiveness of a toy breed with the verve and athleticism of a sporting spaniel.", "temperament": "Affectionate, Gentle, Graceful", "grooming": "Weekly Brushing", "shedding": "Occasional", "energy": "Calm", "life_expectancy": "12 to 15 years", "size_category": "Small", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/cavalier-king-charles-spaniel/", "official_standard": {"size": "Height 12 to 13 inches at withers; weight 13 to 18 pounds", "coat": "Moderate length, silky, free from curl; slight wave permissible; feathering on ears, chest, legs, and tail; no trimming", "color": "Blenheim, tricolor, ruby, or black and tan; dogs not of an allowed color are disqualified"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Toy_Group.pdf"}, "Chesapeake Bay Retriever": {"name": "Chesapeake Bay Retriever", "group": "Sporting Group", "height": "21 to 26 in", "weight": "55 to 80 lb", "weight_note": null, "description": "Chessies are strong, powerfully built gundogs standing anywhere from 21 to 26 inches at the shoulder. A male can weigh up to 80 pounds. The distinctive breed trait is a wavy coat that is oily to the touch. Chessies are solid-colored, either chocolatey brown, sedge, or deadgrass, with keen yellow-amber eyes that nicely complement the coat.Chessies are more emotionally complex than the usual gundog. Chessies take to training, but they have a mind of their own and can tenaciously pursue their own path. They are protective of their humans and polite, but not overtly friendly, to strangers. Chessies make excellent watchdogs and are versatile athletes. A well-socialized Chessie is a confident companion and world-class hunting buddy. The Chesapeake Bay Retriever, peerless duck dog of the Mid-Atlantic, is an American original who embodies the classic traits of a good retriever: loyal, upbeat, affectionate, and tireless. The Chessie is famous for his waterproof coat.", "temperament": "Affectionate, Bright, Sensitive", "grooming": "2-3 Times a Week Brushing", "shedding": "Regularly", "energy": "Energetic", "life_expectancy": "10 to 13 years", "size_category": "Large", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/ch
