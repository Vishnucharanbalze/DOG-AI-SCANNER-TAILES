esapeake-bay-retriever/", "official_standard": {"size": "Males 23 to 26 inches, 65 to 80 pounds; females 21 to 24 inches, 55 to 70 pounds", "coat": "Thick and short, nowhere over 1½ inches; dense wooly undercoat; curly coat or long tail/leg feathering disqualifies", "color": "Brown, sedge, or dead grass shades; self-colored preferred; white only on breast, belly, toes, or back of feet; black disqualifies"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Sporting_Group.pdf"}, "Chihuahua": {"name": "Chihuahua", "group": "Toy Group", "height": "5 to 8 in", "weight": "about 6 lb (AKC lists one figure)", "weight_note": null, "description": "The Chihuahua is a balanced, graceful dog of terrier-like demeanor, weighing no more than 6 pounds. The rounded “apple” head is a breed hallmark. The erect ears and full, luminous eyes are acutely expressive. Coats come in many colors and patterns, and can be long or short. The varieties are identical except for coat.Chihuahuas possess loyalty, charm, and big-dog attitude. Even tiny dogs require training, and without it this clever scamp will rule your household like a little Napoleon. Compact and confident, Chihuahuas are ideal city pets. They are too small for roughhousing with kids, and special care must be taken in cold weather, but Chihuahuas are adaptable—as long as they get lots of quality time in their preferred lap. The Chihuahua is a tiny dog with a huge personality. A national symbol of Mexico, these alert and amusing \"purse dogs\" stand among the oldest breeds of the Americas, with a lineage going back to the ancient kingdoms of pre-Columbian times.", "temperament": "Charming, Graceful, Sassy", "grooming": "Occasional Bath/Brush", "shedding": "Occasional", "energy": "Regular Exercise", "life_expectancy": "14 to 16 years", "size_category": "Toy", "varieties": "AKC coat varieties: Smooth Coat and Long Coat.", "akc_url": "https://www.akc.org/dog-breeds/chihuahua/", "official_standard": {"size": "Weight not to exceed 6 pounds", "coat": "Smooth coat soft, close, and glossy; long coat soft, flat or slightly wavy, with undercoat preferred", "color": "Any color, solid, marked, or splashed"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Toy_Group.pdf"}, "Chinese Crested": {"name": "Chinese Crested", "group": "Toy Group", "height": "11 to 13 in", "weight": "8 to 12 lb", "weight_note": null, "description": "The Chinese Crested, a lively and alert toy breed standing between 11 and 13 inches high, can be hairless or coated. The hairless variety has smooth, soft skin and tufts of hair on the head, tail, and ankles. The coated variety, called the “powderpuff,” is covered by a soft, silky coat. Besides the coat, there’s very little difference between the powderpuff and his undressed brother. Both varieties are characterized by fine-boned elegance and graceful movement.Cresteds are as fun as they look: playful, loving, and devoted to their humans. The hairless has its advantages: there is no doggy odor, and for obvious reasons shedding isn’t much of a problem. Both varieties are attentive housemates, totally in tune with their family. With their spotted pink skin, spiky “crested” hairdo, furry socks and feathery tail, you can’t mistake the sweet and slender Chinese Crested for any other breed. This frolicsome, ultra-affectionate companion dog is truly a breed apart.", "temperament": "Affectionate, Alert, Lively", "grooming": "Occasional Bath/Brush", "shedding": "Infrequent", "energy": "Regular Exercise", "life_expectancy": "13 to 18 years", "size_category": "Small", "varieties": "AKC coat types: Hairless and Powderpuff.", "akc_url": "https://www.akc.org/dog-breeds/chinese-crested/", "official_standard": {"size": "Ideally 11 to 13 inches", "coat": "Hairless variety has hair on head (crest), tail (plume), and feet (socks); Powderpuff is fully covered in soft, silky double coat", "color": "Any color or combination of colors"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Toy_Group.pdf"}, "Chinese Shar-Pei": {"name": "Chinese Shar-Pei", "group": "Non-Sporting Group", "height": "18 to 20 in", "weight": "45 to 60 lb", "weight_note": null, "description": "The compact, medium-sized Chinese Shar-Pei is an amalgam of odd physical traits: a broad “hippopotamus” muzzle; a blue-black tongue; small, sunken eyes with a scowling expression; tiny triangular ears; abundant folds of loose skin about the head, neck, and shoulders; the tapered high-set tail—all blanketed by a harsh, sandpapery coat. (A literal translation of Shar-Pei: “sand skin.”)Shar-Pei are strong, regal, independent guardians famous for intelligence and loyalty. They are suspicious of strangers and other dogs. Shar-Pei are serene dogs, but they will meet a perceived threat with tenacity and vigor. Early training and socialization are essential—a dominant adult Shar-Pei without them is a serious problem waiting to happen. This fascinating but challenging breed of ancient pedigree is steadfastly loyal to family, but standoffish with strangers. The Chinese Shar-Pei has physical characteristics that make him a one-of-a-kind companion and guardian dog.", "temperament": "Loyal, Independent, Calm", "grooming": "Occasional Bath/Brush", "shedding": "Regularly", "energy": "Regular Exercise", "life_expectancy": "8 to 12 years", "size_category": "Medium", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/chinese-shar-pei/", "official_standard": {"size": "Height 18 to 20 inches at the withers; weight 45 to 60 pounds", "coat": "Extremely harsh, straight, up to a brush coat not exceeding 1 inch at withers; soft, wavy, or trimmed coat is a major fault", "color": "Only solid colors and sable accepted, with darker shading down the back and on ears allowed; albino, brindle, parti-colored, or spotted disqualified"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Non-Sporting_Group.pdf"}, "Chow Chow": {"name": "Chow Chow", "group": "Non-Sporting Group", "height": "17 to 20 in", "weight": "45 to 70 lb", "weight_note": null, "description": "Chows are powerful, compactly built dogs standing as high as 20 inches at the shoulder. Their distinctive traits include a lion’s-mane ruff around the head and shoulders; a blue-black tongue; deep-set almond eyes that add to a scowling, snobbish expression; and a stiff-legged gait. Chows can have rough or smooth coats of red, black, blue, cinnamon, or cream.Owners say Chows are the cleanest of dogs: They housebreak easily, have little doggy odor, and are known to be as fastidious as cats. Well-socialized Chows are never fierce or intractable, but always refined and dignified. They are aloof with strangers and eternally loyal to loved ones. Serene and adaptable, with no special exercise needs, Chows happily take to city life. The Chow Chow, an all-purpose dog of ancient China, presents the picture of a muscular, deep-chested aristocrat with an air of inscrutable timelessness. Dignified, serious-minded, and aloof, the Chow Chow is a breed of unique delights.", "temperament": "Dignified, Bright, Serious-Minded", "grooming": "2-3 Times a Week Brushing", "shedding": "Seasonal", "energy": "Regular Exercise", "life_expectancy": "8 to 12 years", "size_category": "Large", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/chow-chow/", "official_standard": {"size": "Average adult height 17 to 20 inches at the withers", "coat": "Smooth, or rough double coat; rough outer coat is abundant, dense, straight, and offstanding over a soft, woolly undercoat", "color": "Five colors: red, black, blue, cinnamon, and cream; clear and solid, with lighter shadings allowed on ruff, tail, and featherings"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Non-Sporting_Group.pdf"}, "Clumber Spaniel": {"name": "Clumber Spaniel", "group": "Sporting Group", "height": "17 to 20 in", "weight": "55 to 85 lb", "weight_note": null, "description": "Clumber Spaniels are powerful bird dogs of heavy bone, built long and low, with a massive head. They stand 17 to 20 inches; a small female might be 55 pounds, and a large male could go 85 pounds. Built to push through thick cover in the field, Clumber movement is nonetheless free and easy. The dense coat is primarily white, with sparse lemon or orange markings.Clumbers are sweet and easygoing at home, but these outdoorsy fellows can be relentless on scent. Smart and eager-to-please Clumbers respond well to training. Though a bit wary around strangers, Clumbers are friendly dogs who bark only when they have something to say, and so make indifferent watchdogs. They love swimming and fetching, and are sturdy childhood playmates. A dignified and mellow hunting companion of kings, the Clumber Spaniel is the largest of the AKC flushing spaniels. For those who can handle some shedding and drooling, the amiable Clumber is an amusing best friend and a gentlemanly housemate.", "temperament": "Mellow, Amusing, Gentlemanly", "grooming": "Weekly Brushing", "shedding": "Regularly", "energy": "Regular Exercise", "life_expectancy": "10 to 12 years", "size_category": "Large", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/clumber-spaniel/", "official_standard": {"size": "Dogs 18 to 20 in, bitches 17 to 19 in at withers; dogs 70 to 85 lb, bitches 55 to 70 lb", "coat": "Dense, straight, flat body coat, weather-resistant and soft to touch; moderate feathering on legs and belly", "color": "Primarily white with lemon or orange markings"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Sporting_Group.pdf"}, "Cocker Spaniel": {"name": "Cocker Spaniel", "group": "Sporting Group", "height": "13.5 to 15.5 in", "weight": "20 to 30 lb", "weight_note": null, "description": "Those big, dark eyes; that sweet expression; those long, lush ears that practically demand to be touched—no wonder the Cocker spent years as America’s most popular breed. The Cocker is the AKC’s smallest sporting spaniel, standing about 14 to 15 inches. The coat comes in enough colors and patterns to please any taste. The well-balanced body is sturdy and solid, and these quick, durable gundogs move with a smooth, easy gait.Cockers are eager playmates for kids and are easily trained as companions and athletes. They are big enough to be sporty, but compact enough to be portable. A Cocker in full coat rewards extra grooming time by being the prettiest dog on the block. These energetic sporting dogs love playtime and brisk walks. The merry and frolicsome Cocker Spaniel, with his big, dreamy eyes and impish personality, is one of the world’s best-loved breeds. They were developed as hunting dogs, but Cockers gained their wide popularity as all-around companions.", "temperament": "Gentle, Smart, Happy", "grooming": "Daily Brushing", "shedding": "Occasional", "energy": "Regular Exercise", "life_expectancy": "10 to 14 years", "size_category": "Medium", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/cocker-spaniel/", "official_standard": {"size": "Ideal dog 15 in, bitch 14 in at withers; dogs over 15½ in and bitches over 14½ in disqualified", "coat": "Short and fine on head; medium length on body, silky, flat or slightly wavy; excessive, curly, or cottony coat penalized", "color": "Black, any solid other than black (cream to red, including brown), or parti-color; white only on chest/throat; tan points limited"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Sporting_Group.pdf"}, "Collie": {"name": "Collie", "group": "Herding Group", "height": "22 to 26 in", "weight": "50 to 75 lb", "weight_note": null, "description": "The Collie is a large but lithe herder standing anywhere from 22 to 26 inches tall. The rough variety boasts one of the canine kingdom’s most impressively showy coats; the smooth coat’s charms are subtler but no less satisfying. Coat colors in both varieties are sable and white, tricolor, blue merle, or white. Collie fanciers take pride in their breed’s elegant wedge-shaped head, whose mobile ears and almond eyes convey a wide variety of expressions.Collies are famously fond of children and make wonderful family pets. These swift, athletic dogs thrive on companionship and regular exercise. With gentle training, they learn happily and rapidly. The Collie’s loyalty, intelligence, and sterling character are the stuff of legend. The majestic Collie, thanks to a hundred years as a pop-culture star, is among the world’s most recognizable and beloved dog breeds. The full-coated “rough” Collie is the more familiar variety, but there is also a sleek “smooth” Collie.", "temperament": "Devoted, Graceful, Proud", "grooming": "2-3 Times a Week Brushing", "shedding": "Seasonal", "energy": "Regular Exercise", "life_expectancy": "12 to 14 years", "size_category": "Large", "varieties": "AKC coat varieties: Rough and Smooth.", "akc_url": "https://www.akc.org/dog-breeds/collie/", "official_standard": {"size": "Dogs 24 to 26 inches, 60 to 75 pounds; bitches 22 to 24 inches, 50 to 65 pounds at the shoulder", "coat": "Rough: abundant except head and legs, straight harsh outer coat, soft furry undercoat; Smooth: short, hard, dense, flat", "color": "Sable and white, tri-color, blue merle, and white; no preference among them"}, "official_standard_url": "https://images.akc.org/pdf/judges/Herding_Group_7-16.pdf"}, "Curly-Coated Retriever": {"name": "Curly-Coated Retriever", "group": "Sporting Group", "height": "23 to 27 in", "weight": "60 to 95 lb", "weight_note": null, "description": "The Curly-Coated Retriever’s tight, crisp curls of either black or liver serve as waterproof and thorn-resistant all-weather gear for work in thick bramble and icy lakes. The Curly is a big, durable gun dog, but more elegant and graceful than other retrievers. Another trait that sets Curlies apart from the usual retriever is a tapered, wedge-shaped head.Like Labradors and Goldens, Curlies are affectionate and gentle, but they are a bit more independent and less needy. Playful and mischievous with loved ones, Curlies can be aloof with strangers. This wariness makes them more discerning watchdogs than other, more gregarious retrievers. These tireless dogs need lots of outdoor exercise. Bored, underemployed Curlies are a handful. The Curly-Coated Retriever, among the oldest of the retriever breeds, is a famously versatile gundog and peerless swimmer. Poised, proud, and wickedly smart, the Curly is a thinking person’s retriever who will never quit before you do.", "temperament": "Confident, Proud, Wickedly Smart", "grooming": "Occasional Bath/Brush", "shedding": "Occasional", "energy": "Energetic", "life_expectancy": "10 to 12 years", "size_category": "Large", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/curly-coated-retriever/", "official_standard": {"size": "Ideal height dogs 25 to 27 inches, bitches 23 to 25 inches", "coat": "Body covered in a dense mass of small, tight, crisp curls; face, forehead, forelegs, and feet are short and smooth", "color": "Black or liver, both correct; prominent white patch undesirable, few white hairs allowed"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Sporting_Group.pdf"}, "Dachshund": {"name": "Dachshund", "group": "Hound Group", "height": "5 to 9 in", "weight": "11 to 32 lb", "weight_note": null, "description": "The word “icon” is terribly overworked, but the Dachshund—with his unmistakable long-backed body, little legs, and big personality—is truly an icon of purebred dogdom. Dachshunds can be standard-sized (usually 16 to 32 pounds) or miniature (11 pounds or under), and come in one of three coat types: smooth, wirehaired, or longhaired.Dachshunds aren’t built for distance running, leaping, or strenuous swimming, but otherwise these tireless hounds are game for anything. Smart and vigilant, with a big-dog bark, they make fine watchdogs. Bred to be an independent hunter of dangerous prey, they can be brave to the point of rashness, and a bit stubborn, but their endearing nature and unique look has won millions of hearts the world over. The famously long, low silhouette, ever-alert expression, and bold, vivacious personality of the Dachshund have made him a superstar of the canine kingdom. Dachshunds come in two sizes and in three coat types of various colors and patterns.", "temperament": "Friendly, Curious, Spunky", "grooming": "Weekly Brushing", "shedding": "Occasional", "energy": "Regular Exercise", "life_expectancy": "12 to 16 years", "size_category": "Small", "varieties": "AKC sizes: Standard and Miniature. AKC coats: Smooth, Wirehaired and Longhaired.", "akc_url": "https://www.akc.org/dog-breeds/dachshund/", "official_standard": {"size": "Two sizes, standard and miniature; miniatures compete in a class for dogs 11 pounds and under at 12 months and older; standard usually weighs 16 to 32 pounds", "coat": "Smooth (short, smooth, shiny), wirehaired (tight, short, rough outer coat with soft undercoat), longhaired (sleek, slightly wavy, longer on neck, chest, ears, and behind legs)", "color": "One-colored (red, cream); two-colored (black, chocolate, wild boar, blue, fawn) with tan markings; dapple; brindle; piebald; sable; other colors or patterns disqualified"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Hound_Group.pdf"}, "Dalmatian": {"name": "Dalmatian", "group": "Non-Sporting Group", "height": "19 to 24 in", "weight": "45 to 70 lb", "weight_note": null, "description": "The Dalmatian’s delightful, eye-catching spots of black or liver adorn one of the most distinctive coats in the animal kingdom. Beneath the spots is a graceful, elegantly proportioned trotting dog standing between 19 and 23 inches at the shoulder. Dals are muscular, built to go the distance; the powerful hindquarters provide the drive behind the smooth, effortless gait.The Dal was originally bred to guard horses and coaches, and some of the old protective instinct remains. Reserved and dignified, Dals can be aloof with strangers and are dependable watchdogs. With their preferred humans, Dals are bright, loyal, and loving house dogs. They are strong, active athletes with great stamina—a wonderful partner for runners and hikers. The dignified Dalmatian, dogdom's citizen of the world, is famed for his spotted coat and unique job description. During their long history, these \"coach dogs\" have accompanied the horse-drawn rigs of nobles, gypsies, and firefighters.", "temperament": "Dignified, Smart, Outgoing", "grooming": "Weekly Brushing", "shedding": "Frequent", "energy": "Energetic", "life_expectancy": "11 to 13 years", "size_category": "Large", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/dalmatian/", "official_standard": {"size": "Desirable height 19 to 23 inches at the withers; any dog or bitch over 24 inches disqualified", "coat": "Short, dense, fine, and close fitting; neither woolly nor silky; sleek, glossy", "color": "Pure white ground with dense black or liver spots; tri-color, patches, and any other markings disqualified"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Non-Sporting_Group.pdf"}, "Dandie Dinmont Terrier": {"name": "Dandie Dinmont Terrier", "group": "Terrier Group", "height": "8 to 11 in", "weight": "18 to 24 lb", "weight_note": null, "description": "Physical hallmarks of the Dandie Dinmont Terrier include a large head covered with profuse, silky white hair; long, hanging ears tipped with feathering and coming almost to a point; big, round eyes full of brightness and expression; and a long, low torso and short legs. The crisp body coat comes in two spicy colors: pepper (bluish black to silvery gray) and mustard (reddish brown to pale fawn).Weighing no more than 24 pounds, Dandies are alert and intelligent watchdogs with a big baritone bark. Dandies enjoy romping and cuddling with kids, but aren’t as hyper as some small dogs. They are terriers, though, with typical willfulness, independence, and courage. Dandie owners get best results with positive, motivational training. The unique-looking Dandie Dinmont Terrier is a tough but dignified little exterminator. Sturdily built for the rigors of farm life, they will agreeably adapt to city living. Dandies are compact companions blessed with a big personality.", "temperament": "Independent, Smart, Proud", "grooming": "Daily Brushing", "shedding": "Infrequent", "energy": "Regular Exercise", "life_expectancy": "12 to 15 years", "size_category": "Small", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/dandie-dinmont-terrier/", "official_standard": {"size": "Height 8 to 11 inches at top of shoulders; preferred weight 18 to 24 pounds in working condition", "coat": "About two inches long; crisp double coat, roughly two-thirds hardish hair and one-third soft hair; pily texture", "color": "Pepper (dark bluish black to silvery gray) or mustard (reddish brown to pale fawn); topknot and ear feather white or cream; some chest white common"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Terrier_Group.pdf"}, "Doberman Pinscher": {"name": "Doberman Pinscher", "group": "Working Group", "height": "24 to 28 in", "weight": "60 to 100 lb", "weight_note": null, "description": "Dobermans are compactly-built dogs—muscular, fast, and powerful—standing between 24 to 28 inches at the shoulder. The body is sleek but substantial, and is covered with a glistening coat of black, blue, red, or fawn, with rust markings. These elegant qualities, combined with a noble, wedge-shaped head and an easy, athletic way of moving have earned Dobermans a reputation as royalty in the canine kingdom. A well-conditioned Doberman on patrol will deter all but the most foolish intruder. Sleek and powerful, possessing both a magnificent physique and keen intelligence, the Doberman Pinscher is one of dogkind's noblemen. This incomparably fearless and vigilant breed stands proudly among the world's finest protection dogs.", "temperament": "Loyal, Fearless, Alert", "grooming": "Occasional Bath/Brush", "shedding": "Regularly", "energy": "Needs Lots of Activity", "life_expectancy": "10 to 12 years", "size_category": "Large", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/doberman-pinscher/", "official_standard": {"size": "Dogs 26 to 28 in, ideal about 27½; bitches 24 to 26 in, ideal about 25½, at withers", "coat": "Smooth-haired, short, hard, thick, close-lying coat; invisible gray undercoat on neck permissible", "color": "Black, red, blue, and fawn with sharply defined rust markings; white chest patch up to ½ sq in allowed; other colors disqualified"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Working_Group.pdf"}, "English Foxhound": {"name": "English Foxhound", "group": "Hound Group", "height": "24 in", "weight": "60 to 75 lb", "weight_note": null, "description": "The English Foxhound is the epitome of what serious dog breeders strive for: beauty, balance, and utility. “Next to an old Greek statue,” a poet wrote, “there are few such combinations of grace and strength as in a fine Foxhound.”These pack-oriented, scent-driven hounds are gentle and sociable, but rarely seen as house pets. They can be so driven by a primal instinct for pursuit that not much else, including training, matters to them. Owning these noble creatures is best left to huntsmen who kennel packs of hounds or to those experienced in meeting the special challenges of life with swift, powerful hounds hardwired for the chase. The English Foxhound is a substantial galloping hound of great stamina. His long legs are straight as a gatepost, and just as sturdy. The back is perfectly level. And the chest is very deep, “girthing” as much as 31 inches on a hound measuring 24 inches at the shoulder, ensuring plenty of lung power for a grueling day’s hunt.", "temperament": "Affectionate, Gentle, Sociable", "grooming": "Occasional Bath/Brush", "shedding": "Regularly", "energy": "Energetic", "life_expectancy": "10 to 13 years", "size_category": "Large", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/english-foxhound/", "official_standard": {"size": "Chest girth over 31 in in a 24-in hound", "coat": "Short, dense, hard, and glossy", "color": "Hound colors of black, tan, and white, in any combination, plus white-based pied colors"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Hound_Group.pdf"}, "English Setter": {"name": "English Setter", "group": "Sporting Group", "height": "23 to 27 in", "weight": "45 to 80 lb", "weight_note": null, "description": "English Setters are elegant but solid dogs of beauty and charm. The word “belton,” unique to the breed, describes the speckled coat patterns of colors that sound good enough to eat: liver, lemon, and orange among them. Under the showy coat is a well-balanced hunter standing about 25 inches at the shoulder.A graceful neck carries a long, oval-shaped head proudly, and dark brown eyes convey a soft expression. The merry English Setter is known as the gentleman of the dog world but is game and boisterous at play. English Setters get on well with other dogs and people. A veteran all-breed dog handler says, “As a breed to share one’s life and living space with, no other breed gives me more pleasure than the English Setter.” The English Setter is a medium-sized sporting dog of sweet temper and show-stopping good looks. It is one of the AKC’s four British setters created to work on the distinctly different terrains of England, Ireland, and Scotland.", "temperament": "Friendly, Mellow, Merry", "grooming": "2-3 Times a Week Brushing", "shedding": "Regularly", "energy": "Energetic", "life_expectancy": "12 to 12 years", "size_category": "Large", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/english-setter/", "official_standard": {"size": "Dogs about 25 in, bitches about 24 in", "coat": "Flat without curl or wooliness; feathering of good length but not excessive", "color": "White ground with belton markings in orange, blue, tricolor, lemon, or liver"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Sporting_Group.pdf"}, "English Springer Spaniel": {"name": "English Springer Spaniel", "group": "Sporting Group", "height": "19 to 20 in", "weight": "40 to 50 lb", "weight_note": null, "description": "Built for long days in the field, English Springer Spaniels are tough, muscular hunters standing 19 to 20 inches at the shoulder and weighing between 40 and 50 pounds. The double coat comes in several colors and patterns, the ears are long and lush, and the kindly, trusting expression of the eyes is a cherished hallmark of the breed. Springers move with a smooth, ground-covering stride.Bred to work closely with humans, Springers are highly trainable people-pleasers. They crave company and are miserable when neglected.Polite dogs, Springers are good with kids and their fellow mammals. They are eager to join in any family activity. Long walks, games of chase and fetch, and swimming are favorite pastimes of these rugged spaniels. The English Springer Spaniel is a sweet-faced, lovable bird dog of great energy, stamina, and brains. Sport hunters cherish the duality of working Springers: handsome, mannerly pets during the week, and trusty hunting buddies on weekends.", "temperament": "Friendly, Playful, Obedient", "grooming": "Weekly Brushing", "shedding": "Occasional", "energy": "Regular Exercise", "life_expectancy": "12 to 14 years", "size_category": "Medium", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/english-springer-spaniel/", "official_standard": {"size": "Ideal dogs 20 in, bitches 19 in at shoulder; about 50 lb for a 20 in dog, 40 lb for a 19 in bitch", "coat": "Outer coat medium length, flat or wavy, over short soft dense undercoat; feathering on ears, chest, legs, and belly", "color": "Black or liver with white; predominantly white with black or liver; blue or liver roan; tricolor with tan markings"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Sporting_Group.pdf"}, "Entlebucher Mountain Dog": {"name": "Entlebucher Mountain Dog", "group": "Herding Group", "height": "16 to 21 in", "weight": "40 to 65 lb", "weight_note": null, "description": "Entlebucher (ENT-leh-boo-cur) Mountain Dogs are muscular, long-backed cattle dogs standing from 16 to 21 inches at the shoulder. They have short, sturdy legs; a striking black, white, and tan coat; and an attentive, friendly face. Entles are famous for their agility, balance, and boundless enthusiasm.Entles are vigilant protectors of their four- or two-legged “herds” and, when properly socialized, make durable and trustworthy playmates for older kids. Energetic Entles require lots of exercise, family time, and direction to reach their full potential. Inexperienced owners might be overwhelmed by this strong, self-confident, go-go herding dog eager for work.Entlebuchers are fine dogs—clever, zesty, happy—but not for everyone. The Entlebucher Mountain Dog, tricolor “Laughing Dog” of the Swiss Alps, is a rugged and determined mover of cattle. These spirited, energetic workers and athletes are independent problem solvers and are happiest with a job to perform.", "temperament": "Loyal, Smart, Enthusiastic", "grooming": "Occasional Bath/Brush", "shedding": "Infrequent", "energy": "Needs Lots of Activity", "life_expectancy": "11 to 13 years", "size_category": "Medium", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/entlebucher-mountain-dog/", "official_standard": {"size": "Dogs 17.5 to 20.5 inches; bitches 16.5 to 19.5 inches at the withers", "coat": "Double coat; topcoat short, close fitting, harsh, and shiny; dense undercoat", "color": "Tricolor: black basic color with tan (fawn to mahogany) and white markings, as symmetric as possible"}, "official_standard_url": "https://images.akc.org/pdf/judges/Herding_Group_7-16.pdf"}, "Flat-Coated Retriever": {"name": "Flat-Coated Retriever", "group": "Sporting Group", "height": "22 to 24.5 in", "weight": "60 to 70 lb", "weight_note": null, "description": "The Flat-Coated Retriever’s eponymous flat-lying coat comes in lustrous black or liver, with feathering at the legs and tail. A distinctive breed hallmark is the long head—unique among retrievers—which projects a smart and kindly expression. A Flat-Coat will stand as tall as a Labrador Retriever, but in silhouette they present a leaner, more elegant look.Dogdom’s champion tail-waggers, Flat-Coats are among the happiest of all breeds. They mature slowly; some owners say that they never grow up at all, retaining a puppyish taste for rambunctious mischief into old age. This can be either delightful or exasperating, depending on your tolerance for such monkeyshines. This highly energetic breed requires lots of outdoorsy exercise. The Peter Pan of the Sporting Group, the forever-young Flat-Coated Retriever is a gundog of relatively recent origin. Happy, self-assured, and willing to please, a good Flat-Coat will retrieve a duck or a show ribbon with equal aplomb.", "temperament": "Cheerful, Optimistic, Good-Humored", "grooming": "Weekly Brushing", "shedding": "Regularly", "energy": "Needs Lots of Activity", "life_expectancy": "8 to 10 years", "size_category": "Large", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/flat-coated-retriever/", "official_standard": {"size": "Preferred height 23 to 24½ inches for dogs, 22 to 23½ inches for bitches", "coat": "Moderate length, dense, flat-lying, high lustre; slight waviness allowed; not curly, wooly, short, silky, or fluffy", "color": "Solid black or solid liver only; yellow, cream, or any other color disqualifies"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Sporting_Group.pdf"}, "French Bulldog": {"name": "French Bulldog", "group": "Non-Sporting Group", "height": "11 to 13 in", "weight": "about 28 lb (AKC lists one figure)", "weight_note": null, "description": "The French Bulldog resembles a Bulldog in miniature, except for the large, erect “bat ears” that are the breed’s trademark feature. The head is large and square, with heavy wrinkles rolled above the extremely short nose. The body beneath the smooth, brilliant coat is compact and muscular.The bright, affectionate Frenchie is a charmer. Dogs of few words, Frenchies don’t bark much—but their alertness makes them excellent watchdogs. They happily adapt to life with singles, couples, or families, and do not require a lot of outdoor exercise. They get on well with other animals and enjoy making new friends of the human variety. It is no wonder that city folk from Paris to Peoria swear by this vastly amusing and companionable breed. The one-of-a-kind French Bulldog, with his large bat ears and even disposition, is one of the world’s most popular small-dog breeds, especially among city dwellers. The Frenchie is playful, alert, adaptable, and completely irresistible.", "temperament": "Adaptable, Playful, Smart", "grooming": "Occasional Bath/Brush", "shedding": "Regularly", "energy": "Calm", "life_expectancy": "10 to 12 years", "size_category": "Small", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/french-bulldog/", "official_standard": {"size": "Weight not to exceed 28 pounds; over 28 pounds disqualified", "coat": "Brilliant, short, and smooth; soft, loose skin forming wrinkles at head and shoulders; other coats disqualified", "color": "White, cream, or fawn (light to red fawn), or combinations; brindle, piebald, black masks, and white markings allowed; blue, liver, and merle disqualified"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Non-Sporting_Group.pdf"}, "German Shepherd Dog": {"name": "German Shepherd Dog", "group": "Herding Group", "height": "22 to 26 in", "weight": "50 to 90 lb", "weight_note": null, "description": "German Shepherd Dogs can stand as high as 26 inches at the shoulder and, when viewed in outline, presents a picture of smooth, graceful curves rather than angles. The natural gait is a free-and-easy trot, but they can turn it up a notch or two and reach great speeds.There are many reasons why German Shepherds stand in the front rank of canine royalty, but experts say their defining attribute is character: loyalty, courage, confidence, the ability to learn commands for many tasks, and the willingness to put their life on the line in defense of loved ones. German Shepherds will be gentle family pets and steadfast guardians, but, the breed standard says, there’s a “certain aloofness that does not lend itself to immediate and indiscriminate friendships.” Generally considered dogkind’s finest all-purpose worker, the German Shepherd Dog is a large, agile, muscular dog of noble character and high intelligence. Loyal, confident, courageous, and steady, the German Shepherd is truly a dog lover’s delight.", "temperament": "Confident, Courageous, Smart", "grooming": "Weekly Brushing", "shedding": "Regularly", "energy": "Regular Exercise", "life_expectancy": "7 to 10 years", "size_category": "Large", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/german-shepherd-dog/", "official_standard": {"size": "Males 24 to 26 inches; bitches 22 to 24 inches at the highest point of the shoulder blade", "coat": "Double coat of medium length; outer coat dense, straight, harsh, close lying; slightly wavy outer coat permissible", "color": "Most colors permissible, strong rich colors preferred; pale, washed-out colors, blues, or livers serious faults; white dogs disqualified"}, "official_standard_url": "https://images.akc.org/pdf/judges/Herding_Group_7-16.pdf"}, "German Shorthaired Pointer": {"name": "German Shorthaired Pointer", "group": "Sporting Group", "height": "21 to 25 in", "weight": "45 to 70 lb", "weight_note": null, "description": "Male German Shorthaired Pointers stand between 23 and 25 inches at the shoulder and weigh anywhere from 55 to 70 pounds; females run smaller. The coat is solid liver (a reddish brown), or liver and white in distinctive patterns. The dark eyes shine with enthusiasm and friendliness. Built to work long days in the field or at the lake, GSPs are known for power, speed, agility, and endurance. “Noble” and “aristocratic” are words often used to describe the overall look.GSPs make happy, trainable pets who bond firmly to their family. They are always up for physical activities like running, swimming, organized dog sports—in fact, anything that will burn some of their boundless energy while spending outdoors time with a human buddy. The versatile, medium-sized German Shorthaired Pointer is an enthusiastic gundog of all trades who thrives on vigorous exercise, positive training, and a lot of love. GSP people call their aristocratic companions the “perfect pointer.”", "temperament": "Friendly, Smart, Willing to Please", "grooming": "Weekly Brushing", "shedding": "Regularly", "energy": "Needs Lots of Activity", "life_expectancy": "10 to 12 years", "size_category": "Large", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/german-shorthaired-pointer/", "official_standard": {"size": "Dogs 23 to 25 inches, 55 to 70 pounds; bitches 21 to 23 inches, 45 to 60 pounds", "coat": "Short and thick, tough to the touch; somewhat longer under the tail and back of haunches; softer and shorter on ears and head", "color": "Solid liver or black, or liver/black with white; any red, orange, lemon, or tan, or solid white, disqualifies"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Sporting_Group.pdf"}, "Giant Schnauzer": {"name": "Giant Schnauzer", "group": "Working Group", "height": "23.5 to 27.5 in", "weight": "Males 75 to 95 lb, females 55 to 80 lb", "weight_note": null, "description": "A well-bred Giant Schnauzer closely resembles the Standard Schnauzer—only bigger. As their name suggests, Giants are imposing.A male might stand as high as 27.5 inches at the shoulder and weigh 95 pounds. The muscular, substantial body is, as the breed’s fanciers put it, a “bold and valiant figure of a dog.” The double coat is either solid black or “pepper and salt.” Familiar characteristics of the Mini, Standard, and Giant are a harsh beard and eyebrows, accentuating a keen, sagacious expression. The Giant Schnauzer is a larger and more powerful version of the Standard Schnauzer, and he should, as the breed standard says, be a “bold and valiant figure of a dog.” Great intelligence and loyalty make him a stellar worker and companion.", "temperament": "Loyal, Alert, Trainable", "grooming": "Daily Brushing", "shedding": null, "energy": "Needs Lots of Activity", "life_expectancy": "12 to 15 years", "size_category": "Large", "varieties": "Giant, Standard and Miniature Schnauzers are three separate AKC breeds.", "akc_url": "https://www.akc.org/dog-breeds/giant-schnauzer/", "official_standard": {"size": "Dogs 25½ to 27½ inches; bitches 23½ to 25½ inches at withers", "coat": "Hard, wiry, very dense; soft undercoat with harsh outer coat; coarse hair on head; harsh beard and eyebrows", "color": "Solid black or pepper and salt; black must be pure, with only a small white breast spot; dark facial mask"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Working_Group.pdf"}, "Golden Retriever": {"name": "Golden Retriever", "group": "Sporting Group", "height": "21.5 to 24 in", "weight": "55 to 75 lb", "weight_note": null, "description": "The Golden Retriever is a sturdy, muscular dog of medium size, famous for the dense, lustrous coat of gold that gives the breed its name. The broad head, with its friendly and intelligent eyes, short ears, and straight muzzle, is a breed hallmark. In motion, Goldens move with a smooth, powerful gait, and the feathery tail is carried, as breed fanciers say, with a “merry action.”The most complete records of the development of the Golden Retriever are included in the record books that were kept from 1835 until about 1890 by the gamekeepers at the Guisachan (pronounced Gooeesicun) estate of Lord Tweedmouth at Inverness-Shire, Scotland. These records were released to public notice in Country Life in 1952, when Lord Tweedmouth’s great-nephew, the sixth Earl of Ilchester, historian and sportsman, published material that had been left by his ancestor. They provided factual confirmation to the stories that had been handed down through generations.Goldens are outgoing, trustworthy, and eager-to-please family dogs, and relatively easy to train. They take a joyous and playful approach to life and maintain this puppyish behavior into adulthood. These energetic, powerful gundogs enjoy outdoor play. For a breed built to retrieve waterfowl for hours on end, swimming and fetching are natural pastimes. The Golden Retriever, an exuberant Scottish gundog of great beauty, stands among America’s most popular dog breeds. They are serious workers at hunting and field work, as guides for the blind, and in search-and-rescue, enjoy obedience and other competitive events, and have an endearing love of life when not at work.", "temperament": "Friendly, Intelligent, Devoted", "grooming": "Weekly Brushing", "shedding": "Seasonal", "energy": "Needs Lots of Activity", "life_expectancy": "10 to 12 years", "size_category": "Large", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/golden-retriever/", "official_standard": {"size": "Males 23 to 24 inches, females 21½ to 22½ inches; dogs 65 to 75 pounds, bitches 55 to 65 pounds", "coat": "Dense and water-repellent with good undercoat; outer coat firm and resilient, straight or wavy; feathering on legs, underbody, and tail", "color": "Rich golden shades; feathering may be lighter; light shading allowed; white markings beyond a few chest hairs penalized by extent; black or off-color areas are serious faults"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Sporting_Group.pdf"}, "Gordon Setter": {"name": "Gordon Setter", "group": "Sporting Group", "height": "23 to 27 in", "weight": "45 to 80 lb", "weight_note": null, "description": "Gordons are the largest and most substantial of the setters—a big male might stand 27 inches at the shoulder and weigh 80 pounds. The stunning coat is a glistening black, with tan markings and long hair on the ears, belly, legs, chest, and tail. Tan spots above the bright brown eyes point up a wise and willing expression. Like other Scots breeds, from the compact Scottish Terrier to the majestic Scottish Deerhound, Gordons were built to withstand their homeland’s tough terrain and foul weather. The Gordon Setter, the black avenger of the Highlands, is a substantial bird dog named for a Scottish aristocrat. Athletic and outdoorsy, Gordons are bold, confident, and resolute in the field, and sweetly affectionate by the fireside.", "temperament": "Affectionate, Confident, Bold", "grooming": "Weekly Brushing", "shedding": "Seasonal", "energy": "Needs Lots of Activity", "life_expectancy": "12 to 13 years", "size_category": "Large", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/gordon-setter/", "official_standard": {"size": "Males 24 to 27 in, females 23 to 26 in at shoulder; males 55 to 80 lb, females 45 to 70 lb", "coat": "Soft, shining, straight or slightly waved, not curly; long hair on ears, underbody, chest, legs, and tail", "color": "Black with rich chestnut or mahogany tan markings; predominantly tan, red, or buff dogs disqualified"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Sporting_Group.pdf"}, "Great Dane": {"name": "Great Dane", "group": "Working Group", "height": "28 to 32 in", "weight": "110 to 175 lb", "weight_note": null, "description": "As tall as 32 inches at the shoulder, Danes tower over most other dogs—and when standing on their hind legs, they are taller than most people. These powerful giants are the picture of elegance and balance, with the smooth and easy stride of born noblemen. The coat comes in different colors and patterns, perhaps the best-known being the black-and-white patchwork pattern known as “harlequin.”Despite their sweet nature, Danes are alert home guardians. Just the sight of these gentle giants is usually enough to make intruders think twice. But those foolish enough to mistake the breed’s friendliness for softness will meet a powerful foe of true courage and spirit. Patient with kids, Danes are people pleasers who make friends easily. The easygoing Great Dane, the mighty “Apollo of Dogs,” is a total joy to live with—but owning a dog of such imposing size, weight, and strength is a commitment not to be entered into lightly. This breed is indeed great, but not a Dane.", "temperament": "Friendly, Patient, Dependable", "grooming": "Occasional Bath/Brush", "shedding": "Seasonal", "energy": "Energetic", "life_expectancy": "7 to 10 years", "size_category": "Giant", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/great-dane/", "official_standard": {"size": "Males at least 30 inches at shoulders, preferably 32 or more; females at least 28 inches, preferably 30 or more", "coat": "Short, thick, clean, smooth, glossy", "color": "Seven colors: brindle, fawn (yellow gold), blue (steel blue), black, harlequin, mantle, and merle"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Working_Group.pdf"}, "Great Pyrenees": {"name": "Great Pyrenees", "group": "Working Group", "height": "25 to 32 in", "weight": "85 to 100 lb", "weight_note": null, "description": "Frequently described as “majestic,” Pyrs are big, immensely strong mountain dogs standing as high as 32 inches at the shoulder and often tipping the scales at more than 100 pounds. These steadfast guardians usually exhibit a Zen-like calm, but they can quickly spring into action and move with grace and speed to meet a threat. The lush weatherproof coat is all white, or white with markings of beautiful shades of gray, tan, reddish-brown, or badger. The Great Pyrenees is a large, thickly coated, and immensely powerful working dog bred to deter sheep-stealing wolves and other predators on snowy mountaintops. Pyrs today are mellow companions and vigilant guardians of home and family.", "temperament": "Smart, Patient, Calm", "grooming": "Weekly Brushing", "shedding": "Seasonal", "energy": "Needs Lots of Activity", "life_expectancy": "10 to 12 years", "size_category": "Large", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/great-pyrenees/", "official_standard": {"size": "Dogs 27 to 32 inches; bitches 25 to 29 inches at withers; 27-inch dog about 100 pounds, 25-inch bitch about 85 pounds", "coat": "Double coat: long, flat, thick, coarse outer coat over dense, woolly undercoat; weather resistant", "color": "White, or white with gray, badger, reddish brown, or varying shades of tan markings"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Working_Group.pdf"}, "Greater Swiss Mountain Dog": {"name": "Greater Swiss Mountain Dog", "group": "Working Group", "height": "23.5 to 28.5 in", "weight": "85 to 140 lb", "weight_note": null, "description": "“Greater” than what? Well, standing as high as 28.5 inches and weighing as much as a midsize human, a Greater Swiss might easily be greater than you.Swissies are immensely strong, yet agile enough to move a flock across the sloping foot of a mountain. The coat is a striking tricolor—black, red, and white. The head and muzzle typically have a white marking (the “blaze”), setting off a sweet expression. Several big mountain-dog breeds are described as “majestic,” but Swissies practically invented the word. The Greater Swiss Mountain Dog is a large, immensely strong worker famous for a dense coat of striking black, red, and white markings. Dependable and faithful Swissies earned their feed as herders, drafters, and all-around pasture dogs.", "temperament": "Faithful, Family-Oriented, Dependable", "grooming": "Weekly Brushing", "shedding": "Seasonal", "energy": "Energetic", "life_expectancy": "8 to 11 years", "size_category": "Giant", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/greater-swiss-mountain-dog/", "official_standard": {"size": "Dogs 25½ to 28½ inches; bitches 23½ to 27 inches at shoulder", "coat": "Dense topcoat about 1¼ to 2 inches long; undercoat must be present", "color": "Black topcoat with rust and white markings"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Working_Group.pdf"}, "Greyhound": {"name": "Greyhound", "group": "Hound Group", "height": "27 to 30 in", "weight": "60 to 70 lb", "weight_note": null, "description": "Greyhounds are the essence of the dog breeder’s credo “Form follows function.” From the narrow, aerodynamic skull to the shock-absorbing pads of the feet, Greyhounds are perfectly constructed for high-speed pursuit. The lean beauty of the Greyhound’s “inverted S” shape, created by the deep chest curving gently into a tightly tucked waist, has been an object of fascination for artists, poets, and kings for as long as human beings have called themselves civilized. Greyhounds are the template from which other coursing hounds have been struck. The champion sprinter of dogdom, the Greyhound dog breed is a gentle, noble, and sweet-tempered companion with an independent spirit. For thousands of years these graceful hounds have been an object of fascination for artists, poets, and kings.", "temperament": "Gentle, Independent, Noble", "grooming": "Occasional Bath/Brush", "shedding": "Occasional", "energy": "Energetic", "life_expectancy": "10 to 13 years", "size_category": "Large", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/greyhound/", "official_standard": {"size": "Dogs 65 to 70 lb; bitches 60 to 65 lb", "coat": "Short, smooth, and firm", "color": "Immaterial"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Hound_Group.pdf"}, "Havanese": {"name": "Havanese", "group": "Toy Group", "height": "8.5 to 11.5 in", "weight": "7 to 13 lb", "weight_note": null, "description": "Distinctive features of the Havanese include a curled-over tail and a gorgeous silky coat, which comes in a variety of colors. Some owners enjoy cording the coat, in the manner of a Puli, and others clip it short to reduce grooming time. Happily, Havenese are just as cute no matter what hairdo you give them.Their small but sturdy bodies, adaptable nature, and social skills make Havanese an ideal city dog, but they are content to be anywhere that they can command the attention of admirers young and old alike. Havanese, smart and trainable extroverts with the comic instincts of a born clown, are natural trick dogs. Havanese are also excellent watchdogs and take the job seriously, but will usually keep the barking to a minimum. Havanese, the only dog breed native to Cuba, are cheerful little dogs with a spring in their step and a gleam in their big, brown eyes. These vivacious and sociable companions are becoming especially popular with American city dwellers.", "temperament": "Intelligent, Outgoing, Funny", "grooming": "2-3 Times a Week Brushing", "shedding": "Occasional", "energy": "Regular Exercise", "life_expectancy": "14 to 16 years", "size_category": "Small", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/havanese/", "official_standard": {"size": "Ideal height 9 to 10½ inches; acceptable range 8½ to 11½ inches at withers", "coat": "Long, abundant, wavy, silky double coat; coarse, wiry or short, smooth coat is disqualified", "color": "All colors and marking patterns of equal merit"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Toy_Group.pdf"}, "Ibizan Hound": {"name": "Ibizan Hound", "group": "Hound Group", "height": "22.5 to 27.5 in", "weight": "45 to 50 lb", "weight_note": null, "description": "Ibizans are lithe and leggy visitors from the dawn of civilization. Art history students will recognize the elongated head, with its large erect ears, as a familiar motif of ancient Egypt. The elegant, racy body stands 22.5 to 27.5 inches at the shoulder, with coat colors of solid red or white, or red and white patterns. The rosy-colored leathers of the nose, eye rims, and lips—along with amber or caramel eyes—perfectly complement the coat. The breed’s quiet grace is often described as deer-like. The Ibizan Hound is a lithe and leggy visitor from the dawn of civilization, bred as a rabbit courser on the rocky shores of Spain’s Balearic Islands. World-class sprinters and leapers, Ibizans need ample space to air out their engines.", "temperament": "Family-Oriented, Even-Tempered, Polite", "grooming": "Occasional Bath/Brush", "shedding": "Occasional", "energy": "Needs Lots of Activity", "life_expectancy": "11 to 14 years", "size_category": "Medium", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/ibizan-hound/", "official_standard": {"size": "Dogs 23½ to 27½ in; bitches 22½ to 26 in; average weight dogs 50 lb, bitches 45 lb", "coat": "Two coat types, both untrimmed; short on head and ears, longest on thighs and under tail; wire-haired up to 1 to 3 inches", "color": "White or red, from light yellowish-red to deep red, solid or in any combination"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Hound_Group.pdf"}, "Irish Setter": {"name": "Irish Setter", "group": "Sporting Group", "height": "25 to 27 in", "weight": "60 to 70 lb", "weight_note": null, "description": "The Irish Setter has been described by its partisans as the most beautiful of dog breeds. Standing more than two feet at the shoulder, with a substantial yet elegant build, the Irish is famed for a brilliant coat of mahogany or chestnut. Long, sinewy legs and powerful rear drive help to place the Irish among the swiftest of all sporting dogs.The Irish Setter’s lovable personality has endeared the breed to sportsmen and pet owners for more than 200 years. Irish are outgoing dogs who enjoy making friends. These rambunctious redheads are big kids at heart, but they are eager to please and will respond to patient, positive training. They are said to be bold and rugged hunting partners, with a devil-may-care approach to their work. The Irish Setter is a high-spirited gundog known for grace, swiftness, and a flashy red coat. They are famously good family dogs: sweet-tempered companions for the folks, and rollicking playmates and tennis-ball fetchers for the children.", "temperament": "Active, Outgoing, Sweet-Natured", "grooming": "2-3 Times a Week Brushing", "shedding": "Seasonal", "energy": "Needs Lots of Activity", "life_expectancy": "12 to 15 years", "size_category": "Large", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/irish-setter/", "official_standard": {"size": "Ideal dogs 27 in and about 70 lb, bitches 25 in and about 60 lb", "coat": "Short and fine on head and forelegs; moderate length and flat elsewhere; long silky feathering on ears, legs, and tail", "color": "Mahogany or rich chestnut red with no black; small white on chest, throat, or toes, or narrow skull streak, not penalized"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Sporting_Group.pdf"}, "Irish Terrier": {"name": "Irish Terrier", "group": "Terrier Group", "height": "18 in", "weight": "25 to 27 lb", "weight_note": null, "description": "Irish Terriers are the prototype of a long-legged terrier. Standing about 18 inches at the shoulder, they’re sturdy but lithe and graceful. Every line of the body is eye-catching, and the overall picture is beautifully balanced. The tight red coat is as fiery as the breed’s temperament. ITs are a dog lover’s delight: If your heart doesn’t go pitty-pat at the sight of this Technicolor terrier framed against the vivid greens of the Irish countryside, forget dogs and buy a goldfish. The Irish Terrier, “Daredevil” of the Emerald Isle, is a bold, dashing, and courageous terrier of medium size. Known for his fiery red coat and a temperament to match, the Irish Terrier is stouthearted at work and tenderhearted at home.", "temperament": "Bold, Dashing, Tenderhearted", "grooming": "Occasional Bath/Brush", "shedding": null, "energy": "Regular Exercise", "life_expectancy": "13 to 15 years", "size_category": "Medium", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/irish-terrier/", "official_standard": {"size": "Show weight about 27 pounds for dogs, 25 for bitches; height about 18 inches at shoulder", "coat": "Dense, wiry, broken appearance lying fairly close; undercoat present; no softness or silkiness; wavy or single coats undesirable", "color": "Bright red, golden red, red wheaten, or wheaten; small chest white patch permitted but not desirable; other white most objectionable"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Terrier_Group.pdf"}, "Irish Water Spaniel": {"name": "Irish Water Spaniel", "group": "Sporting Group", "height": "21 to 24 in", "weight": "45 to 68 lb", "weight_note": null, "description": "Standing 21 to 24 inches at the shoulder and weighing 55 to 65 pounds, the Irish Water Spaniel straddles the line between “medium” and “large” dogs on our scale of size. Among its distinguishing characteristics are a crisply curled, liver-colored, waterproof coat; a tapered “rat tail”; and a cleanly chiseled head crowned with a topknot of long, loose curls. The IWS moves with a smooth ground-covering gait, enabling him to put in a long day’s work in the field. The tallest of the AKC’s spaniels, the Irish Water Spaniel is instantly recognizable by its crisply curled coat and tapering “rat tail.” Among the champion swimmers of dogdom, the alert and inquisitive IWS is hardworking and brave in the field, and playfully affectionate at home.", "temperament": "Playful, Hardworking, Brave", "grooming": "Weekly Brushing", "shedding": "Seasonal", "energy": "Needs Lots of Activity", "life_expectancy": "12 to 13 years", "size_category": "Large", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/irish-water-spaniel/", "official_standard": {"size": "Dogs 22 to 24 inches, bitches 21 to 23 inches at withers; dogs 55 to 68 pounds, bitches 45 to 58 pounds", "coat": "Dense, crisply curled body coat; long loose curled topknot; smooth face and smooth tail", "color": "Rich liver to dark liver with a purplish tinge; no white except graying with age"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Sporting_Group.pdf"}, "Irish Wolfhound": {"name": "Irish Wolfhound", "group": "Hound Group", "height": "30 to 32 in", "weight": "105 to 120 lb", "weight_note": null, "description": "The amiable Irish Wolfhound is an immense, muscular hound gracefully built along classic Greyhound lines, capable of great speed at the gallop. A male might stand nearly 3 feet at the shoulder and weigh up to 180 pounds. Females will run smaller but are still a whole lot of hound. The rough, hard coat comes in many colors, including white, gray, brindle, red, black, and fawn.IWs are too serene to be fierce guard dogs, but just the sight of them is enough to deter intruders. IWs are characteristically patient with kids, though animals their size should be supervised around small children. Owning an Irish Wolfhound is a unique, rewarding experience—but acquiring a giant galloping hound is a commitment as big as the dog itself. The calm, dignified, and kindly Irish Wolfhound is the tallest of all AKC breeds. Once fearless big-game hunters capable of dispatching a wolf in single combat, Wolfhounds today are the most serene and agreeable of companions.", "temperament": "Courageous, Dignified, Calm", "grooming": "Weekly Brushing", "shedding": "Seasonal", "energy": "Regular Exercise", "life_expectancy": "6 to 8 years", "size_category": "Giant", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/irish-wolfhound/", "official_standard": {"size": "Dogs minimum 32 inches and 120 pounds; bitches minimum 30 inches and 105 pounds (over 18 months)", "coat": "Rough, hard, wiry, especially long over eyes and underjaw", "color": "Gray, brindle, red, black, pure white, fawn, or any color found in the Deerhound"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Hound_Group.pdf"}, "Italian Greyhound": {"name": "Italian Greyhound", "group": "Toy Group", "height": "13 to 15 in", "weight": "7 to 14 lb", "weight_note": null, "description": "IGs are Greyhounds in miniature—more slender, but a Greyhound’s equal in grace and elegance. Standing ideally 13 to 15 inches at the shoulder, they present the sleek, curving lines common to all coursing hounds. Distinguishing features are the long, fine-boned legs.IGs combine the attentiveness of lapdogs with the complexity of ancient, aristocratic hounds. Bred for centuries to be doting companions and jesters, these high-stepping charmers refuse to be ignored. “On the whole,” writes an IG expert, “the breed would much rather be in your lap or bed than on the floor.” They are, though, true sighthounds and will bolt after quick-moving prey at the drop of a cat. A short-coat, low-fat breed, IGs require extra care in cold weather A true Greyhound in miniature, the elegant Italian Greyhound is an alert, playful, and highly affectionate toy companion. IGs make decorative couch dogs, but at heart they are flash-and-dash coursing hounds with an instinct for pursuit.", "temperament": "Playful, Alert, Sensitive", "grooming": "Occasional Bath/Brush", "shedding": "Seasonal", "energy": "Regular Exercise", "life_expectancy": "14 to 15 years", "size_category": "Small", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/italian-greyhound/", "official_standard": {"size": "Height at withers ideally 13 to 15 inches", "coat": "Skin fine and supple; hair short, glossy like satin, and soft to the touch", "color": "Any color and markings; brindle markings or black-and-tan style tan markings are disqualified"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Toy_Group.pdf"}, "Japanese Chin": {"name": "Japanese Chin", "group": "Toy Group", "height": "8 to 11 in", "weight": "7 to 11 lb", "weight_note": null, "description": "Chin are the unrivaled noblemen of Japanese breeds. They’re tiny “indoorsy” companions, with an unmistakably Eastern look and bearing. The head is large, the muzzle short, and the round, dark eyes convey, as Chin fans like to say, a “look of astonishment.” The profuse mane around the neck and shoulders, the plumed tail arching over the back, and the pants or “culottes” on the hind legs project the elegant, exotic appearance so typical of Asia’s royal line of laptop cuddle bugs. The Japanese Chin is a charming toy companion of silky, profuse coat and an unmistakably aristocratic bearing. Often described as a distinctly “feline” breed, this bright and amusing lapdog is fastidious, graceful, and generally quiet.", "temperament": "Charming, Noble, Loving", "grooming": "Weekly Brushing", "shedding": "Seasonal", "energy": "Regular Exercise", "life_expectancy": "10 to 12 years", "size_category": "Toy", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/japanese-chin/", "official_standard": {"size": "Ideal size 8 to 11 inches at highest point of withers", "coat": "Abundant, straight, single, silky coat; profuse plume tail; mane on neck and shoulders; culottes on rear", "color": "Black and white, red and white, or black and white with tan points; any color not listed is disqualified"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Toy_Group.pdf"}, "Keeshond": {"name": "Keeshond", "group": "Non-Sporting Group", "height": "17 to 18 in", "weight": "35 to 45 lb", "weight_note": null, "description": "These square, sturdy companions descend from the same ancient stock as other spitz types, such as Pomeranians and Samoyeds. Typically “spitzy,” Keeshonden have a foxy face, pointed ears, an abundant coat, and a plumed tail carried high over the back. A unique breed characteristic—and one of the most charming hallmarks in all dogdom—is the “spectacles.” These shadings and markings around the eyes give the impression that a Kees is wearing designer eyewear. The specs draw attention to an alert, intelligent expression. The amiable Keeshond is a medium-sized spitz dog of ample coat, famous for the distinctive “spectacles” on his foxy face. Once a fixture on the canal barges of his native Holland, the Kees was, and remains, a symbol of Dutch patriotism.", "temperament": "Friendly, Lively, Outgoing", "grooming": "2-3 Times a Week Brushing", "shedding": "Seasonal", "energy": "Regular Exercise", "life_expectancy": "12 to 15 years", "size_category": "Medium", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/keeshond/", "official_standard": {"size": "Ideal height 18 inches for males and 17 inches for bitches; a 1-inch variance either way is acceptable", "coat": "Long, straight, harsh outer coat standing out from a thick, downy undercoat; mane, trousers, and plumed tail; shown naturally", "color": "Mixture of gray, black, and cream that may vary from light to dark; black-tipped outer coat; pale gray or cream undercoat; spectacles required"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Non-Sporting_Group.pdf"}, "Kerry Blue Terrier": {"name": "Kerry Blue Terrier", "group": "Terrier Group", "height": "17.5 to 19.5 in", "weight": "33 to 40 lb", "weight_note": null, "description": "Of course, we begin with the show-stopping coat that turns heads wherever Kerries go. It comes in shades of blue—from a deep slate to a light blue-gray—and is so soft that it’s as pleasing to the touch as it is to the eye. The dense coat covers a muscular, well-developed body standing below 20 inches at the shoulder and weighing up to 40 pounds. A sporty beard and dark, keen eyes accentuate the nobility of the long terrier head. Among the largest of AKC terriers, the Kerry Blue Terrier is famous for his show-stopping blue coat. Named for the Irish county of his birth, this onetime farm dog is today an alert, adaptable, and animated watchdog and family companion.", "temperament": "Smart, Alert, People-Oriented", "grooming": "2-3 Times a Week Brushing", "shedding": null, "energy": "Regular Exercise", "life_expectancy": "12 to 15 years", "size_category": "Medium", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/kerry-blue-terrier/", "official_standard": {"size": "Ideal 18½ inches at withers for dogs, slightly less for bitches; preferred 18 to 19½ for dogs, 17½ to 19 for bitches; dogs 33 to 40 pounds", "coat": "Soft, dense, and wavy; harsh, wire, or bristle coat severely penalized", "color": "Blue-gray from deep slate to light blue gray; small white markings allowed; black on muzzle, head, ears, tail, feet permitted; black dog 18 months or older disqualified"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Terrier_Group.pdf"}, "Komondor": {"name": "Komondor", "group": "Working Group", "height": "25.5 to 27.5 in", "weight": "80 to 100 lb", "weight_note": null, "description": "Our Hungarian-language tip of the day: The plural of Komondor is Komondorok. Now, let’s take a look at the dog. What we see is a large and powerful guardian covered in profuse white cords. A big male can stand more than 27.5 inches and weigh over 100 pounds, with heavy bone, a deep chest, and lots of muscle. Despite their brawn Komondorok are agile and light-footed, and move with long strides. With their unique look, it’s impossible to mistake Koms for anything else. A powerfully large Hungarian flock guardian covered in profuse white cords from head to tail, the Komondor is among the world’s most recognizable breeds. The independent and protective Kom requires a firm, experienced hand at training.", "temperament": "Loyal, Dignified, Brave", "grooming": "Specialty/Professional", "shedding": "Seasonal", "energy": "Regular Exercise", "life_expectancy": "10 to 12 years", "size_category": "Large", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/komondor/", "official_standard": {"size": "Dogs 27½ inches and up; bitches 25½ inches and up at withers; dogs about 100 pounds and up, bitches about 80 pounds and up", "coat": "Heavy coat of white cords forming naturally; dense woolly undercoat with coarser outer coat", "color": "White; small cream or buff shading allowed only in puppies"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Working_Group.pdf"}, "Kuvasz": {"name": "Kuvasz", "group": "Working Group", "height": "26 to 30 in", "weight": "70 to 115 lb", "weight_note": null, "description": "Imposing, impressive, majestic, massive, mighty—pick the adjective you like best, they all apply to the Kuvasz (pronounced KOO-vahz; the plural is Kuvaszok, pronounced KOO-vah-sock). This snow-white livestock guardian of luxuriant coat can stand as high as 30 inches at the shoulder, and weigh between 70 and 110 pounds. Despite their size and strength, Kuvs are quick-moving, nimble-footed protectors when meeting a threat. The breed’s fans say that the elegantly proportioned head “is considered to be the most beautiful part of the Kuvasz.” The snow-white Kuvasz is Hungary's majestic guardian of flocks and companion of kings. A working dog of impressive size and strength, the imposing and thickly coated Kuvasz is a beautiful, smart, profoundly loyal, but challenging breed.", "temperament": "Loyal, Fearless, Sweet", "grooming": "Weekly Brushing", "shedding": "Regularly", "energy": "Regular Exercise", "life_expectancy": "10 to 12 years", "size_category": "Large", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/kuvasz/", "official_standard": {"size": "Dogs 28 to 30 inches; bitches 26 to 28 inches at withers; dogs about 100 to 115 pounds, bitches about 70 to 90 pounds", "coat": "Double coat of guard hair and fine undercoat; medium coarse; quite wavy to straight", "color": "White with no markings"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Working_Group.pdf"}, "Labrador Retriever": {"name": "Labrador Retriever", "group": "Sporting Group", "height": "21.5 to 24.5 in", "weight": "55 to 80 lb", "weight_note": null, "description": "The sturdy, well-balanced Labrador Retriever can, depending on the sex, stand from 21.5 to 24.5 inches at the shoulder and weigh between 55 to 80 pounds. The dense, hard coat comes in yellow, black, and a luscious chocolate. The head is wide, the eyes glimmer with kindliness, and the thick, tapering “otter tail” seems to be forever signaling the breed’s innate eagerness.Labs are famously friendly. They are companionable housemates who bond with the whole family, and they socialize well with neighbor dogs and humans alike. But don’t mistake his easygoing personality for low energy: The Lab is an enthusiastic athlete that requires lots of exercise, like swimming and marathon games of fetch, to keep physically and mentally fit. The sweet-faced, lovable Labrador Retriever is America’s most popular dog breed. Labs are friendly, outgoing, and high-spirited companions who have more than enough affection to go around for a family looking for a medium-to-large dog.", "temperament": "Friendly, Active, Outgoing", "grooming": "Weekly Brushing", "shedding": "Regularly", "energy": "Needs Lots of Activity", "life_expectancy": "10 to 12 years", "size_category": "Large", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/labrador-retriever/", "official_standard": {"size": "Dogs 22½ to 24½ in, bitches 21½ to 23½ in at withers; dogs 65 to 80 lb, bitches 55 to 70 lb", "coat": "Short, straight, very dense, fairly hard to the hand, with soft weather-resistant undercoat; slight wave down back permissible", "color": "Black, yellow, or chocolate only; small white chest spot permissible but not desirable; other colors or combinations disqualify"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Sporting_Group.pdf"}, "Lakeland Terrier": {"name": "Lakeland Terrier", "group": "Terrier Group", "height": "14 to 15 in", "weight": "about 17 lb (AKC lists one figure)", "weight_note": null, "description": "Square and sturdy Lakelands, standing less than 15 inches at the shoulder and weighing about 17 pounds, are small dogs. But don’t tell them that. With their cock-of-the-walk swagger, Lakelands personify the old dog-lover’s cliché “a big dog in a small package.” They come in several colors; some have a sporty saddle mark on the back.With folded V-shaped ears, straight front, rectangular head, and a mischievous twinkle in their eye, Lakelands are the blueprint of a long-legged British terrier. A bold, zesty “big dog in a small package,” the Lakeland Terrier, named for the Lake District of his native England, was once a farmer’s dog bred to work in packs on sheep-stealing foxes. The Lakeland's coat is hard, wiry, and low-shedding.", "temperament": "Friendly, Confident, Bold", "grooming": "Weekly Brushing", "shedding": "Infrequent", "energy": "Regular Exercise", "life_expectancy": "12 to 15 years", "size_category": "Small", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/lakeland-terrier/", "official_standard": {"size": "Ideal height 14½ inches at withers, up to one-half inch deviation; bitches up to one inch less; mature male about 17 pounds in show condition", "coat": "Dense, wiry coat with longer furnishings on muzzle and legs", "color": "Red, wheaten, blue, black, liver; saddle-marked dogs with grizzle or colored saddles"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Terrier_Group.pdf"}, "Leonberger": {"name": "Leonberger", "group": "Working Group", "height": "25.5 to 31.5 in", "weight": "90 to 170 lb", "weight_note": null, "description": "A huge and powerful dog, yes, but the Leonberger is also known for his aristocratic grace and elegance. A male can stand over 31 inches at the shoulder and weigh as much as a full-grown human. Females run smaller but are still a whole lot of dog. Breed hallmarks include a medium-long waterproof coat, lush triangular ears, a bushy tail, and a black facemask that frames kindly dark-brown eyes. A dramatic feature of the male’s coat is the lion-like mane around the neck and chest. A well-built Leo moves with an easy, elastic gait. A Leo is friendly but nobody’s fool. As watchdogs and all-around workers, they exhibit intelligence and sound judgment. Leos require lots of brushing, ample room for romping, and unlimited love. The Leonberger is a lush-coated giant of German origin. They have a gentle nature and serene patience and they relish the companionship of the whole family.", "temperament": "Friendly, Gentle, Playful", "grooming": "Daily Brushing", "shedding": "Regularly", "energy": "Regular Exercise", "life_expectancy": "9 to 9 years", "size_category": "Giant", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/leonberger/", "official_standard": {"size": "Males 28 to 31½ inches (30 preferred); females 25½ to 29½ inches (27½ preferred); weight proportionate to size", "coat": "Medium to long, water-resistant double coat; outer coat medium-soft to coarse, lying flat", "color": "Lion-yellow, golden to red, red-brown, sand, and combinations, always with black mask; small chest stripe or white patch tolerated"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Working_Group.pdf"}, "Lhasa Apso": {"name": "Lhasa Apso", "group": "Non-Sporting Group", "height": "10 to 11 in", "weight": "12 to 18 lb", "weight_note": null, "description": "Standing less than a foot high at the shoulder, Lhasas are small but hardy dogs of aristocratic bearing. They’re famous for a floor-length, flat-hanging coat, parted in the middle and draping each side of the body. A feathery tail curls over the back in the distinct manner of Tibetan breeds. The breed’s fans say the dark, oval-shaped eyes—peeping through lavish facial hair—are the windows of a Lhasa’s merry soul. The complete picture is unmistakably Asian: exotic, elegant, and serenely well balanced. The lavishly coated Lhasa Apso is a thousand-year-old breed who served as sentinels at palaces and monasteries isolated high in the Himalayas. Smart, confident, and complex, Lhasas are family comedians but regally aloof with strangers.", "temperament": "Confident, Smart, Comical", "grooming": "2-3 Times a Week Brushing", "shedding": "Infrequent", "energy": "Regular Exercise", "life_expectancy": "12 to 15 years", "size_category": "Small", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/lhasa-apso/", "official_standard": {"size": "Ideally between 10 and 11 inches at the shoulder; variable", "coat": "Heavy, dense, straight, hard double coat of good length, parted down the middle from head to tail; not woolly or silky", "color": "All colors equally acceptable"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Non-Sporting_Group.pdf"}, "Maltese": {"name": "Maltese", "group": "Toy Group", "height": "7 to 9 in", "weight": "about 7 lb (AKC lists one figure)", "weight_note": null, "description": "Maltese are affectionate toy dogs weighing less than seven pounds, covered by a long, straight, silky coat. Beneath the all-white mantle is a compact body moving with a smooth and effortless gait. The overall picture depicts free-flowing elegance and balance. The irresistible Maltese face—with its big, dark eyes and black gumdrop nose—can conquer the most jaded sensibility.Despite their aristocratic bearing, Maltese are hardy and adaptable pets. They make alert watchdogs who are fearless in a charming toy-dog way, and they are game little athletes on the agility course. Maltese are low-shedding, long-lived, and happy to make new friends of all ages. Sometimes stubborn and willful, they respond well to rewards-based training. The tiny Maltese, “Ye Ancient Dogge of Malta,” has been sitting in the lap of luxury since the Bible was a work in progress. Famous for their show-stopping, floor-length coat, Maltese are playful, charming, and adaptable toy companions.", "temperament": "Gentle, Playful, Charming", "grooming": "Daily Brushing", "shedding": "Infrequent", "energy": "Regular Exercise", "life_expectancy": "12 to 15 years", "size_category": "Toy", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/maltese/", "official_standard": {"size": "Weight under 7 pounds, with 4 to 6 pounds preferred", "coat": "Single coat, long, flat, silky, hanging almost to ground; kinkiness, curliness, or woolly texture objectionable", "color": "Pure white; light tan or lemon on ears permissible but not desirable"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Toy_Group.pdf"}, "Mastiff": {"name": "Mastiff", "group": "Working Group", "height": "27.5 to 30 in", "weight": "120 to 230 lb", "weight_note": null, "description": "For the uninitiated, a face-to-face encounter with these black-masked giants can be startling. A male stands at least 30 inches at the shoulder and can outweigh many a full-grown man. The rectangular body is deep and thickly muscled, covered by a short double coat of fawn, apricot, or brindle stripes. The head is broad and massive, and a wrinkled forehead accentuates an alert, kindly expression. Mastiffs are patient, lovable companions and guardians who take best to gentle training. Eternally loyal Mastiffs are protective of family, and a natural wariness of strangers makes early training and socialization essential. Mastiffs are magnificent pets, but acquiring a powerful giant-breed dog is commitment not to be taken lightly. The colossal Mastiff belongs to a canine clan as ancient as civilization itself. A massive, heavy-boned dog of courage and prodigious strength, the Mastiff is docile and dignified but also a formidable protector of those they hold dear.", "temperament": "Courageous, Dignified, Good-Natured", "grooming": "Occasional Bath/Brush", "shedding": "Occasional", "energy": "Regular Exercise", "life_expectancy": "6 to 10 years", "size_category": "Giant", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/mastiff/", "official_standard": {"size": "Dogs minimum 30
