 inches at shoulder; bitches minimum 27½ inches", "coat": "Outer coat straight, coarse, moderately short; undercoat dense, short, close lying", "color": "Fawn, apricot, or brindle; dark muzzle, ears, and nose; small white chest patch permitted"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Working_Group.pdf"}, "Miniature Pinscher": {"name": "Miniature Pinscher", "group": "Toy Group", "height": "10 to 12.5 in", "weight": "8 to 10 lb", "weight_note": null, "description": "Min Pins are sturdy, compact dogs standing no more than 12.5 inches at the shoulder. The smooth, shiny coat comes in two shades of solid red, or chocolate-and-rust or black-and-rust. The dark, slightly oval eyes and high-set ears help bring out a self-possessed, “big dog” personality. A distinguishing characteristic is the Min Pin’s high-stepping “hackney” gait, reminiscent of a hackney horse at the trot. The leggy Miniature Pinscher is known to fans as the “King of Toys.” This proud, fearless, fun-loving toy breed of lustrous coat and a compact, wedge-shaped physique is a true personality dog, known for a high-stepping “hackney” gait.", "temperament": "Fearless, Fun-Loving, Proud", "grooming": "Occasional Bath/Brush", "shedding": "Infrequent", "energy": "Regular Exercise", "life_expectancy": "12 to 16 years", "size_category": "Toy", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/miniature-pinscher/", "official_standard": {"size": "Height 10 to 12½ inches allowed, desired 11 to 11½ inches; under 10 or over 12½ inches disqualified", "coat": "Smooth, hard, short, straight, lustrous coat closely covering the body", "color": "Solid clear red, stag red, black or chocolate with rust-red markings; white over ½ inch disqualified"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Toy_Group.pdf"}, "Miniature Schnauzer": {"name": "Miniature Schnauzer", "group": "Terrier Group", "height": "12 to 14 in", "weight": "11 to 20 lb", "weight_note": null, "description": "Stocky, robust little dogs standing 12 to 14 inches, Miniature Schnauzers were bred down from their larger cousins, Standard Schnauzers. The bushy beard and eyebrows give Minis a charming, human-like expression. The hard, wiry coat comes in three color patterns: salt and pepper, black and silver, and solid black. Created to be all-around farm dogs and ratters, they are tough, muscular, and fearless without being aggressive.The Miniature Schnauzer is a bright, friendly, trainable companion, small enough to adapt to apartment life but tireless enough to patrol acres of farmland. They get along well with other animals and kids. Minis are sturdy little guys and enjoy vigorous play. Home and family oriented, they make great watchdogs. The Miniature Schnauzer, the smallest of the three Schnauzer breeds, is a generally healthy, long-lived, and low-shedding companion. Add an outgoing personality, a portable size, and sporty good looks, and you’ve got an ideal family dog.", "temperament": "Friendly, Smart, Obedient", "grooming": "Specialty/Professional", "shedding": "Infrequent", "energy": "Regular Exercise", "life_expectancy": "12 to 15 years", "size_category": "Small", "varieties": "Giant, Standard and Miniature Schnauzers are three separate AKC breeds.", "akc_url": "https://www.akc.org/dog-breeds/miniature-schnauzer/", "official_standard": {"size": "Height 12 to 14 inches; under 12 or over 14 inches disqualified", "coat": "Double coat with hard, wiry outer coat and close undercoat; body coat plucked; furnishings fairly thick, not silky", "color": "Salt and pepper, black and silver, or solid black; solid black nose; no white patches except small chest spot on black"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Terrier_Group.pdf"}, "Newfoundland": {"name": "Newfoundland", "group": "Working Group", "height": "26 to 28 in", "weight": "100 to 150 lb", "weight_note": null, "description": "A male Newfoundland can weigh up to 150 pounds and stand 28 inches at the shoulder; females typically go 100 to 120 pounds. The Newf head is majestic, the expression soft and soulful. The outer coat is flat and coarse. Colors are gray, brown, black, and a black-and-white coat named for artist Sir Edwin Landseer, who popularized the look in his paintings.The Newfie breed standard says that a sweet temperament is the “most important single characteristic of the breed.” The Newf’s sterling character is expressed in their affinity for kids. Trusting and trainable, Newfs respond well to gentle guidance. These noble giants are among the world’s biggest dogs, and acquiring a pet that could outweigh you comes with obvious challenges. The massive Newfoundland is a strikingly large, powerful working dog of heavy bone and dignified bearing. The sweet-tempered Newfie is a famously good companion and has earned a reputation as a patient and watchful “nanny dog” for kids.", "temperament": "Sweet, Patient, Devoted", "grooming": "Weekly Brushing", "shedding": "Seasonal", "energy": "Regular Exercise", "life_expectancy": "9 to 10 years", "size_category": "Giant", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/newfoundland/", "official_standard": {"size": "Adult dogs average 28 inches, bitches 26 inches; dogs 130 to 150 pounds, bitches 100 to 120 pounds", "coat": "Flat, water-resistant double coat; coarse, moderately long outer coat, straight or wavy", "color": "Black, brown, gray, white and black; solid colors may have white on chin, chest, toes, tail tip; Landseer is white with black markings"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Working_Group.pdf"}, "Norfolk Terrier": {"name": "Norfolk Terrier", "group": "Terrier Group", "height": "9 to 10 in", "weight": "11 to 12 lb", "weight_note": null, "description": "Norfolk Terriers are among the smallest working terriers, standing no higher than 10 inches at the shoulder. The coat is hard, wiry, and straight. They share many traits with their close cousins, Norwich Terriers. To tell them apart, look at the ears: The Norwich has erect, pointed ears; Norfolk ears are neatly folded over.Bred to work in packs, Norfolks are more gregarious than a typical terrier, but they have plenty of the old terrier pep. Few Norfolks these days earn their living hunting rodents, but a good one will fearlessly do so when given a chance. Norfolks bond closely, sometimes jealously, with their owners and make nice watchdogs. They have a reputation as a good traveler: portable, adaptable, and up for anything. Norfolk Terriers are little, cute, and loyal, and they will gladly curl up in your lap, but don’t dare call them lapdogs. Norfolks, despite their toyish qualities, are genuine terriers—feisty, confident, sturdy, and game for adventure.", "temperament": "Fearless, Alert, Fun-Loving", "grooming": "Weekly Brushing", "shedding": "Seasonal", "energy": "Regular Exercise", "life_expectancy": "12 to 16 years", "size_category": "Small", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/norfolk-terrier/", "official_standard": {"size": "Height 9 to 10 inches at withers; weight 11 to 12 pounds", "coat": "Hard, wiry, straight protective coat about 1½ to 2 inches long with definite undercoat; longer mane on neck and shoulders", "color": "All shades of red, wheaten, black and tan, or grizzle; dark points permitted; white marks not desirable"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Terrier_Group.pdf"}, "Norwegian Elkhound": {"name": "Norwegian Elkhound", "group": "Hound Group", "height": "19.5 to 20.5 in", "weight": "48 to 55 lb", "weight_note": null, "description": "Norwegian Elkhounds are hardy, short-bodied dogs standing about 20 inches at the shoulder. They have a dense silver-gray coat and a tail curling tightly over the back. The deep chest, sturdy legs, and muscular thighs belong to a dog built for an honest day’s work. The eyes are a dark brown and the ears mobile and erect. Overall, an Elkhound is the picture of an alert and steadfast dog of the north.Elkhounds are famously fine companions and intelligent watchdogs. Agility and herding trials are good outlets for their natural athleticism and eagerness. Reserved until introductions are made, an Elkhound is a trustworthy friend ever after. These strong, confident dogs are truly sensitive souls, with a dash of houndy independence. The Norwegian Elkhound is a robust spitz type known for his lush silver-gray coat and dignified but friendly demeanor. The durable Elkhound is among Europe's oldest dogs. They sailed with the Vikings and figure in Norse art and legend.", "temperament": "Friendly, Confident, Dependable", "grooming": "Weekly Brushing", "shedding": "Seasonal", "energy": "Regular Exercise", "life_expectancy": "12 to 15 years", "size_category": "Medium", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/norwegian-elkhound/", "official_standard": {"size": "Dogs 20½ inches and about 55 pounds; bitches 19½ inches and about 48 pounds", "coat": "Thick, hard, weather-resisting, smooth-lying double coat with woolly undercoat", "color": "Gray preferred; silver undercoat; black muzzle, ears, tail tip; other overall colors disqualify"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Hound_Group.pdf"}, "Norwich Terrier": {"name": "Norwich Terrier", "group": "Terrier Group", "height": "10 in", "weight": "about 12 lb (AKC lists one figure)", "weight_note": null, "description": "Standing no more than 10 inches at the shoulder and weighing about 12 pounds, Norwich are among the smallest working terriers. Beneath the hard, wiry coat is a stocky, substantial dog. Norwiches are toy-sized but are not satin-pillow dogs—they were originally bred as tough and fearless ratters. They are distinguished from their doggy doppelganger, the Norfolk Terrier, by their erect, pointed ears.Happy-go-lucky, fearless, and sometimes even bossy, Norwiches are energetic enough to play fetch all day, but affectionate enough to enjoy hours of lap time with their favorite human. Short, positive training sessions work best with this clever but sometimes stubborn breed. Three words convey the overall dog: cute, cuter, and cutest. Norwich Terriers are plucky little earthdogs named for their hometown in England. The old cliché “a big dog in a small package” was coined for breeds like the Norwich, who can be oblivious to the fact that they are just 10 inches tall.", "temperament": "Affectionate, Alert, Curious", "grooming": "Weekly Brushing", "shedding": "Seasonal", "energy": "Energetic", "life_expectancy": "12 to 15 years", "size_category": "Small", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/norwich-terrier/", "official_standard": {"size": "Height not exceeding 10 inches at withers; weight approximately 12 pounds", "coat": "Hard, wiry, straight, close-lying coat with definite undercoat; protective mane on neck and shoulders; short smooth head hair", "color": "All shades of red, wheaten, black and tan, or grizzle; white marks not desirable"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Terrier_Group.pdf"}, "Old English Sheepdog": {"name": "Old English Sheepdog", "group": "Herding Group", "height": "21 to 22 in", "weight": "60 to 100 lb", "weight_note": null, "description": "Beneath the Old English Sheepdog’s profuse double coat is a muscular and compact drover, with plenty of bone and a big rump, standing 21 or 22 inches at the shoulder. Their eyes (when you can see them) are dark brown, or blue, or one of each. The OES breed standard says the skull is “capacious and rather squarely formed, giving plenty of room for brain power.”OES move with a bear-like shuffle but are famous for their nimbleness afoot. Regular exercise is required for these strong, able-bodied workers. Equally famed are their many fine housedog qualities: watchfulness, courage, kindliness, and intelligence. Great with children, OES make patient, protective playmates. They are sensible watchdogs known for a loud, ringing bark. The Old English Sheepdog is the archetypical shaggy dog, famous for his profuse coat and peak-a-boo hairdo, a distinctive bear-like gait, and a mellow, agreeable nature. The OES is a big, agile dog who enjoys exploring and a good romp.", "temperament": "Adaptable, Gentle, Smart", "grooming": "2-3 Times a Week Brushing", "shedding": "Seasonal", "energy": "Regular Exercise", "life_expectancy": "10 to 12 years", "size_category": "Large", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/old-english-sheepdog/", "official_standard": {"size": "Dogs 22 inches and up; bitches 21 inches and up, measured at the withers", "coat": "Profuse but not excessive, good hard texture, shaggy and free from curl; waterproof undercoat", "color": "Any shade of gray, grizzle, blue, or blue merle, with or without white markings; brown or fawn is objectionable"}, "official_standard_url": "https://images.akc.org/pdf/judges/Herding_Group_7-16.pdf"}, "Otterhound": {"name": "Otterhound", "group": "Hound Group", "height": "24 to 27 in", "weight": "80 to 115 lb", "weight_note": null, "description": "These big, bouncy hounds were ideally suited for otter hunting. OHs are built to be expert swimmers, from the top of their rough, waterproof coat to the bottom of their big webbed feet. A broad chest and powerful shoulders allow them to swim all day without tiring. Their large black nose is amazingly sensitive and could follow an otter’s underwater scent trail over great distances. And the OH’s size and strength enabled them to take on a sharp-toothed, razor-clawed otter that might weigh 20 pounds. Big, boisterous, and affectionate, the Otterhound was bred in medieval England for the now-outlawed activity of otter hunting. This scarce breed is known for his dense shaggy coat, webbed feet, acute sense of smell, and affinity for swimming.", "temperament": "Even-Tempered, Amiable, Boisterous", "grooming": "Weekly Brushing", "shedding": "Seasonal", "energy": "Regular Exercise", "life_expectancy": "10 to 13 years", "size_category": "Large", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/otterhound/", "official_standard": {"size": "Males about 27 inches and 115 pounds; bitches about 24 inches and 80 pounds", "coat": "Dense, rough, coarse, crisp outer coat over water-resistant woolly undercoat", "color": "Any color or combination"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Hound_Group.pdf"}, "Papillon": {"name": "Papillon", "group": "Toy Group", "height": "8 to 11 in", "weight": "5 to 10 lb", "weight_note": null, "description": "A tiny dog, measuring 8 to 11 inches at the shoulder, you can still spot a Papillon a block away thanks to the large, wing-shaped ears that give the breed its name (“papillon” is French for “butterfly”). Some Paps have erect ears; in others, known as the Phalene type, the ears are down. Paps are dainty and elegant, with a plumed tail, and a long, silky coat of several color combinations, the base color being white. More robust than they look, Paps are little dogs for all seasons and reasons. They thrive in warm or cool climates, in town or country, and are eager to join family fun. They are excellent agility dogs and are consistent winners at the sport’s highest levels; less ambitious owners can train them to do all kinds of tricks. The quick, curious Papillon is a toy dog of singular beauty and upbeat athleticism. Despite his refined appearance, the Pap is truly a “doggy dog” blessed with a hardy constitution. Papillon fanciers describe their breed as happy, alert, and friendly.", "temperament": "Friendly, Alert, Happy", "grooming": "Weekly Brushing", "shedding": "Seasonal", "energy": "Regular Exercise", "life_expectancy": "14 to 16 years", "size_category": "Toy", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/papillon/", "official_standard": {"size": "Height at withers 8 to 11 inches; over 11 inches a fault; over 12 inches disqualified", "coat": "Abundant, long, fine, silky, flowing coat with no undercoat; profuse chest frill; long plume tail", "color": "Always parti-color or white with patches of any color; all-white or no-white dog is disqualified"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Toy_Group.pdf"}, "Pekingese": {"name": "Pekingese", "group": "Toy Group", "height": "6 to 9 in", "weight": "about 14 lb (AKC lists one figure)", "weight_note": null, "description": "Pekingese are compact, stocky toy dogs weighing up to 14 pounds. The coat is longest at the neck and shoulders, giving Pekes their famous “lion’s mane.” Coats come in various reds, from a golden-red to darker shades. The large, short-muzzled head is a wider-than-long “envelope shaped” rectangle, and the eyes are large, dark, and sparkly. A unique feature of Pekes is their effortless “rolling” gait.Pekes are charming, confident companions who develop a tight bond with their favorite human. Bred to live in palaces, they can be as serenely independent as the emperors who owned them. (They’re “opinionated,” Peke people say.) Ever alert, they make good watchdogs. Pekes will tolerate kids but won’t stand for a lot of roughhousing. The Pekingese, a compact toy companion of regal bearing and a distinctive rolling gait, is one of several breeds created for the ruling classes of ancient China. These are sophisticated dogs of undying loyalty and many subtle delights.", "temperament": "Affectionate, Loyal, Regal in Manner", "grooming": "2-3 Times a Week Brushing", "shedding": "Seasonal", "energy": "Calm", "life_expectancy": "12 to 14 years", "size_category": "Small", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/pekingese/", "official_standard": {"size": "Weight over 14 pounds disqualified", "coat": "Long, coarse-textured, straight, stand-off outer coat with thick, soft undercoat; mane on neck and shoulders", "color": "All coat colors and markings of equal merit; black mask or self-colored face equally acceptable"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Toy_Group.pdf"}, "Pembroke Welsh Corgi": {"name": "Pembroke Welsh Corgi", "group": "Herding Group", "height": "10 to 12 in", "weight": "28 to 30 lb", "weight_note": null, "description": "At 10 to 12 inches at the shoulder and 27 to 30 pounds, a well-built male Pembroke presents a big dog in a small package. Short but powerful legs, muscular thighs, and a deep chest equip him for a hard day’s work. Built long and low, Pembrokes are surprisingly quick and agile. They can be red, sable, fawn, and black and tan, with or without white markings.The Pembroke is a bright, sensitive dog who enjoys play with his human family and responds well to training. As herders bred to move cattle, they are fearless and independent. They are vigilant watchdogs, with acute senses and a “big dog” bark. Families who can meet their bold but kindly Pembroke’s need for activity and togetherness will never have a more loyal, loving pet. Among the most agreeable of all small housedogs, the Pembroke Welsh Corgi is a strong, athletic, and lively little herder who is affectionate and companionable without being needy. They are one of the world's most popular herding breeds.", "temperament": "Affectionate, Smart, Alert", "grooming": "Weekly Brushing", "shedding": "Regularly", "energy": "Energetic", "life_expectancy": "12 to 13 years", "size_category": "Medium", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/pembroke-welsh-corgi/", "official_standard": {"size": "10 to 12 inches in height; dogs not over 30 pounds, bitches not over 28 pounds", "coat": "Medium length; short, thick, weather-resistant undercoat under a coarser, longer outer coat, preferably straight", "color": "Self colors of red, sable, fawn, or black and tan, with or without white markings"}, "official_standard_url": "https://images.akc.org/pdf/judges/Herding_Group_7-16.pdf"}, "Pointer": {"name": "Pointer", "group": "Sporting Group", "height": "23 to 28 in", "weight": "45 to 75 lb", "weight_note": null, "description": "The noble Pointer is the ultimate expression of canine power and grace. Unquestioned aristocrats of the sporting world, Pointers carry themselves proudly and are capable of great speed and agility. The coat comes in several colors, solid or in patterns—but as the breed’s devotees like to say, a good Pointer can’t be a bad color. A large male can stand 28 inches at the shoulder and weigh up to 75 pounds; a small female might weigh as little as 45 pounds and stand 23 inches. The Pointer is the ultimate expression of canine power and grace. The breed’s name is its job description: Pointers point game birds, and they have been pointing for centuries. The high-energy Pointer is an excellent runner’s companion.", "temperament": "Loyal, Hardworking, Even-Tempered", "grooming": "Weekly Brushing", "shedding": "Occasional", "energy": "Energetic", "life_expectancy": "12 to 17 years", "size_category": "Large", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/pointer/", "official_standard": {"size": "Dogs 25 to 28 inches, 55 to 75 pounds; bitches 23 to 26 inches, 44 to 65 pounds", "coat": "Short, dense, smooth, with a sheen", "color": "Liver, lemon, black, or orange, alone or with white"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Sporting_Group.pdf"}, "Pomeranian": {"name": "Pomeranian", "group": "Toy Group", "height": "6 to 7 in", "weight": "3 to 7 lb", "weight_note": null, "description": "The Pomeranian combines a tiny body (no more than seven pounds) and a commanding big-dog demeanor. The abundant double coat, with its frill extending over the chest and shoulders, comes in almost two dozen colors, and various patterns and markings, but is most commonly seen in orange or red.Alert and intelligent, Pomeranians are easily trained and make fine watchdogs and perky pets for families with children old enough to know the difference between a toy dog and a toy. Poms are active but can be exercised with indoor play and short walks, so they are content in both the city and suburbs. They will master tricks and games with ease, though their favorite activity is providing laughs and companionship to their special human. The tiny Pomeranian, long a favorite of royals and commoners alike, has been called the ideal companion. The glorious coat, smiling, foxy face, and vivacious personality have helped make the Pom one of the world's most popular toy breeds.", "temperament": "Inquisitive, Bold, Lively", "grooming": "2-3 Times a Week Brushing", "shedding": "Seasonal", "energy": "Regular Exercise", "life_expectancy": "12 to 16 years", "size_category": "Toy", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/pomeranian/", "official_standard": {"size": "Weight 3 to 7 pounds, ideal show weight 4 to 6 pounds", "coat": "Double coat: short, dense undercoat with profuse, harsh, longer outer coat; heavily plumed tail", "color": "All colors, patterns, and variations judged equally"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Toy_Group.pdf"}, "Poodle (Miniature)": {"name": "Poodle (Miniature)", "group": "Non-Sporting Group", "height": "Over 10 in, up to 15 in", "weight": "10 to 15 lb", "weight_note": null, "description": "Poodles come in three size varieties: Standards should be more than 15 inches tall at the shoulder; Miniatures are 15 inches or under; Toys stand no more than 10 inches. All three varieties have the same build and proportions. At dog shows, Poodles are usually seen in the elaborate Continental Clip. Most pet owners prefer the simpler Sporting Clip, in which the coat is shorn to follow the outline of the squarely built, smoothly muscled body.Forget those old stereotypes of Poodles as sissy dogs. Poodles are eager, athletic, and wickedly smart “real dogs” of remarkable versatility. The Standard, with his greater size and strength, is the best all-around athlete of the family, but all Poodles can be trained with great success. Whether Standard, Miniature, or Toy, and either black, white, or apricot, the Poodle stands proudly among dogdom’s true aristocrats. Beneath the curly, low-allergen coat is an elegant athlete and companion for all reasons and seasons.", "temperament": "Active, Proud, Very Smart", "grooming": null, "shedding": null, "energy": null, "life_expectancy": "10 to 18 years", "size_category": "Small", "varieties": "Toy, Miniature and Standard are the three AKC Poodle varieties, separated by height at the shoulder.", "akc_url": "https://www.akc.org/dog-breeds/poodle-miniature/", "official_standard": {"size": "Standard over 15 in; Miniature over 10 to 15 in; Toy 10 in or under at shoulder", "coat": "Curly (harsh, dense) or corded; shown in approved clips only", "color": "Solid even color at skin; parti-colored disqualified"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Non-Sporting_Group.pdf"}, "Poodle (Standard)": {"name": "Poodle (Standard)", "group": "Non-Sporting Group", "height": "Over 15 in", "weight": "40 to 70 lb", "weight_note": null, "description": "Poodles come in three size varieties: Standards should be more than 15 inches tall at the shoulder; Miniatures are 15 inches or under; Toys stand no more than 10 inches. All three varieties have the same build and proportions. At dog shows, Poodles are usually seen in the elaborate Continental Clip. Most pet owners prefer the simpler Sporting Clip, in which the coat is shorn to follow the outline of the squarely built, smoothly muscled body.Forget those old stereotypes of Poodles as sissy dogs. Poodles are eager, athletic, and wickedly smart “real dogs” of remarkable versatility. The Standard, with his greater size and strength, is the best all-around athlete of the family, but all Poodles can be trained with great success. Whether Standard, Miniature, or Toy, and either black, white, or apricot, the Poodle stands proudly among dogdom’s true aristocrats. Beneath the curly, low-allergen coat is an elegant athlete and companion for all reasons and seasons.", "temperament": "Active, Proud, Very Smart", "grooming": "Specialty/Professional", "shedding": "Infrequent", "energy": "Regular Exercise", "life_expectancy": "10 to 18 years", "size_category": "Large", "varieties": "Toy, Miniature and Standard are the three AKC Poodle varieties, separated by height at the shoulder.", "akc_url": "https://www.akc.org/dog-breeds/poodle-standard/", "official_standard": {"size": "Standard over 15 in; Miniature over 10 to 15 in; Toy 10 in or under at shoulder", "coat": "Curly (harsh, dense) or corded; shown in approved clips only", "color": "Solid even color at skin; parti-colored disqualified"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Non-Sporting_Group.pdf"}, "Poodle (Toy)": {"name": "Poodle (Toy)", "group": "Toy Group", "height": "10 in or under", "weight": "4 to 6 lb", "weight_note": null, "description": "Poodles come in three size varieties: Standards should be more than 15 inches tall at the shoulder; Miniatures are 15 inches or under; Toys stand no more than 10 inches. All three varieties have the same build and proportions. At dog shows, Poodles are usually seen in the elaborate Continental Clip. Most pet owners prefer the simpler Sporting Clip, in which the coat is shorn to follow the outline of the squarely built, smoothly muscled body.Forget those old stereotypes of Poodles as sissy dogs. Poodles are eager, athletic, and wickedly smart “real dogs” of remarkable versatility. With an abundance of steady character and intelligence, the Toy Poodle is a “person” and expects to be treated like one. Despite his diminutive size, the Toy Poodle stands proudly among dogdom’s true aristocrats. Beneath the curly, low-allergen coat is an elegant athlete and companion for all reasons and seasons.", "temperament": "Agile, Intelligent, Self-Confident", "grooming": "Specialty/Professional", "shedding": "Infrequent", "energy": "Regular Exercise", "life_expectancy": "10 to 18 years", "size_category": "Toy", "varieties": "Toy, Miniature and Standard are the three AKC Poodle varieties, separated by height at the shoulder.", "akc_url": "https://www.akc.org/dog-breeds/poodle-toy/", "official_standard": {"size": "Standard over 15 in; Miniature over 10 to 15 in; Toy 10 in or under at shoulder", "coat": "Curly (harsh, dense) or corded; shown in approved clips only", "color": "Solid even color at skin; parti-colored disqualified"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Non-Sporting_Group.pdf"}, "Portuguese Water Dog": {"name": "Portuguese Water Dog", "group": "Working Group", "height": "17 to 23 in", "weight": "35 to 60 lb", "weight_note": null, "description": "The Portuguese Water Dog is super-smart and very biddable—meaning he’s easy to train and eager to please. The breed can be groomed in two styles: The retriever clip (the entire coat is clipped to one inch in length, with the tail tip at full length) or the more check-me-out lion clip, where the coat on the hindquarters and muzzle is clipped down to the skin. The bright and biddable Portuguese Water Dog was bred to be an all-around fisherman’s helper. The robust, medium-sized body is covered by a coat of tight, low-shedding curls. They are eager and athletic companions built for water work.", "temperament": "Affectionate, Adventurous, Athletic", "grooming": "Daily Brushing", "shedding": "Seasonal", "energy": "Energetic", "life_expectancy": "11 to 13 years", "size_category": "Medium", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/portuguese-water-dog/", "official_standard": {"size": "Males 20 to 23 inches (ideal 22); females 17 to 21 inches (ideal 19); males 42 to 60 pounds, females 35 to 50 pounds", "coat": "Profuse, thickly planted coat, either curly with compact cylindrical curls or wavy with gentle waves and slight sheen", "color": "Black, white, various brown tones, and black or brown combined with white"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Working_Group.pdf"}, "Pug": {"name": "Pug", "group": "Toy Group", "height": "10 to 13 in", "weight": "14 to 18 lb", "weight_note": null, "description": "The Pug’s motto is the Latin phrase “multum in parvo” (a lot in a little)—an apt description of this small but muscular breed. They come in three colors: silver or apricot-fawn with a black face mask, or all black. The large round head, the big, sparkling eyes, and the wrinkled brow give Pugs a range of human-like expressions—surprise, happiness, curiosity—that have delighted owners for centuries.Pug owners say their breed is the ideal house dog. Pugs are happy in the city or country, with kids or old folks, as an only pet or in a pack. They enjoy their food, and care must be taken to keep them trim. They do best in moderate climates—not too hot, not too cold—but, with proper care, Pugs can be their adorable selves anywhere. Once the mischievous companion of Chinese emperors, and later the mascot of Holland’s royal House of Orange, the small but solid Pug is today adored by his millions of fans around the world. Pugs live to love and to be loved in return.", "temperament": "Charming, Mischievous, Loving", "grooming": "Weekly Brushing", "shedding": "Regularly", "energy": "Regular Exercise", "life_expectancy": "13 to 15 years", "size_category": "Small", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/pug/", "official_standard": {"size": "Weight 14 to 18 pounds desirable (dog or bitch)", "coat": "Fine, smooth, soft, short and glossy coat, neither hard nor woolly", "color": "Fawn or black; clearly defined black mask, ears, cheek moles, forehead thumb mark or diamond, and back trace; any other color disqualifies"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Toy_Group.pdf"}, "Redbone Coonhound": {"name": "Redbone Coonhound", "group": "Hound Group", "height": "21 to 27 in", "weight": "45 to 70 lb", "weight_note": null, "description": "Redbones are medium-to-large hound dogs whose muscles undulate beneath a sleek and stunning red coat. The overall impression is that a master sculptor carved them from blocks of the finest mahogany. The classically houndy head is flanked by ears long enough to reach the nose. Dreamy brown eyes give the face an expression described by the breed’s devotees as “pleading.”Bred to work on all kinds of punishing terrain, Redbones are fast and surefooted and move with a proud, determined gait. The streamlined Redbone Coonhound, an American original, is even-tempered, mellow, and kindly at home but a tiger on the trail. Vigorous activities like hunting and swimming between long periods of rest is the rhythm of coonhound life.", "temperament": "Even-Tempered, Amiable, Eager to Please", "grooming": "Weekly Brushing", "shedding": "Seasonal", "energy": "Regular Exercise", "life_expectancy": "12 to 15 years", "size_category": "Large", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/redbone-coonhound/", "official_standard": {"size": "Males 22 to 27 inches; females 21 to 26 inches", "coat": "Short, smooth, coarse enough to provide protection", "color": "Solid red preferred; dark muzzle and small white on brisket and feet permissible"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Hound_Group.pdf"}, "Rhodesian Ridgeback": {"name": "Rhodesian Ridgeback", "group": "Hound Group", "height": "24 to 27 in", "weight": "70 to 85 lb", "weight_note": null, "description": "Beneath the Ridgeback’s trademark ridge is a whole lot of hound: Ridgebacks are fast and powerful athletes who can weigh between 70 and 85 pounds, and oftentimes more. They come in only one color – wheaten – which spans every shade seen in a wheat field, from pale flaxen to the burnished red of a maturing crop. Ridgebacks also have two nose colors: black and the less commonly seen brown.The formidable Ridgeback can be strong willed, independent, and sometimes domineering. Ridgebacks must be guided with a firm but fair hand from puppyhood. They are faithful friends, protective of their loved ones and meltingly affectionate with those whom they trust. Still, a Ridgeback can be too much hound for the novice dog owner. The Rhodesian Ridgeback is an all-purpose “Renaissance hound” whose hallmark is the ridge, or stripe of backward-growing hair, on his back. Though the breed was made famous in its native Africa for its skill at tracking and baying – but never, ever killing – lions, today Ridgebacks are cherished family dogs whose owners must be prepared to deal with their independence and strong prey drive.", "temperament": "Affectionate, Dignified, Even-Tempered", "grooming": "Weekly Brushing", "shedding": "Seasonal", "energy": "Regular Exercise", "life_expectancy": "10 to 10 years", "size_category": "Large", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/rhodesian-ridgeback/", "official_standard": {"size": "Dogs 25 to 27 inches, desirable 85 pounds; bitches 24 to 26 inches, desirable 70 pounds", "coat": "Short, dense, sleek, glossy; never woolly or silky", "color": "Light to red wheaten; little white on chest and toes; solid black and black-and-tan disqualify"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Hound_Group.pdf"}, "Rottweiler": {"name": "Rottweiler", "group": "Working Group", "height": "22 to 27 in", "weight": "80 to 135 lb", "weight_note": null, "description": "A male Rottweiler will stand anywhere from 24 to 27 muscular inches at the shoulder; females run a bit smaller and lighter. The glistening, short black coat with smart rust markings add to the picture of imposing strength. A thickly muscled hindquarters powers the Rottie’s effortless trotting gait.A well-bred and properly raised Rottie will be calm and confident, courageous but not unduly aggressive. The aloof demeanor these world-class guardians present to outsiders belies the playfulness, and downright silliness, that endear Rotties to their loved ones. (No one told the Rottie he’s not a toy breed, so he is liable plop onto your lap for a cuddle.) Early training and socialization will harness a Rottie’s territorial instincts in a positive way. The Rottweiler is a robust working breed of great strength descended from the mastiffs of the Roman legions. A gentle playmate and protector within the family circle, the Rottie observes the outside world with a self-assured aloofness.", "temperament": "Loyal, Loving, Confident Guardian", "grooming": "Weekly Brushing", "shedding": "Seasonal", "energy": "Regular Exercise", "life_expectancy": "9 to 10 years", "size_category": "Giant", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/rottweiler/", "official_standard": {"size": "Dogs 24 to 27 inches; bitches 22 to 25 inches", "coat": "Straight, coarse, dense, medium-length outer coat lying flat; undercoat on neck and thighs; no trimming", "color": "Black with clearly defined rust to mahogany markings on eyes, cheeks, muzzle, throat, chest, legs, and under tail; other base colors disqualify"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Working_Group.pdf"}, "Saint Bernard": {"name": "Saint Bernard", "group": "Working Group", "height": "26 to 30 in", "weight": "120 to 180 lb", "weight_note": null, "description": "Not ranked particularly high in AKC registrations, this genial giant is nonetheless among the world’s most famous and beloved breeds. The Saint’s written standard abounds with phrases like “very powerful,” “extraordinarily muscular,” “imposing,” and “massive.” A male stands a minimum 27.5 inches at the shoulder; females will be smaller and more delicately built. The huge head features a wrinkled brow, a short muzzle, and dark eyes, combining to give Saints the intelligent, friendly expression that was such a welcome sight to stranded Alpine travelers. The Saint Bernard does not rank very high in AKC registrations, but the genial giant of the Swiss Alps is nonetheless among the world’s most famous and beloved breeds. Saints are famously watchful, patient, and careful with children.", "temperament": "Playful, Charming, Inquisitive", "grooming": "Weekly Brushing", "shedding": "Seasonal", "energy": "Regular Exercise", "life_expectancy": "8 to 10 years", "size_category": "Giant", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/saint-bernard/", "official_standard": {"size": "Males at least 27½ inches; females at least 25½ inches at shoulder", "coat": "Very dense, short, smooth, tough but not rough; slightly bushy thighs; bushy tail", "color": "White with red or red with white in various shades, or brindle patches with white; required white on chest, feet, tail tip, and noseband or collar"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Working_Group.pdf"}, "Saluki": {"name": "Saluki", "group": "Hound Group", "height": "23 to 28 in", "weight": "40 to 65 lb", "weight_note": null, "description": "The beauty of Salukis has been a thing of wonder for thousands of years. They’re slim and leggy, but very strong and perfectly balanced, like a great athlete or dancer. Males can stand between 23 and 28 inches at the shoulder; females can be much shorter. They come in a many colors and patterns. Their large, oval-shaped eyes are warm and intelligent.Salukis are highly adaptable, able to live and work in any climate. They’re magnificent animals, but owning them comes with many special challenges. Among the world’s oldest breeds, the slim but rugged Saluki was the hunting hound of kings for thousands of years. Salukis are swift and agile sprinters who love a good chase. They make gentle, dignified, and independent but loyal pets.", "temperament": "Gentle, Dignified, Independent-Minded", "grooming": "Occasional Bath/Brush", "shedding": "Occasional", "energy": "Energetic", "life_expectancy": "10 to 17 years", "size_category": "Medium", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/saluki/", "official_standard": {"size": "Dogs average 23 to 28 inches; bitches may be considerably smaller", "coat": "Smooth, soft, silky; slight feathering on legs and thighs", "color": "White, cream, fawn, golden, red, grizzle and tan, tricolor, black and tan"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Hound_Group.pdf"}, "Samoyed": {"name": "Samoyed", "group": "Working Group", "height": "19 to 23.5 in", "weight": "35 to 65 lb", "weight_note": null, "description": "Samoyeds, the smiling sledge dogs, were bred for hard work in the world’s coldest locales. In the Siberian town of Oymyakon, for instance, temperatures of minus-60 degrees are common. The Sammy’s famous white coat is thick enough to protect against such brutal conditions.Powerful, agile, tireless, impervious to cold—Sammies are drop-dead gorgeous but highly functional. Even their most delightful feature, a perpetual smile, has a practical function: The mouth’s upturned corners keep Sammies from drooling, preventing icicles from forming on the face.A Sammy sentenced to solitary confinement in the yard is a miserable—and destructive—creature. These are smart, social, mischievous dogs who demand love and attention. Sammies need a very firm but loving hand in training. As pack animals, they must learn early who the alpha dog is—and the alpha dog must be you. The Samoyed is a substantial but graceful dog standing anywhere from 19 to a bit over 23 inches at the shoulder. Powerful, tireless, with a thick all-white coat impervious to cold—Sammies are perfectly beautiful but highly functional. Even their most delightful feature, a perpetual smile, has a practical function: The upturned corners of the mouth keep Sammies from drooling, preventing icicles from forming on the face.", "temperament": "Adaptable, Friendly, Gentle", "grooming": "2-3 Times a Week Brushing", "shedding": "Seasonal", "energy": "Energetic", "life_expectancy": "12 to 14 years", "size_category": "Medium", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/samoyed/", "official_standard": {"size": "Males 21 to 23½ inches; females 19 to 21 inches at withers", "coat": "Double coat with soft, short, thick undercoat and straight, harsh, curl-free outer coat forming a ruff; silver sheen", "color": "Pure white, white and biscuit, cream, or all biscuit; any other color disqualifies"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Working_Group.pdf"}, "Schipperke": {"name": "Schipperke", "group": "Non-Sporting Group", "height": "10 to 13 in", "weight": "10 to 16 lb", "weight_note": null, "description": "Standing no higher than 13 inches, Schipperkes are small dogs built for hard work. Schips were created as ratters and watchdogs. Their powerful jaws, necks, and forequarters—coupled with a stealthy, catlike hunting style—make them ideal rat-catching machines. The black coat is profuse around the neck, shoulders, and legs, giving the breed a silhouette that accentuates a thick, substantial body. The foxy face completes the unique look of a unique breed. If you can’t tell a Schipperke from an ordinary dog, you simply haven’t been paying attention. The Schipperke, Belgium's \"little captain,\" is the traditional barge dog of the Low Countries. Curious, lively, and intense but mischievous, this little black dog is a robust, long-lived companion for whom there is never a dull moment.", "temperament": "Confident, Alert, Curious", "grooming": "Weekly Brushing", "shedding": "Seasonal", "energy": "Energetic", "life_expectancy": "12 to 14 years", "size_category": "Small", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/schipperke/", "official_standard": {"size": "Males 11 to 13 in; females 10 to 12 in at withers (suggested)", "coat": "Abundant, straight, slightly harsh; distinct lengths forming ruff, cape, culottes; short on face", "color": "Outercoat must be black; undercoat may be slightly lighter; any other color disqualified"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Non-Sporting_Group.pdf"}, "Scottish Deerhound": {"name": "Scottish Deerhound", "group": "Hound Group", "height": "28 to 32 in", "weight": "Males 85 to 110 lb, females 75 to 95 lb", "weight_note": null, "description": "Stand back: You need a little distance to fully appreciate the majesty of this ancient beast. In silhouette we see a noble coursing hound struck from the classic Greyhound template. Deerhounds are, though, much larger and more substantial than Greyhounds—a good-size male can stand 32 inches at the shoulder and weigh 110 pounds. The crisp coat is seen in several colors; breed aficionados prefer the dark blue-gray coat. The tapered head and long neck add extra lift to an already stately hound. The crisply coated Scottish Deerhound, “Royal Dog of Scotland,” is a majestically large coursing hound struck from the ancient Greyhound template. Among the tallest of dog breeds, the Deerhound was bred to stalk the giant wild red deer.", "temperament": "Gentle, Dignified, Polite", "grooming": "Occasional Bath/Brush", "shedding": "Seasonal", "energy": "Regular Exercise", "life_expectancy": "8 to 11 years", "size_category": "Large", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/scottish-deerhound/", "official_standard": {"size": "Dogs 30 to 32 inches and 85 to 110 pounds; bitches 28 inches and up and 75 to 95 pounds", "coat": "Harsh, wiry, about 3 to 4 inches on body; softer on head, breast, belly", "color": "Dark blue-gray most preferred; grays, brindles, yellow, sandy red; white blaze or white collar disqualifies"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Hound_Group.pdf"}, "Scottish Terrier": {"name": "Scottish Terrier", "group": "Terrier Group", "height": "10 in", "weight": "18 to 22 lb", "weight_note": null, "description": "The well-known Scottie silhouette is that of a short-legged but substantial terrier with distinctive furnishings at the beard, legs, and lower body. The wiry topcoat and soft, dense undercoat coat can be black, wheaten yellow, or a brindle-stripe pattern. Bright, piercing eyes, and erect ears and tail, convey keen alertness—a hallmark of Britain’s terrier breeds.The Scottie working style has been described as efficient and businesslike, and their aloofness toward strangers makes them excellent watchdogs. Their hunting instinct remains strong, which can complicate life for the neighbor’s cat, and Scotties are known to be cantankerous around other dogs. This bold and clever Scotsman enjoys brisk walks and upbeat play. A solidly compact dog of vivid personality, the Scottish Terrier is an independent, confident companion of high spirits. Scotties have a dignified, almost-human character. Their terrier persistence has earned the breed the nickname “the Diehard.”", "temperament": "Confident, Independent, Spirited", "grooming": "2-3 Times a Week Brushing", "shedding": "Occasional", "energy": "Regular Exercise", "life_expectancy": "12 to 12 years", "size_category": "Small", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/scottish-terrier/", "official_standard": {"size": "Height about 10 inches at withers; weight 19 to 22 pounds for dogs, 18 to 21 pounds for bitches", "coat": "Broken coat with hard, wiry outer coat and soft, dense undercoat; trimmed to blend into furnishings", "color": "Black, wheaten, or brindle of any color; white allowed only slightly on chest and chin"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Terrier_Group.pdf"}, "Sealyham Terrier": {"name": "Sealyham Terrier", "group": "Terrier Group", "height": "10.5 in", "weight": "23 to 24 lb", "weight_note": null, "description": "Standing less than 11 inches at the shoulder and weighing about 24 pounds, Sealys are not big enough to be considered medium-sized dogs, but they stand among the strongest and most substantial of what we think of as small dogs.A typical Sealy is well-muscled, built low to ground, and moves easily with long, determined strides. The weatherproof coat is predominantly white, and a long, broad head is furnished with lavish facial hair. Despite their rep as the bruiser among short-legged terriers, Sealys are cute, funny, affectionate, outgoing, and trainable, if a bit stubborn. Their alertness and a big-dog bark make Sealys excellent watchdogs. Blessed with an adaptable nature, Sealys are amenable to city dwelling or country life. The Sealyham Terrier is brave and spirited, but not as spiky as smaller terriers. These sturdy, outgoing companions are recognized by their “fall,” the mass of hair covering the forehead. Sealy fans enjoy their dog’s sly sense of humor.", "temperament": "Alert, Outgoing, Sense Of Humor", "grooming": "2-3 Times a Week Brushing", "shedding": "Seasonal", "energy": "Regular Exercise", "life_expectancy": "12 to 14 years", "size_category": "Small", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/sealyham-terrier/", "official_standard": {"size": "Height about 10½ inches at withers; weight 23 to 24 pounds for dogs, bitches slightly less", "coat": "Weather-resisting, soft dense undercoat with hard, wiry top coat; silky or curly coat is a bad fault", "color": "All white, or white with lemon, tan or badger markings on head and ears; heavy body markings discouraged"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Terrier_Group.pdf"}, "Shetland Sheepdog": {"name": "Shetland Sheepdog", "group": "Herding Group", "height": "13 to 16 in", "weight": "15 to 25 lb", "weight_note": null, "description": "The Shetland Sheepdog is a small, active, and agile herding dog standing between 13 and 16 inches at the shoulder. The long coat is harsh and straight, with a dense undercoat, and comes in black, blue merle, and sable, with white markings. The coat, along with a long, wedge-shaped head; small, three-quarter erect ears; and deep-chested, level-backed torso, give Shelties the look of a rough-coated Collie in miniature.Bright and eager Shelties are easy trainers and world-class competitors in obedience, agility, and herding trials. They are sensitive and affectionate family dogs, highly in tune with the mood of the household. They like to bark and tend to be reserved toward strangers—two qualifications of an excellent watchdog. The Shetland Sheepdog, also known as the Sheltie, is an extremely intelligent, quick, and obedient herder from Scotland’s remote and rugged Shetland Islands. Shelties bear a strong family resemblance to their bigger cousin, the Collie.", "temperament": "Playful, Energetic, Bright", "grooming": "2-3 Times a Week Brushing", "shedding": "Seasonal", "energy": "Regular Exercise", "life_expectancy": "12 to 14 years", "size_category": "Small", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/shetland-sheepdog/", "official_standard": {"size": "13 to 16 inches at the shoulder", "coat": "Double coat; long, straight, harsh outer coat over a short, dense, furry undercoat", "color": "Black, blue merle, and sable (golden through mahogany), with varying amounts of white and/or tan"}, "official_standard_url": "https://images.akc.org/pdf/judges/Herding_Group_7-16.pdf"}, "Shiba Inu": {"name": "Shiba Inu", "group": "Non-Sporting Group", "height": "13.5 to 16.5 in", "weight": "17 to 23 lb", "weight_note": null, "description": "Brought to America from Japan as recently as 60 years ago, Shibas are growing in popularity in the West and are already the most popular breed in their homeland. Their white markings combined with their coloring (red, red sesame, or black and tan) and their alert expression and smooth stride makes them almost foxlike. They’re sturdy, muscular dogs with a bold, confident personality to match. An ancient Japanese breed, the Shiba Inu is a little but well-muscled dog once employed as a hunter. Today, the spirited, good-natured Shiba is the most popular companion dog in Japan. The adaptable Shiba is at home in town or country.", "temperament": "Alert, Active, Attentive", "grooming": "Weekly Brushing", "shedding": "Seasonal", "energy": "Regular Exercise", "life_expectancy": "13 to 16 years", "size_category": "Small", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/shiba-inu/", "official_standard": {"size": "Males 14½ to 16½ in; females 13½ to 15½ in at withers; about 23 lb males, 17 lb females", "coat": "Double coat: stiff straight outer coat, soft thick undercoat; short on face, ears, legs; natural state preferred", "color": "Red, black with tan points, or sesame, each with required urajiro cream-white markings; cream or white is a serious fault"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Non-Sporting_Group.pdf"}, "Shih Tzu": {"name": "Shih Tzu", "group": "Toy Group", "height": "9 to 10.5 in", "weight": "9 to 16 lb", "weight_note": null, "description": "Shih Tzu (pronounced in the West “sheed-zoo” or “sheet-su”; the Chinese say “sher-zer”), weighing between 9 to 16 pounds, and standing between 8 and 11 inches, are surprisingly solid for dogs their size. The coat, which comes in many colors, is worth the time you will put into it—few dogs are as beautiful as a well-groomed Shih Tzu.Being cute is a way of life for this lively charmer. The Shih Tzu is known to be especially affectionate with children. As a small dog bred to spend most of their day inside royal palaces, they make a great pet if you live in an apartment or lack a big backyard. Some dogs live to dig holes and chase cats, but a Shih Tzu’s idea of fun is sitting in your lap acting adorable as you try to watch TV. That face! Those big dark eyes looking up at you with that sweet expression! It’s no surprise that Shih Tzu owners have been so delighted with this little “Lion Dog” for a thousand years. Where Shih Tzu go, giggles and mischief follow.", "temperament": "Affectionate, Playful, Outgoing", "grooming": "Daily Brushing", "shedding": "Infrequent", "energy": "Regular Exercise", "life_expectancy": "10 to 18 years", "size_category": "Small", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/shih-tzu/", "official_standard": {"size": "Height at withers 9 to 10½ inches ideally (8 to 11 inches allowed); mature weight ideally 9 to 16 pounds", "coat": "Long, dense, flowing double coat; slight wave permissible; top hair tied up", "color": "All colors and markings permissible and considered equal"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Toy_Group.pdf"}, "Siberian Husky": {"name": "Siberian Husky", "group": "Working Group", "height": "20 to 23.5 in", "weight": "35 to 60 lb", "weight_note": null, "description": "The graceful, medium-sized Siberian Husky’s almond-shaped eyes can be either brown or blue—and sometimes one of each—and convey a keen but amiable and even mischievous expression. Quick and nimble-footed, Siberians are known for their powerful but seemingly effortless gait. Tipping the scales at no more than 60 pounds, they are noticeably smaller and lighter than their burly cousin, the Alaskan Malamute. In fact, breeders and fanciers prefer the moniker Siberians over huskies, as the latter suggests a bigger, brawnier dog than what is the standard for the breed.As born pack dogs, Siberians enjoy family life and get on well with other dogs; their innate friendliness render them indifferent watchdogs. This breed is also energetic and can’t resist chasing small animals, so secure running room is a must. An attractive feature of the breed: Siberians are naturally clean, with little doggy odor. The Siberian Husky, a thickly coated, compact sled dog of medium size and great endurance, was developed to work in packs, pulling light loads at moderate speeds over vast frozen expanses. This northern breed is friendly, fastidious, and dignified.", "temperament": "Loyal, Mischievous, Outgoing", "grooming": "Weekly Brushing", "shedding": "Seasonal", "energy": "Energetic", "life_expectancy": "12 to 14 years", "size_category": "Medium", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/siberian-husky/", "official_standard": {"size": "Dogs 21 to 23½ inches, 45 to 60 pounds; bitches 20 to 22 inches, 35 to 50 pounds", "coat": "Double, medium-length coat that is well furred without obscuring outline; soft dense undercoat; smooth-lying guard hairs", "color": "Black, gray, agouti, sable, red, and white, solid or with white markings; merle and brindle disqualify"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Working_Group.pdf"}, "Silky Terrier": {"name": "Silky Terrier", "group": "Toy Group", "height": "9 to 10 in", "weight": "about 10 lb (AKC lists one figure)", "weight_note": null, "description": "Small but not fragile, feisty but not yappy, pretty but not sculpted, Silkys are 10-inch-tall dynamos animated by curiosity and high spirits. The glorious blue-and-tan coat is straight and glossy, and it feels and behaves much like human hair. The wedge-shaped head is topped by profuse hair parted down the middle, and erect V-shaped ears draw attention to the keen, piercing expression of the almond-shaped eyes. Silkys are more refined than typical ratting terriers, but they should still look and behave like a true earthdog. A charming member of the AKC Toy Group, the compact, glossy-coated Silky Terrier is nonetheless a true terrier of energetic high spirits. The Silky, a native of Sydney, Australia, is larger than his close cousin, the Yorkshire Terrier.", "temperament": "Friendly, Quick, Keenly Alert", "grooming": "2-3 Times a Week Brushing", "shedding": "Occasional", "energy": "Regular Exercise", "life_expectancy": "13 to 15 years", "size_category": "Toy", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/silky-terrier/", "official_standard": {"size": "Shoulder height 9 to 10 inches", "coat": "Silky, straight, single, glossy coat falling to body outline, not floor length, with topknot", "color": "Blue and tan; deep, rich tan on muzzle, cheeks, ear bases, legs, feet, vent; silver or fawn topknot"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Toy_Group.pdf"}, "Soft Coated Wheaten Terrier": {"name": "Soft Coated Wheaten Terrier", "group": "Terrier Group", "height": "17 to 19 in", "weight": "30 to 40 lb", "weight_note": null, "description": "The hallmark of these merry extroverts, and what sets them apart from other terriers, is the silky, gently waving coat. It runs from a pale beige to a shimmering gold, recalling the color of ripening wheat. Topping out at 19 inches tall and 40 pounds, Wheatens are square, sturdy terriers with a peek-a-boo hairdo and dashing goatee. The overall picture is that of a hard-muscled but soft-coated working terrier or, as the breed has been described, an iron fist in a velvet glove. The Soft Coated Wheaten Terrier, an exuberant Irish farm dog, is happy, friendly, deeply devoted, and just stubborn enough to remind you he’s a terrier. The unique wheaten coat is low-shedding but needs diligent care to avoid matting.", "temperament": "Friendly, Happy, Deeply Devoted", "grooming": "2-3 Times a Week Brushing", "shedding": "Infrequent", "energy": "Energetic", "life_expectancy": "12 to 14 years", "size_category": "Medium", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/soft-coated-wheaten-terrier/", "official_standard": {"size": "Dogs 18 to 19 inches, bitches 17 to 18 inches at withers; dogs 35 to 40 pounds, bitches 30 to 35 pounds", "coat": "Abundant single coat, soft and silky with gentle wave, covering body, legs and head; never clipped or plucked", "color": "Any shade of wheaten; occasional red, white or black guard hairs; blue-gray shading sometimes on ears and muzzle"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Terrier_Group.pdf"}, "Staffordshire Bull Terrier": {"name": "Staffordshire Bull Terrier", "group": "Terrier Group", "height": "14 to 16 in", "weight": "24 to 38 lb", "weight_note": null, "description": "At 14 to 16 inches, Staffordshire Bull Terriers do not stand particularly tall. But, weighing anywhere between 24 to 38 pounds, they pour a gallon of dog into a quart-size container. These are rock-solid, muscular terriers. The head is short and broad, with pronounced cheek muscles, and the tight-fitting coat comes in several colors.Staffordshire Bull Terriers still resemble the pugnacious brawlers who once ruled England’s fighting pits. But today’s responsible breeders are producing sweet-natured, family-oriented dogs with a reputation for being patient with kids. These are true-blue loyal companions, but the old fighting instinct still lurks within—making it vital that pups be socialized with other dogs to learn good canine manners. From his brawling past, the muscular but agile Staffordshire Bull Terrier retains the traits of courage and tenacity. Happily, good breeding transformed this former gladiator into a mild, playful companion with a special feel for kids.", "temperament": "Clever, Brave, Tenacious", "grooming": "Weekly Brushing", "shedding": "Occasional", "energy": "Energetic", "life_expectancy": "12 to 14 years", "size_category": "Medium", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/staffordshire-bull-terrier/", "official_standard": {"size": "Height 14 to 16 inches at shoulder; weight 28 to 38 pounds for dogs, 24 to 34 pounds for bitches", "coat": "Smooth, short, close to the skin; not to be trimmed or de-whiskered", "color": "Red, fawn, white, black or blue, or these with white; any brindle or brindle with white; black-and-tan, liver and merle disqualified"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Terrier_Group.pdf"}, "Standard Schnauzer": {"name": "Standard Schnauzer", "group": "Working Group", "height": "17.5 to 19.5 in", "weight": "30 to 50 lb", "weight_note": null, "description": "A medium-sized dog weighing between 35 and 45 pounds, the Standard Schnauzer is truly the standard Schnauzer: larger than Miniatures, smaller than Giants. Schnauzers of all three sizes share several breed hallmarks: a wiry, tight-fitting coat of pure black or “pepper and salt”; a robust, square-built frame; and an elongated head furnished with arched eyebrows and bristly whiskers, framing eyes gleaming with keen intelligence.Standards are sociable companions, alert watchdogs, enthusiastic backyard squirrel chasers, and are good with kids and protective of loved ones. Approached with a firm but gentle hand, Standards train beautifully. Owners must provide outlets for their dog’s upbeat athleticism and highly developed senses. The bold, bewhiskered Standard Schnauzer is a high-spirited farm dog from Germany. They are the sometimes-willful but ever reliable medium-sized members of the Schnauzer family of breeds. The Standard's sporty look is a canine classic.", "temperament": "Fearless, Smart, Spirited", "grooming": "2-3 Times a Week Brushing", "shedding": "Infrequent", "energy": "Regular Exercise", "life_expectancy": "13 to 16 years", "size_category": "Medium", "varieties": "Giant, Standard and Miniature Schnauzers are three separate AKC breeds.", "akc_url": "https://www.akc.org/dog-breeds/standard-schnauzer/", "official_standard": {"size": "Males 18½ to 19½ inches; females 17½ to 18½ inches at highest point of shoulder blades", "coat": "Tight, hard, wiry, dense coat with soft close undercoat and harsh outer coat; beard and leg furnishings", "color": "Pepper and salt or pure black; other colors and shadings faulted"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Working_Group.pdf"}, "Sussex Spaniel": {"name": "Sussex Spaniel", "group": "Sporting Group", "height": "13 to 15 in", "weight": "35 to 45 lb", "weight_note": null, "description": "Sussex are long, low-built bird dogs of great strength and endurance. Topping out at just 15 inches tall at the shoulder, Sussex are nonetheless described as “massive,” with a deep chest and heavy bone. Their trademark is an abundant, feathery coat of rich golden-liver. The classic spaniel head, with its wavy-coated ears and big hazel eyes, projects a somber, frowning expression delightfully at odds with the Sussex’s innate cheerfulness. \"Placid, affectionate, even-tempered, true-blue, loyal\" — all are words used to describe the Sussex Spaniel, a slow-but-steady hunter and congenial housedog. His frowning expression is delightfully at odds with a typically cheerful nature.", "temperament": "Friendly, Merry, Even-Tempered", "grooming": "2-3 Times a Week Brushing", "shedding": "Seasonal", "energy": "Regular Exercise", "life_expectancy": "13 to 15 years", "size_category": "Medium", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/sussex-spaniel/", "official_standard": {"size": "Height at withers 13 to 15 inches; weight 35 to 45 pounds", "coat": "Abundant flat or slightly waved body coat with no tendency to curl; moderately feathered legs, clean below hocks", "color": "Rich golden liver only; white on chest is a minor fault, white elsewhere a major fault"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Sporting_Group.pdf"}, "Tibetan Mastiff": {"name": "Tibetan Mastiff", "group": "Working Group", "height": "24 to 26 in", "weight": "70 to 150 lb", "weight_note": null, "description": "Coming face to face with this ancient behemoth, an intruder up to no good will likely move on to easier pickings. TMs can stand 26 inches at the shoulder and weigh well over 100 pounds. It’s impossible to discuss this breed without leaning on words like “powerful,” “muscular,” “massive,” and “substantial.” And yet, TMs are quite light-footed and will meet a perceived threat with surprising agility. The broad head, with its high-set, V-shaped ears and expressive brown eyes, projects a noble, sagacious expression. Watchful, aloof, imposing, and intimidating: The ancient Tibetan Mastiff is the guardian dog supreme. These densely-coated giants are mellow and calm around the house, sweetly devoted to family, and aloof and territorial with strangers.", "temperament": "Independent, Reserved, Intelligent", "grooming": "2-3 Times a Week Brushing", "shedding": "Seasonal", "energy": "Regular Exercise", "life_expectancy": "10 to 12 years", "size_category": "Giant", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/tibetan-mastiff/", "official_standard": {"size": "Dogs 26 to 29 inches preferred; bitches 24 to 27 inches preferred; dogs under 25 inches and bitches under 23 inches disqualified at 18 months or older", "coat": "Double coat with coarse guard hair and woolly undercoat; straight, stand-off hair, never silky, curly, or wavy", "color": "Black, brown, or blue/grey, with or without tan markings; also gold; white on chest and feet acceptable; other colors and particolors disqualify"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Working_Group.pdf"}, "Tibetan Terrier": {"name": "Tibetan Terrier", "group": "Non-Sporting Group", "height": "14 to 17 in", "weight": "18 to 30 lb", "weight_note": null, "description": "Bearing a passing resemblance to their smaller cousin, the Lhasa Apso, Tibetan Terriers reside at the lower end of medium-sized breeds, standing about 15 inches at the shoulder and weighing between 20 and 24 pounds. A breed hallmark is the beautiful and profuse double coat—wooly underneath, with a long, fine topcoat. TTs are unique among dogs for their large, flat “snowshoe” feet, adapted over centuries to help them negotiate the snowy, mountainous terrain of their homeland. The Tibetan Terrier, “Holy Dog of Tibet,” is an ancient watchdog and companion long associated with Buddhist monasteries. A profusely coated, small-to-medium-sized dog with “snowshoe” feet, the TT is affectionate, sensitive, and clever.", "temperament": "Affectionate, Loyal, Sensitive", "grooming": "2-3 Times a Week Brushing", "shedding": "Seasonal", "energy": "Energetic", "life_expectancy": "15 to 16 years", "size_category": "Small", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/tibetan-terrier/", "official_standard": {"size": "Average 20 to 24 lb (range 18 to 30 lb); dogs average 15 to 16 in, bitches slightly smaller; faults above 17 or below 14 in", "coat": "Double coat: soft woolly undercoat, profuse fine outer coat, wavy or straight, not hanging to ground", "color": "Any color or combination, including white; no preferred colors"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Non-Sporting_Group.pdf"}, "Treeing Walker Coonhound": {"name": "Treeing Walker Coonhound", "group": "Hound Group", "height": "20 to 27 in", "weight": "50 to 70 lb", "weight_note": null, "description": "Few things can quicken a coon hunter’s pulse like the sight of this swift, tricolored hound in full stride—the long, muscular legs, the powerful and propulsive hindquarters, and the streamlined frame all working to cover maximum ground with minimum effort. Later, basking in the warmth of a campfire after an honest night’s work, this sweet-faced hound will look up and stir your soul with his gentle, pleading expression. Mercy, what a pretty picture! No wonder Treeing Walkers are called the People’s Choice. A smart, brave, and sensible hunter, the Treeing Walker Coonhound is a genuine American favorite, nicknamed \"The People’s Choice.\" Don’t let the name fool you—Walkers are runners and are capable of covering a lot of ground in a hurry.", "temperament": "Smart, Brave, Courteous", "grooming": "Occasional Bath/Brush", "shedding": "Seasonal", "energy": "Regular Exercise", "life_expectancy": "12 to 13 years", "size_category": "Large", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/treeing-walker-coonhound/", "official_standard": {"size": "Males 22 to 27 inches; females 20 to 25 inches at shoulders", "coat": "Smooth, glossy, short, dense, hard hound coat", "color": "Tri-colored preferred (white, black, tan); other combinations penalized"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Hound_Group.pdf"}, "Vizsla": {"name": "Vizsla", "group": "Sporting Group", "height": "21 to 24 in", "weight": "44 to 60 lb", "weight_note": null, "description": "The Vizsla is easily recognized by his sleek golden-rust coat. They can stand between 21 to 24 inches at the shoulder and are the picture of a lean, light-footed hunter’s companion. The long, silky ears frame a facial expression that is sensitive and loving around the house and intense when at work. As a hunter expected to work closely with humans, Vizslas form a tight bond with their owners and hate to be left alone.Athletes of many talents, Vizslas excel at various sports and activities. They are eager and graceful trotters of great stamina, making them ideal jogging or biking companions. An expert on the breed tells us, “If you don’t have the time to encourage this breed’s full use of its brain, you’re wasting a good dog.” The Vizsla is a versatile, red-coated gundog built for long days in the field. For centuries, these rugged but elegant athletes have been the pride of Hungarian sportsmen and their popularity in America increases with each passing year.", "temperament": "Affectionate, Gentle, Energetic", "grooming": "Weekly Brushing", "shedding": "Seasonal", "energy": "Energetic", "life_expectancy": "12 to 14 years", "size_category": "Medium", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/vizsla/", "official_standard": {"size": "Ideal male 22 to 24 inches, ideal female 21 to 23 inches at highest point over shoulder blades", "coat": "Short, smooth, dense, close-lying coat without woolly undercoat", "color": "Golden rust in varying shades; white on forechest and toes permissible"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Sporting_Group.pdf"}, "Weimaraner": {"name": "Weimaraner", "group": "Sporting Group", "height": "23 to 27 in", "weight": "55 to 90 lb", "weight_note": null, "description": "Instantly recognized by a distinctive silvery-gray coat, male Weimaraners stand 25 to 27 inches at the shoulder, and females 23 to 25 inches. A properly bred Weimaraner will be solid colored, with maybe a small white spot on the chest. The face, with its amber or blue-gray eyes framed by long velvety ears, is amiable and intelligent. Overall, the breed presents a picture of streamlined grace and balance. A well-conditioned Weimaraner on point is a breathtaking sight.Weimaraners are excellent with kids and yearn to be full-fledged family members. Easy grooming, trainability, a loving nature, and a can-do-attitude make them excellent pets, as long as owners are committed to keeping them physically active and mentally engaged. The Weimaraner, Germany’s sleek and swift “Gray Ghost,” is beloved by hunters and pet owners alike for their friendliness, obedience, and beauty. They enjoy exercise, and plenty of it, along with lots of quality time with their humans.", "temperament": "Friendly, Fearless, Obedient", "grooming": "Weekly Brushing", "shedding": "Seasonal", "energy": "Needs Lots of Activity", "life_expectancy": "10 to 13 years", "size_category": "Large", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/weimaraner/", "official_standard": {"size": "Dogs 25 to 27 inches, bitches 23 to 25 inches at withers", "coat": "Short, smooth and sleek, solid-colored coat", "color": "Shades of mouse-gray to silver-gray; small white chest marking permitted"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Sporting_Group.pdf"}, "Welsh Springer Spaniel": {"name": "Welsh Springer Spaniel", "group": "Sporting Group", "height": "17 to 19 in", "weight": "35 to 55 lb", "weight_note": null, "description": "Standing between 17 and 19 inches at the shoulder, Welshies are described by their fans as being of “handy size”: bigger and stronger than Cocker Spaniels but smaller than English Springers.Welshies have two hallmarks that distinguish them from other spaniels: A uniquely tapered head and an eye-catching coat of bold red and white patterns. The beautiful coat isn’t just ornamental—it’s a waterproof, weatherproof, and thornproof suit that enables Welshies to show off their renowned versatility in all climates and on all terrains. The Welsh Springer Spaniel is a vigorous, medium-sized bird dog of happy disposition, known for versatility in the field, companionability at home, and dashing good looks anywhere. The Welshie is among Britain's oldest sporting breeds.", "temperament": "Happy, Reserved, Upbeat", "grooming": "Weekly Brushing", "shedding": null, "energy": "Energetic", "life_expectancy": "12 to 15 years", "size_category": "Medium", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/welsh-springer-spaniel/", "official_standard": {"size": "Dogs ideally 18 to 19 inches, bitches 17 to 18 inches at withers", "coat": "Naturally straight, flat, soft coat; moderate feathering on forelegs, hind legs above hocks, chest, and belly", "color": "Rich red and white only; any pattern acceptable, and white areas may be flecked with red ticking"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Sporting_Group.pdf"}, "West Highland White Terrier": {"name": "West Highland White Terrier", "group": "Terrier Group", "height": "10 to 11 in", "weight": "15 to 20 lb", "weight_note": null, "description": "Standing 10 to 11 inches at the shoulder, with dark piercing eyes, compact body, and a carrot-shaped tail wagging with delight, the Westie’s looks are irresistible. Beneath the plush-toy exterior, though, is a true working terrier of gameness and courage. Bred to hunt rats and other underground rodents, Westies are surprisingly strong and tough. The all-white double coat is hard to the touch, not soft and fluffy.Alert and active, Westies exhibit traits of a plucky and self-reliant ratting terrier: They require no pampering, they will chase after anything that moves, and their independence can make training a challenge. But, thanks to their faithfulness and keen intelligence, Westies will train nicely with time and patience. Smart, confident, and always entertaining at play, the adorable West Highland White Terrier (Westie, for short) has charmed owners for over 300 years. This diminutive but sturdy earthdog is among the most popular of the small terriers.", "temperament": "Loyal, Happy, Entertaining", "grooming": "Daily Brushing", "shedding": "Seasonal", "energy": "Regular Exercise", "life_expectancy": "13 to 15 years", "size_category": "Small", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/west-highland-white-terrier/", "official_standard": {"size": "Ideal 11 inches at withers for dogs, 10 inches for bitches; slight deviation acceptable", "coat": "Hard, weather-resistant double coat: straight hard outer hair with a short soft undercoat; jacket hair about 1.5 to 2 inches", "color": "Pure white"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Terrier_Group.pdf"}, "Whippet": {"name": "Whippet", "group": "Hound Group", "height": "18 to 22 in", "weight": "25 to 40 lb", "weight_note": null, "description": "At somewhere between 18 and 22 inches at the shoulder, the Whippet looks like a Greyhound, but smaller. The Whippet exhibits the classic “inverted S” lines of the sighthound. The deep chest and trim waist; a lean head supported by a long, arched neck; and slim but sturdy legs combine in a picture of an agile, fleet-footed athlete.Between bursts of intense pursuit, Whippets love to stretch out and relax for long hours, enjoying the role of a loving, and loved, companion. Whippets like a fenced yard to run in, but they do nicely in cozy apartments too—as long as they are exercised properly. Another plus for city dwellers: Whippets rarely bark. Despite the breed’s elegant looks, the Whippet is a robust, low-maintenance dog. The sleek, sweet-faced Whippet, the “Poor Man’s Racehorse,” is lightning quick. He is an amiable, dignified, and gentle soul, but give him something to chase and he’s all business. The name Whippet is synonymous with streamlined grace.", "temperament": "Affectionate, Playful, Calm", "grooming": "Occasional Bath/Brush", "shedding": "Occasional", "energy": "Regular Exercise", "life_expectancy": "12 to 15 years", "size_category": "Medium", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/whippet/", "official_standard": {"size": "Dogs 19 to 22 inches; bitches 18 to 21 inches at withers", "coat": "Short, close, smooth, firm", "color": "Color immaterial"}, "official_standard_url": "https://images.akc.org/pdf/judges/groups/Hound_Group.pdf"}, "Wire Fox Terrier": {"name": "Wire Fox Terrier", "group": "Terrier Group", "height": "15 in", "weight": "15 to 18 lb", "weight_note": null, "description": "The Wire Fox Terrier, 16 to 18 pounds of coiled energy, is a sturdy, symmetrical, short-backed hunter with fire and intelligence shining in its dark, round eyes. The predominantly white coat is rough and wiry; the V-shaped ears are neatly folded forward, the better to point up the face’s distinctive, and completely irresistible, expression.Wires are delightful pets for families looking for an upbeat, friendly companion with loads of personality. As terriers, they possess the typical independence and prey drive of this feisty canine clan. They are smart and companionable; training can be a challenge but by no means impossible. Excellent athletes, natural comedians, and charming housemates, Wires are long-lived and low-shedding. The Wire Fox Terrier breed standard says they should be “on the tip-toe of expectation at the slightest provocation.” Once a mainstay of traditional British foxhunts, today’s Wire is a handsome and amusing companion and master show dog.", "temperament": "Confident, Alert, Gregarious", "grooming": "Weekly Brushing", "shedding": "Infrequent", "energy": "Regular Exercise", "life_expectancy": "12 to 15 years", "size_category": "Small", "varieties": null, "akc_url": "https://www.akc.org/dog-breeds/wire-fox-terrier/", "official_standard": {"size
